<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кастомные ROM | olegmmg</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<nav class="nav-bar">
  <a class="nav-logo" href="/">⚡ olegmmg</a>
  <div class="nav-links">
    <a class="nav-link active" href="/roms/"><i class="fas fa-microchip"></i> ROM</a>
    <a class="nav-link" href="/recovery/"><i class="fas fa-tools"></i> Recovery</a>
    <a class="nav-link" href="/stock/"><i class="fas fa-box"></i> Сток</a>
    <a class="nav-link" href="/repo"><i class="fas fa-cube"></i> iOS Repo</a>
  </div>
  <div class="nav-right">
    <button class="theme-toggle" id="themeToggle"><i class="fas fa-sun"></i> Светлая</button>
  </div>
</nav>

<div class="page-header">
  <h1><i class="fas fa-microchip"></i> Кастомные ROM</h1>
  <p>Выберите марку → модель для просмотра прошивок</p>
</div>

<div class="container">
  <div class="filter-section">
    <span class="filter-label"><i class="fas fa-tag"></i> МАРКА</span>
    <div class="pills" id="brandPills">
      <button class="pill active" data-brand="all"><i class="fas fa-layer-group"></i> Все</button>
      <button class="pill" data-brand="samsung"><i class="fab fa-samsung"></i> Samsung</button>
      <button class="pill" data-brand="xiaomi"><i class="fas fa-mobile-alt"></i> Xiaomi</button>
      <button class="pill" data-brand="google"><i class="fab fa-google"></i> Google</button>
      <button class="pill" data-brand="oneplus"><i class="fas fa-mobile-alt"></i> OnePlus</button>
      <button class="pill" data-brand="other"><i class="fas fa-tablet-alt"></i> Другие</button>
    </div>
  </div>
  <div class="search-row">
    <div class="search-wrap">
      <i class="fas fa-search search-icon"></i>
      <input class="search-box" id="searchBox" type="text" placeholder="Поиск устройства или codename...">
    </div>
  </div>
  <div class="stats-row">
    <span>Найдено: <strong id="countEl">...</strong></span>
    <button class="reset-btn" id="resetBtn"><i class="fas fa-undo-alt"></i> Сбросить</button>
  </div>
  <div class="models-grid" id="grid">
    <div class="loading-state"><div class="spinner"></div><p>Загрузка...</p></div>
  </div>
  <div class="page-footer">🧩 Кастомные ROM · by OlegMMG</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">—</h2>
      <button class="close-btn" id="closeBtn">&times;</button>
    </div>
    <div class="modal-filters">
      <label><i class="fab fa-android"></i> Android:</label>
      <select class="filter-select" id="filterAndroid"><option value="all">Все версии</option></select>
      <label><i class="fas fa-tag"></i> Статус:</label>
      <select class="filter-select" id="filterStatus"><option value="all">Все</option></select>
    </div>
    <table class="rom-table">
      <thead><tr><th>ROM</th><th>Android</th><th>Статус</th><th></th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyMsg" style="display:none;text-align:center;padding:2rem;color:#64748b">
      <i class="fas fa-compact-disc fa-2x" style="margin-bottom:.8rem"></i><br>Нет прошивок
    </div>
  </div>
</div>

<script>
(function(){
  const JSON_URL='roms.json';
  let devices={},roms={},brand='all',q='',cur=null,selA='all',selS='all';
  const grid=document.getElementById('grid'),countEl=document.getElementById('countEl'),
        search=document.getElementById('searchBox'),modal=document.getElementById('modal'),
        modalTitle=document.getElementById('modalTitle'),closeBtn=document.getElementById('closeBtn'),
        tableBody=document.getElementById('tableBody'),emptyMsg=document.getElementById('emptyMsg'),
        filterA=document.getElementById('filterAndroid'),filterS=document.getElementById('filterStatus');

  async function load(){
    try{
      const r=await fetch(JSON_URL);if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json();devices=d.devices||{};roms=d.roms||{};render();
    }catch(e){
      grid.innerHTML=`<div class="error-state"><i class="fas fa-exclamation-triangle fa-2x"></i><br>Ошибка загрузки: ${e.message}</div>`;
      countEl.textContent='—';
    }
  }

  function iconFor(b){
    return {samsung:'<i class="fab fa-samsung" style="color:#1428A0"></i>',
            google:'<i class="fab fa-google" style="color:#4285F4"></i>',
            xiaomi:'<i class="fas fa-mobile-alt" style="color:#ff6900"></i>',
            oneplus:'<i class="fas fa-mobile-alt" style="color:#eb0029"></i>'}[b]
           ||'<i class="fas fa-mobile-alt" style="color:#6366f1"></i>';
  }

  function allModels(){
    if(brand==='all')return Object.entries(devices).flatMap(([b,arr])=>arr.map(m=>({...m,brand:b})));
    return (devices[brand]||[]).map(m=>({...m,brand}));
  }

  function render(){
    let list=allModels();
    if(q){const lq=q.toLowerCase();list=list.filter(m=>m.name.toLowerCase().includes(lq)||m.codename.toLowerCase().includes(lq));}
    countEl.textContent=list.length;
    grid.innerHTML='';
    if(!list.length){grid.innerHTML='<div class="empty-state"><i class="fas fa-folder-open fa-3x"></i><br>Нет устройств</div>';return;}
    list.forEach(m=>{
      const rc=(roms[m.codename]||[]).length;
      const card=document.createElement('div');card.className='model-card';
      card.innerHTML=`<div class="card-icon">${iconFor(m.brand)}</div>
        <div class="model-name">${m.name}</div>
        <div class="codename">${m.codename}</div>
        <div class="card-badges"><span class="badge badge-STABLE" style="font-size:.7rem;margin-top:.4rem">${rc} ROM</span></div>`;
      card.onclick=()=>openModal(m);
      grid.appendChild(card);
    });
  }

  function openModal(m){
    cur=m;modalTitle.innerHTML=`${m.name} <small>${m.codename}</small>`;
    const items=roms[m.codename]||[];
    const avs=[...new Set(items.map(r=>r.android))].sort((a,b)=>parseFloat(b)-parseFloat(a));
    filterA.innerHTML='<option value="all">Все версии</option>'+avs.map(v=>`<option value="${v}">Android ${v}</option>`).join('');
    const sts=[...new Set(items.map(r=>r.status))];
    filterS.innerHTML='<option value="all">Все</option>'+sts.map(s=>`<option value="${s}">${s}</option>`).join('');
    selA='all';selS='all';filterA.value='all';filterS.value='all';
    renderTable();modal.classList.add('active');
  }

  function renderTable(){
    if(!cur)return;
    let items=roms[cur.codename]||[];
    if(selA!=='all')items=items.filter(r=>r.android===selA);
    if(selS!=='all')items=items.filter(r=>r.status===selS);
    tableBody.innerHTML='';emptyMsg.style.display=items.length?'none':'block';
    items.forEach(r=>{
      const tr=document.createElement('tr');tr.className='rom-row';
      tr.innerHTML=`<td><span class="rom-name">${r.name}</span></td>
        <td><span style="color:#94a3b8"><i class="fab fa-android"></i> ${r.android}</span></td>
        <td><span class="badge badge-${r.status}">${r.status}</span></td>
        <td><a href="${r.url}" class="dl-btn" target="_blank" rel="noopener"><i class="fas fa-download"></i> Скачать</a></td>`;
      tableBody.appendChild(tr);
    });
  }

  document.querySelectorAll('#brandPills .pill').forEach(p=>{
    p.onclick=()=>{document.querySelectorAll('#brandPills .pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');brand=p.dataset.brand;render();};
  });
  search.oninput=e=>{q=e.target.value;render();};
  document.getElementById('resetBtn').onclick=()=>{
    document.querySelectorAll('#brandPills .pill').forEach(x=>x.classList.remove('active'));
    document.querySelector('[data-brand="all"]').classList.add('active');
    brand='all';search.value='';q='';render();
  };
  closeBtn.onclick=()=>modal.classList.remove('active');
  modal.onclick=e=>{if(e.target===modal)modal.classList.remove('active');};
  filterA.onchange=e=>{selA=e.target.value;renderTable();};
  filterS.onchange=e=>{selS=e.target.value;renderTable();};
  load();
})();
</script>
</body>
</html>
