<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0a14;color:#e2e8f0;min-height:100vh}

/* ── Login ── */
.login{display:flex;align-items:center;justify-content:center;height:100vh}
.login-box{background:#14142a;border:1px solid #2a2a4a;border-radius:16px;padding:2rem;width:320px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-box h2{color:#6366F1;margin-bottom:1.4rem;font-size:1.4rem;display:flex;align-items:center;gap:.5rem}
.login-box input{width:100%;background:#0f0f1e;border:1px solid #2a2a4a;color:#fff;
  padding:.75rem 1rem;border-radius:8px;font-size:1rem;margin-bottom:.8rem;outline:none;letter-spacing:.1em}
.login-box input:focus{border-color:#6366F1}
.login-btn{width:100%;background:#6366F1;color:#fff;border:none;padding:.8rem;
  border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:.15s}
.login-btn:hover{background:#4F46E5}
.login-err{color:#f87171;font-size:.88rem;margin-top:.6rem;display:none;text-align:center}
.attempts{color:#888;font-size:.82rem;margin-top:.4rem;text-align:center}

/* ── App ── */
#app{display:none}
.sidebar{width:220px;background:#14142a;height:100vh;position:fixed;top:0;left:0;border-right:1px solid #1e1e3a;display:flex;flex-direction:column}
.logo{padding:1.2rem 1.2rem .8rem;font-weight:800;font-size:1.1rem;color:#6366F1;border-bottom:1px solid #1e1e3a;display:flex;align-items:center;gap:.5rem}
.nav{flex:1;padding:.6rem 0}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.75rem 1.2rem;color:#666;font-size:.92rem;font-weight:500;cursor:pointer;transition:.12s;border-left:3px solid transparent}
.nav-item:hover{color:#ccc;background:rgba(255,255,255,.03)}
.nav-item.active{color:#fff;border-left-color:#6366F1;background:rgba(99,102,241,.1)}
.nav-divider{height:1px;background:#1e1e3a;margin:.4rem 0}
.nav-label{padding:.4rem 1.2rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:#333}
.logout{padding:1rem 1.2rem;border-top:1px solid #1e1e3a}
.logout-btn{width:100%;background:#1e1e2e;color:#888;border:1px solid #2a2a4a;padding:.5rem;border-radius:6px;cursor:pointer;font-size:.85rem;transition:.12s}
.logout-btn:hover{color:#f87171;border-color:#f87171}

.main{margin-left:220px;padding:1.8rem;min-height:100vh}
.page{display:none}
.page.active{display:block}

.page-title{font-size:1.4rem;font-weight:700;color:#fff;margin-bottom:1.5rem;display:flex;align-items:center;gap:.6rem}

/* Stats */
.stats{display:flex;gap:1rem;margin-bottom:1.8rem;flex-wrap:wrap}
.stat{background:#14142a;border:1px solid #1e1e3a;border-radius:10px;padding:.9rem 1.4rem;min-width:130px}
.stat-n{font-size:1.8rem;font-weight:700;color:#6366F1}
.stat-l{font-size:.78rem;color:#555;margin-top:.1rem}

/* Cards */
.cards{display:flex;flex-direction:column;gap:1rem}
.card{background:#14142a;border:1px solid #1e1e3a;border-radius:12px;padding:1.2rem}
.card.pending{border-left:3px solid #fbbf24}
.card.accepted{border-left:3px solid #4ade80}
.card.rejected{border-left:3px solid #f87171;opacity:.6}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.8rem}
.card-name{font-weight:700;color:#fff;font-size:1rem}
.card-date{font-size:.78rem;color:#444}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .8rem;font-size:.86rem;margin-bottom:.9rem}
.ml{color:#444}
.mv{color:#bbb;word-break:break-all}
.mv code{font-family:monospace;color:#7a7a9a;font-size:.83rem}
.actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.btn{border:none;padding:.35rem .9rem;border-radius:6px;font-size:.82rem;font-weight:600;cursor:pointer;transition:.12s}
.btn-acc{background:#16A34A;color:#fff}.btn-acc:hover{background:#15803D}
.btn-rej{background:#DC2626;color:#fff}.btn-rej:hover{background:#B91C1C}
.btn-ret{background:#1e293b;color:#aaa;border:1px solid #2a2a4a}.btn-ret:hover{color:#fff}
.btn-sm{background:#1e1e2e;color:#888;border:1px solid #2a2a4a;padding:.3rem .7rem;border-radius:6px;font-size:.8rem;cursor:pointer}
.btn-sm:hover{color:#fff}
.lnk{color:#60a5fa;font-size:.82rem;text-decoration:none;border:1px solid #1e3a5f;padding:.25rem .65rem;border-radius:5px}
.lnk:hover{background:#1e3a5f}
.chk-row{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:#777;cursor:pointer}
.chk-row input{cursor:pointer;accent-color:#6366F1}

/* Tags */
.tag{display:inline-block;border-radius:10px;padding:.15rem .65rem;font-size:.72rem;font-weight:700;margin-left:.3rem}
.t-new{background:#fbbf24;color:#000}
.t-ex{background:#22c55e;color:#000}
.t-adm{background:rgba(99,102,241,.25);color:#a5b4fc}
.t-usr{background:rgba(34,197,94,.2);color:#4ade80}
.t-pending{background:rgba(251,191,36,.15);color:#fbbf24}
.t-accepted{background:rgba(74,222,128,.15);color:#4ade80}
.t-rejected{background:rgba(248,113,113,.15);color:#f87171}

/* Tabs */
.tabs{display:flex;border-bottom:2px solid #1e1e3a;margin-bottom:1.4rem}
.tab-btn{background:none;border:none;color:#555;padding:.7rem 1.2rem;font-size:.93rem;
  font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.12s}
.tab-btn.active{color:#fff;border-bottom-color:#6366F1}
.tab-btn:hover{color:#ccc}

/* Catalog tables */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;padding:.65rem .6rem;color:#444;font-weight:500;
  font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1e1e3a}
.tbl td{padding:.8rem .6rem;vertical-align:middle;border-bottom:1px solid rgba(255,255,255,.03)}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.tbl-name{font-weight:600;color:#fff}
.s-badge{display:inline-block;border-radius:10px;padding:.15rem .65rem;font-size:.73rem;font-weight:700}
.s-STABLE,.s-OFFICIAL,.s-LATEST{background:rgba(22,163,74,.15);color:#4ade80}
.s-BETA{background:rgba(202,138,4,.12);color:#fbbf24}
.s-PORT,.s-UNOFFICIAL{background:rgba(99,102,241,.15);color:#a5b4fc}
.s-LEGACY{background:rgba(75,85,99,.2);color:#6b7280}
.code{font-family:monospace;color:#7a7a9a;font-size:.82rem}

/* Add form */
.form-box{background:#14142a;border:1px solid #1e1e3a;border-radius:12px;padding:1.4rem;margin-bottom:1.5rem}
.form-box h3{color:#aaa;font-size:.9rem;margin-bottom:1rem;font-weight:600}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-size:.78rem;color:#555}
.field input,.field select{background:#0f0f1e;border:1px solid #2a2a4a;color:#fff;
  padding:.55rem .8rem;border-radius:6px;font-size:.9rem;outline:none}
.field input:focus,.field select:focus{border-color:#6366F1}
.field select option{background:#1e1e2e}
.full{grid-column:1/-1}
.form-btns{display:flex;gap:.6rem;margin-top:.8rem}
.btn-add{background:#6366F1;color:#fff;border:none;padding:.5rem 1.2rem;border-radius:6px;
  font-size:.88rem;font-weight:600;cursor:pointer}
.btn-add:hover{background:#4F46E5}
.btn-cancel-form{background:#1e1e2e;color:#888;border:1px solid #2a2a4a;padding:.5rem 1rem;
  border-radius:6px;font-size:.88rem;cursor:pointer}

/* Device selector */
.device-pills{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.dpill{background:#1e1e2e;border:1px solid #2a2a4a;border-radius:20px;padding:.35rem .9rem;
  font-size:.85rem;color:#888;cursor:pointer;transition:.12s}
.dpill:hover{color:#fff;border-color:#6366F1}
.dpill.active{background:rgba(99,102,241,.2);border-color:#6366F1;color:#fff}

.empty{text-align:center;padding:2.5rem;color:#333;font-size:.95rem}
</style>
</head>
<body>

<!-- Login -->
<div class="login" id="loginScreen">
  <div class="login-box">
    <h2>🔐 FlashTool Admin</h2>
    <input type="password" id="pwd" placeholder="Пароль" onkeydown="if(event.key==='Enter')login()"/>
    <button class="login-btn" onclick="login()">Войти</button>
    <div class="attempts" id="attemptsInfo"></div>
    <div class="login-err" id="loginErr">Неверный пароль</div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="sidebar">
    <div class="logo">⚡ FlashTool Admin</div>
    <nav class="nav">
      <div class="nav-label">Заявки</div>
      <div class="nav-item active" onclick="showPage('submissions')">📥 На рассмотрении <span id="badge" style="background:#fbbf24;color:#000;border-radius:10px;padding:.1rem .5rem;font-size:.72rem;margin-left:auto"></span></div>
      <div class="nav-item" onclick="showPage('accepted')">✅ Принятые</div>
      <div class="nav-item" onclick="showPage('rejected')">❌ Отклонённые</div>
      <div class="nav-divider"></div>
      <div class="nav-label">Каталог</div>
      <div class="nav-item" onclick="showPage('cat-roms')">🧩 ROM (Android)</div>
      <div class="nav-item" onclick="showPage('cat-samsung')">🔵 Samsung</div>
      <div class="nav-item" onclick="showPage('cat-rec')">🛠 Recovery</div>
      <div class="nav-item" onclick="showPage('cat-stock')">📦 Сток</div>
    </nav>
    <div class="logout"><button class="logout-btn" onclick="logout()">Выйти</button></div>
  </div>

  <div class="main">

    <!-- Stats always visible -->
    <div class="stats" id="statsBar"></div>

    <!-- Submissions -->
    <div class="page active" id="page-submissions">
      <div class="page-title">📥 Заявки на рассмотрении</div>
      <div class="cards" id="cards-pending"></div>
    </div>
    <div class="page" id="page-accepted">
      <div class="page-title">✅ Принятые заявки</div>
      <div class="cards" id="cards-accepted"></div>
    </div>
    <div class="page" id="page-rejected">
      <div class="page-title">❌ Отклонённые заявки</div>
      <div class="cards" id="cards-rejected"></div>
    </div>

    <!-- Catalog: Android ROMs -->
    <div class="page" id="page-cat-roms">
      <div class="page-title">🧩 ROM — Android</div>
      <div id="cat-roms-content"></div>
    </div>

    <!-- Catalog: Samsung -->
    <div class="page" id="page-cat-samsung">
      <div class="page-title">🔵 Samsung</div>
      <div class="tabs">
        <button class="tab-btn active" onclick="setSsTab('roms',this)">ROM</button>
        <button class="tab-btn" onclick="setSsTab('rec',this)">Recovery</button>
        <button class="tab-btn" onclick="setSsTab('stock',this)">Сток</button>
      </div>
      <div id="cat-samsung-content"></div>
    </div>

    <!-- Catalog: Recovery -->
    <div class="page" id="page-cat-rec">
      <div class="page-title">🛠 Recovery — Android</div>
      <div id="cat-rec-content"></div>
    </div>

    <!-- Catalog: Stock -->
    <div class="page" id="page-cat-stock">
      <div class="page-title">📦 Сток — Android</div>
      <div id="cat-stock-content"></div>
    </div>

  </div>
</div>

<script>
// ── Auth ─────────────────────────────────────────────────────────────────────
const PWD = 'SSunit01';
let attempts = 3;

function login() {
  const val = document.getElementById('pwd').value;
  if (val === PWD) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    attempts--;
    document.getElementById('loginErr').style.display = 'block';
    document.getElementById('attemptsInfo').textContent =
      attempts > 0 ? `Осталось попыток: ${attempts}` : '';
    document.getElementById('pwd').value = '';
    if (attempts <= 0) {
      document.getElementById('pwd').disabled = true;
      document.querySelector('.login-btn').disabled = true;
      document.getElementById('loginErr').textContent = 'Аккаунт заблокирован';
    }
  }
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('pwd').value = '';
  attempts = 3;
  document.getElementById('loginErr').style.display = 'none';
  document.getElementById('attemptsInfo').textContent = '';
}

// ── Data ──────────────────────────────────────────────────────────────────────
let submissions = [];
let romsDb = null, twrpDb = null, stockDb = null, samsungDb = null;
let currentSsTab = 'roms';
let currentRomBrand = null;

async function init() {
  loadSubmissions();
  renderStats();
  renderSubmissions();
  // Load databases
  try {
    const [r1,r2,r3,r4] = await Promise.all([
      fetch('../roms.json').then(r=>r.json()),
      fetch('../../recovery/twrp.json').then(r=>r.json()),
      fetch('../../stock/stock.json').then(r=>r.json()),
      fetch('../../samsung/samsung.json').then(r=>r.json())
    ]);
    romsDb=r1; twrpDb=r2; stockDb=r3; samsungDb=r4;
  } catch(e) { console.warn('DB load:', e); }
}

function loadSubmissions() {
  const raw = localStorage.getItem('ft_admin_subs');
  submissions = raw ? JSON.parse(raw) : demoData();
  if (!raw) saveSubmissions();
}
function saveSubmissions() {
  localStorage.setItem('ft_admin_subs', JSON.stringify(submissions));
}
function demoData() {
  return [
    {id:1, status:'pending', brand:'samsung', device_name:'Galaxy A52s', codename:'a52sxq',
     file_type:'recovery', fw_name:'OrangeFox R11.1', android_type:'OrangeFox',
     build:'A526BXXS9EWK1', bootloader:'A526BXXS9EWK1',
     url:'https://orangefox.download/device/a52sxq', is_new:true, by_admin:false,
     ts: new Date().toISOString()},
    {id:2, status:'pending', brand:'xiaomi', device_name:'Xiaomi 13 Pro', codename:'nuwa',
     file_type:'rom', fw_name:'crDroid 10.0', android_type:'14',
     build:'AP2A.240805.005', bootloader:'',
     url:'https://crdroid.net/nuwa/10', is_new:false, by_admin:false,
     ts: new Date(Date.now()-7200000).toISOString()}
  ];
}

// ── Pages ─────────────────────────────────────────────────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  event.currentTarget.classList.add('active');
  renderPage(id);
}

function renderPage(id) {
  if (id==='submissions') renderSubmissions();
  else if (id==='accepted') renderAccepted();
  else if (id==='rejected') renderRejected();
  else if (id==='cat-roms') renderCatRoms();
  else if (id==='cat-samsung') renderCatSamsung();
  else if (id==='cat-rec') renderCatRec();
  else if (id==='cat-stock') renderCatStock();
}

// ── Stats ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const pend = submissions.filter(s=>s.status==='pending').length;
  const acc  = submissions.filter(s=>s.status==='accepted').length;
  const rej  = submissions.filter(s=>s.status==='rejected').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-n">${submissions.length}</div><div class="stat-l">Всего заявок</div></div>
    <div class="stat"><div class="stat-n" style="color:#fbbf24">${pend}</div><div class="stat-l">На рассмотрении</div></div>
    <div class="stat"><div class="stat-n" style="color:#4ade80">${acc}</div><div class="stat-l">Принято</div></div>
    <div class="stat"><div class="stat-n" style="color:#f87171">${rej}</div><div class="stat-l">Отклонено</div></div>`;
  document.getElementById('badge').textContent = pend > 0 ? pend : '';
}

// ── Submission cards ──────────────────────────────────────────────────────────
function cardHtml(s) {
  const dt = new Date(s.ts).toLocaleString('ru');
  const ver = s.file_type==='recovery' ? s.android_type : `Android ${s.android_type}`;
  return `
  <div class="card ${s.status}">
    <div class="card-top">
      <div>
        <span class="card-name">${s.fw_name}</span>
        <span class="tag ${s.is_new?'t-new':'t-ex'}">${s.is_new?'🆕 Новое устройство':'✅ Есть в каталоге'}</span>
        <span class="tag t-${s.status}">${{pending:'⏳',accepted:'✅',rejected:'❌'}[s.status]}</span>
      </div>
      <span class="card-date">${dt}</span>
    </div>
    <div class="meta">
      <div><span class="ml">Бренд: </span><span class="mv">${s.brand}</span></div>
      <div><span class="ml">Устройство: </span><span class="mv">${s.device_name}</span></div>
      <div><span class="ml">Codename: </span><span class="mv"><code>${s.codename}</code></span></div>
      <div><span class="ml">Тип файла: </span><span class="mv">${s.file_type}</span></div>
      <div><span class="ml">Версия: </span><span class="mv">${ver}</span></div>
      <div><span class="ml">Build: </span><span class="mv"><code>${s.build||'—'}</code></span></div>
      ${s.bootloader ? `<div><span class="ml">Bootloader: </span><span class="mv"><code>${s.bootloader}</code></span></div>` : ''}
      <div class="full"><span class="ml">Ссылка: </span>
        <a href="${s.url}" target="_blank" class="lnk">🔗 Проверить файл</a>
      </div>
    </div>
    <div class="actions">
      ${s.status==='pending' ? `
        <button class="btn btn-acc" onclick="act(${s.id},'accepted')">✅ Принять</button>
        <button class="btn btn-rej" onclick="act(${s.id},'rejected')">❌ Отклонить</button>
      ` : `
        <button class="btn btn-ret" onclick="act(${s.id},'pending')">↩ На рассмотрение</button>
      `}
      <label class="chk-row">
        <input type="checkbox" ${s.by_admin?'checked':''} onchange="toggleAdmin(${s.id},this.checked)"/>
        Залито администратором
        <span class="tag ${s.by_admin?'t-adm':'t-usr'}">${s.by_admin?'👑 Admin':'👤 User'}</span>
      </label>
    </div>
  </div>`;
}

function renderSubmissions() {
  const list = submissions.filter(s=>s.status==='pending');
  document.getElementById('cards-pending').innerHTML =
    list.length ? list.map(cardHtml).join('') : '<div class="empty">Нет заявок на рассмотрении</div>';
}
function renderAccepted() {
  const list = submissions.filter(s=>s.status==='accepted');
  document.getElementById('cards-accepted').innerHTML =
    list.length ? list.map(cardHtml).join('') : '<div class="empty">Нет принятых заявок</div>';
}
function renderRejected() {
  const list = submissions.filter(s=>s.status==='rejected');
  document.getElementById('cards-rejected').innerHTML =
    list.length ? list.map(cardHtml).join('') : '<div class="empty">Нет отклонённых заявок</div>';
}

function act(id, status) {
  const s = submissions.find(x=>x.id===id);
  if (s) { s.status=status; saveSubmissions(); renderStats();
    renderSubmissions(); renderAccepted(); renderRejected(); }
}
function toggleAdmin(id, val) {
  const s = submissions.find(x=>x.id===id);
  if (s) { s.by_admin=val; saveSubmissions(); }
}

// ── Catalog: Android ROM ──────────────────────────────────────────────────────
function renderCatRoms() {
  const el = document.getElementById('cat-roms-content');
  if (!romsDb) { el.innerHTML='<div class="empty">База не загружена</div>'; return; }

  const brands = Object.keys(romsDb.devices||{});
  if (!currentRomBrand && brands.length) currentRomBrand = brands[0];

  const devices = (romsDb.devices||{})[currentRomBrand||''] || [];
  const allRoms = romsDb.roms||{};

  el.innerHTML = `
    <div class="device-pills">
      ${brands.map(b=>`<div class="dpill ${b===currentRomBrand?'active':''}" onclick="setRomBrand('${b}')">${b}</div>`).join('')}
    </div>
    ${devices.map(d => {
      const roms = allRoms[d.codename]||[];
      return `
      <div style="margin-bottom:1.5rem">
        <div style="font-weight:700;color:#fff;margin-bottom:.5rem;display:flex;align-items:center;gap:.6rem">
          ${d.name}
          <code style="font-size:.78rem;color:#555">${d.codename}</code>
        </div>
        ${roms.length ? `
        <table class="tbl">
          <thead><tr><th>ROM</th><th>Android</th><th>Build</th><th>Статус</th><th>Источник</th><th></th></tr></thead>
          <tbody>${roms.map((r,i)=>`
            <tr>
              <td><span class="tbl-name">${r.name}</span></td>
              <td>${r.android}</td>
              <td><code class="code">${r.build||'—'}</code></td>
              <td><span class="s-badge s-${r.status}">${r.status}</span></td>
              <td><span class="tag ${r.by_admin?'t-adm':'t-usr'}">${r.by_admin?'👑 Admin':'👤 User'}</span></td>
              <td style="display:flex;gap:.4rem">
                <a href="${r.url}" target="_blank" class="btn-sm">🔗</a>
                <button class="btn-sm" style="color:#f87171" onclick="deleteRom('roms','${currentRomBrand}','${d.codename}',${i})">🗑</button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>` : `<div style="color:#333;font-size:.85rem;padding:.4rem 0">Нет ROM</div>`}
      </div>`;
    }).join('')}`;
}

function setRomBrand(b) { currentRomBrand=b; renderCatRoms(); }

// ── Catalog: Samsung ──────────────────────────────────────────────────────────
let currentSsDev = null;

function setSsTab(t, btn) {
  currentSsTab=t;
  document.querySelectorAll('#page-cat-samsung .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCatSamsung();
}

function renderCatSamsung() {
  const el = document.getElementById('cat-samsung-content');
  if (!samsungDb) { el.innerHTML='<div class="empty">База не загружена</div>'; return; }
  const devices = (samsungDb.devices?.samsung)||[];
  if (!currentSsDev && devices.length) currentSsDev = devices[0].codename;

  const pills = devices.map(d=>
    `<div class="dpill ${d.codename===currentSsDev?'active':''}" onclick="setSsDev('${d.codename}')">${d.name}</div>`
  ).join('');

  let tableHtml = '';
  if (currentSsTab==='roms') {
    const items = (samsungDb.roms||{})[currentSsDev]||[];
    tableHtml = items.length ? `<table class="tbl"><thead><tr>
      <th>ROM</th><th>Android</th><th>Build</th><th>Bootloader</th><th>Статус</th><th>Источник</th><th></th>
    </tr></thead><tbody>${items.map((r,i)=>`<tr>
      <td><span class="tbl-name">${r.name}</span></td>
      <td>${r.android}</td><td><code class="code">${r.build||'—'}</code></td>
      <td><code class="code">${r.bootloader||'—'}</code></td>
      <td><span class="s-badge s-${r.status}">${r.status}</span></td>
      <td><span class="tag ${r.by_admin?'t-adm':'t-usr'}">${r.by_admin?'👑':'👤'}</span></td>
      <td><a href="${r.url}" target="_blank" class="btn-sm">🔗</a></td>
    </tr>`).join('')}</tbody></table>` : '<div class="empty">Нет ROM</div>';
  } else if (currentSsTab==='rec') {
    const items = (samsungDb.recoveries||{})[currentSsDev]||[];
    tableHtml = items.length ? `<table class="tbl"><thead><tr>
      <th>Recovery</th><th>Тип</th><th>Версия</th><th>Статус</th><th></th>
    </tr></thead><tbody>${items.map(r=>`<tr>
      <td><span class="tbl-name">${r.name}</span></td>
      <td><span class="s-badge s-${r.type}">${r.type}</span></td>
      <td>${r.version}</td>
      <td><span class="s-badge s-${r.status}">${r.status}</span></td>
      <td><a href="${r.url}" target="_blank" class="btn-sm">🔗</a></td>
    </tr>`).join('')}</tbody></table>` : '<div class="empty">Нет Recovery</div>';
  } else {
    const items = (samsungDb.stock||{})[currentSsDev]||[];
    tableHtml = items.length ? `<table class="tbl"><thead><tr>
      <th>Прошивка</th><th>Android</th><th>Build</th><th>Bootloader</th><th>Регион</th><th>Статус</th><th>Источник</th><th></th>
    </tr></thead><tbody>${items.map(s=>`<tr>
      <td><span class="tbl-name">${s.name}</span></td>
      <td>${s.android}</td>
      <td><code class="code">${s.build||'—'}</code></td>
      <td><code class="code">${s.bootloader||'—'}</code></td>
      <td>${s.region}</td>
      <td><span class="s-badge s-${s.status}">${s.status}</span></td>
      <td><span class="tag ${s.by_admin?'t-adm':'t-usr'}">${s.by_admin?'👑':'👤'}</span></td>
      <td><a href="${s.url}" target="_blank" class="btn-sm">🔗</a></td>
    </tr>`).join('')}</tbody></table>` : '<div class="empty">Нет сток прошивок</div>';
  }

  el.innerHTML = `<div class="device-pills">${pills}</div>${tableHtml}`;
}

function setSsDev(code) { currentSsDev=code; renderCatSamsung(); }

// ── Catalog: Recovery ─────────────────────────────────────────────────────────
let currentRecBrand = null;
function renderCatRec() {
  const el = document.getElementById('cat-rec-content');
  if (!twrpDb) { el.innerHTML='<div class="empty">База не загружена</div>'; return; }
  const brands = Object.keys(twrpDb.devices||{});
  if (!currentRecBrand && brands.length) currentRecBrand = brands[0];

  const devices = (twrpDb.devices||{})[currentRecBrand||'']||[];
  const allRecs = twrpDb.recoveries||{};

  el.innerHTML = `
    <div class="device-pills">
      ${brands.map(b=>`<div class="dpill ${b===currentRecBrand?'active':''}" onclick="setRecBrand('${b}')">${b}</div>`).join('')}
    </div>
    ${devices.map(d=>{
      const recs = allRecs[d.codename]||[];
      return `<div style="margin-bottom:1.5rem">
        <div style="font-weight:700;color:#fff;margin-bottom:.5rem">${d.name} <code class="code">${d.codename}</code></div>
        ${recs.length ? `<table class="tbl"><thead><tr>
          <th>Recovery</th><th>Тип</th><th>Версия</th><th>Статус</th><th>Источник</th><th></th>
        </tr></thead><tbody>${recs.map((r,i)=>`<tr>
          <td><span class="tbl-name">${r.name}</span></td>
          <td><span class="s-badge s-${r.type}">${r.type}</span></td>
          <td>${r.version}</td>
          <td><span class="s-badge s-${r.status}">${r.status}</span></td>
          <td><span class="tag ${r.by_admin?'t-adm':'t-usr'}">${r.by_admin?'👑':'👤'}</span></td>
          <td><a href="${r.url}" target="_blank" class="btn-sm">🔗</a></td>
        </tr>`).join('')}</tbody></table>` : '<div style="color:#333;font-size:.85rem">Нет Recovery</div>'}
      </div>`;
    }).join('')}`;
}
function setRecBrand(b) { currentRecBrand=b; renderCatRec(); }

// ── Catalog: Stock ────────────────────────────────────────────────────────────
let currentStBrand = null;
function renderCatStock() {
  const el = document.getElementById('cat-stock-content');
  if (!stockDb) { el.innerHTML='<div class="empty">База не загружена</div>'; return; }
  const brands = Object.keys(stockDb.devices||{});
  if (!currentStBrand && brands.length) currentStBrand = brands[0];

  const devices = (stockDb.devices||{})[currentStBrand||'']||[];
  const allSt = stockDb.stock||{};

  el.innerHTML = `
    <div class="device-pills">
      ${brands.map(b=>`<div class="dpill ${b===currentStBrand?'active':''}" onclick="setStBrand('${b}')">${b}</div>`).join('')}
    </div>
    ${devices.map(d=>{
      const items = allSt[d.codename]||[];
      return `<div style="margin-bottom:1.5rem">
        <div style="font-weight:700;color:#fff;margin-bottom:.5rem">${d.name} <code class="code">${d.codename}</code></div>
        ${items.length ? `<table class="tbl"><thead><tr>
          <th>Прошивка</th><th>Android</th><th>Build</th><th>Регион</th><th>Статус</th><th>Источник</th>
        </tr></thead><tbody>${items.map(s=>`<tr>
          <td><span class="tbl-name">${s.name}</span></td>
          <td>${s.android}</td>
          <td><code class="code">${s.build||'—'}</code></td>
          <td>${s.region}</td>
          <td><span class="s-badge s-${s.status}">${s.status}</span></td>
          <td>
            <span class="tag ${s.by_admin?'t-adm':'t-usr'}">${s.by_admin?'👑':'👤'}</span>
            <a href="${s.url}" target="_blank" class="btn-sm" style="margin-left:.3rem">🔗</a>
          </td>
        </tr>`).join('')}</tbody></table>` : '<div style="color:#333;font-size:.85rem">Нет прошивок</div>'}
      </div>`;
    }).join('')}`;
}
function setStBrand(b) { currentStBrand=b; renderCatStock(); }
</script>
