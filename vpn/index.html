<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Подписка</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 40px;
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    p { color: #888; font-size: 15px; line-height: 1.5; margin-bottom: 28px; }
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary {
      background: linear-gradient(135deg, #6c63ff, #4ecdc4);
      color: #fff;
    }
    .btn-secondary {
      background: #2a2a3a;
      color: #ccc;
      font-size: 14px;
      padding: 12px;
    }
    .servers { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 6px; 
      justify-content: center;
      margin-bottom: 28px;
    }
    .tag {
      background: #2a2a3a;
      color: #aaa;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .notice {
      font-size: 12px;
      color: #555;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔒</div>
    <h1>VPN Подписка</h1>
    <p>30 серверов в разных странах.<br>Нажми кнопку чтобы добавить в Happ.</p>
    <div class="servers">
      <span class="tag">🇩🇪 Германия</span>
      <span class="tag">🇪🇸 Испания</span>
      <span class="tag">🇰🇿 Казахстан</span>
      <span class="tag">🇳🇱 Нидерланды</span>
      <span class="tag">🇷🇴 Румыния</span>
      <span class="tag">🇸🇬 Сингапур</span>
      <span class="tag">🇺🇸 США</span>
      <span class="tag">🇹🇼 Тайвань</span>
      <span class="tag">🇫🇮 Финляндия</span>
      <span class="tag">🇰🇷 Корея</span>
    </div>
    <a id="happBtn" class="btn btn-primary" href="#">
      ⚡ Открыть в Happ
    </a>
    <button class="btn btn-secondary" onclick="copyUrl()">
      📋 Скопировать ссылку подписки
    </button>
    <div class="notice">
      Или добавь вручную в Happ:<br>
      <code id="subUrl" style="color:#6c63ff; word-break:break-all;"></code>
    </div>
  </div>

  <script>
    const subUrl = window.location.origin + window.location.pathname.replace(/\/?$/, '/') + 'sub';
    document.getElementById('subUrl').textContent = subUrl;
    
    // Happ deeplink — opens app and imports subscription
    document.getElementById('happBtn').href = 'happ://add-sub?url=' + encodeURIComponent(subUrl);

    function copyUrl() {
      navigator.clipboard.writeText(subUrl).then(() => {
        const btn = event.target;
        btn.textContent = '✅ Скопировано!';
        setTimeout(() => btn.textContent = '📋 Скопировать ссылку подписки', 2000);
      });
    }
  </script>
</body>
</html>
