<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN от @LudskoiStpax</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { text-align: center; color: white; margin-bottom: 30px; font-size: 2em; }
        h3 { color: white; margin: 20px 0 10px; }
        .plan-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .plan-card:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .plan-name { font-weight: bold; font-size: 1.1em; }
        .plan-name small { font-size: 0.8em; color: #666; }
        .plan-price { font-weight: bold; color: #8b5cf6; font-size: 1.3em; }
        .btn-buy {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-buy:hover { background: #7c3aed; }
        .badge { background: #f59e0b; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-left: 8px; }
        .result {
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .result.success { background: #d4edda; color: #155724; display: block; }
        .result.error { background: #f8d7da; color: #721c24; display: block; }
        .card-details {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 15px;
            margin: 15px 0;
            text-align: center;
        }
        .order-code {
            font-size: 2em;
            font-family: monospace;
            font-weight: bold;
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            letter-spacing: 4px;
            text-align: center;
        }
        .card-number {
            font-size: 1.3em;
            font-family: monospace;
            font-weight: bold;
            background: white;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            letter-spacing: 2px;
        }
        .copy-btn {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }
        .pay-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-size: 1em;
            font-weight: bold;
            margin-top: 15px;
        }
        .pay-btn:hover { background: #16a34a; }
        .pay-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        hr { margin: 15px 0; }
        .instruction {
            background: #e0f2fe;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            font-size: 14px;
        }
        .instruction ol { margin-left: 20px; }
        .instruction li { margin: 8px 0; }
        @media (max-width: 480px) {
            .plan-card { flex-direction: column; text-align: center; gap: 10px; }
            .order-code { font-size: 1.3em; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 VPN от @LudskoiStpax</h1>
        
        <h3>🇷🇺 ОСНОВНАЯ ПОДПИСКА</h3>
        <div class="plan-card" data-type="main" data-duration="7d" data-price="0" data-name="Основная 7 дней">
            <div class="plan-name">🎁 Пробная <span class="badge">7 дней</span></div>
            <div class="plan-price">0 ₽</div>
            <button class="btn-buy">Выбрать</button>
        </div>
        <div class="plan-card" data-type="main" data-duration="1m" data-price="20" data-name="Основная 1 месяц">
            <div class="plan-name">🇷🇺 Основная — 1 месяц</div>
            <div class="plan-price">20 ₽</div>
            <button class="btn-buy">Выбрать</button>
        </div>
        <div class="plan-card" data-type="main" data-duration="3m" data-price="50" data-name="Основная 3 месяца">
            <div class="plan-name">🇷🇺 Основная — 3 месяца</div>
            <div class="plan-price">50 ₽</div>
            <button class="btn-buy">Выбрать</button>
        </div>
        <div class="plan-card" data-type="main" data-duration="12m" data-price="180" data-name="Основная 1 год">
            <div class="plan-name">🇷🇺 Основная — 1 год</div>
            <div class="plan-price">180 ₽</div>
            <button class="btn-buy">Выбрать</button>
        </div>
        
        <h3>🧪 ТЕСТОВАЯ ПОДПИСКА</h3>
        <div class="plan-card" data-type="test" data-duration="7d" data-price="0" data-name="Тестовая 7 дней">
            <div class="plan-name">🎁 Пробная <span class="badge">7 дней</span></div>
            <div class="plan-price">0 ₽</div>
            <button class="btn-buy">Выбрать</button>
        </div>
        <div class="plan-card" data-type="test" data-duration="1m" data-price="30" data-name="Тестовая 1 месяц">
            <div class="plan-name">🧪 Тестовая — 1 месяц</div>
            <div class="plan-price">30 ₽</div>
            <button class="btn-buy">Выбрать</button>
        </div>
        <div class="plan-card" data-type="test" data-duration="3m" data-price="75" data-name="Тестовая 3 месяца">
            <div class="plan-name">🧪 Тестовая — 3 месяца</div>
            <div class="plan-price">75 ₽</div>
            <button class="btn-buy">Выбрать</button>
        </div>
        <div class="plan-card" data-type="test" data-duration="12m" data-price="270" data-name="Тестовая 1 год">
            <div class="plan-name">🧪 Тестовая — 1 год</div>
            <div class="plan-price">270 ₽</div>
            <button class="btn-buy">Выбрать</button>
        </div>
        
        <div id="result" class="result"></div>
    </div>
    
    <script>
        // Адрес вашего бота на Render
        const API_URL = "https://renderser.onrender.com";
        
        let selectedPlan = null;
        let orderCode = null;
        
        // Генерация 6-значного кода
        function generateOrderCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }
        
        // Обработчики выбора тарифа
        document.querySelectorAll('.plan-card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.classList.contains('btn-buy')) {
                    selectedPlan = {
                        type: this.dataset.type,
                        duration: this.dataset.duration,
                        price: parseInt(this.dataset.price),
                        name: this.dataset.name
                    };
                    orderCode = generateOrderCode();
                    showPaymentForm();
                }
            });
        });
        
        function showPaymentForm() {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result';
            resultDiv.innerHTML = `
                <h3>📦 Ваш заказ: ${selectedPlan.name}</h3>
                <p>💰 Сумма: ${selectedPlan.price} ₽</p>
                
                <div class="card-details">
                    <p>🔑 <strong>Ваш уникальный код заказа</strong></p>
                    <div class="order-code" id="orderCode">${orderCode}</div>
                    <button class="copy-btn" onclick="copyOrderCode()">📋 Скопировать код</button>
                </div>
                
                <div class="card-details">
                    <p>💳 <strong>Реквизиты для оплаты</strong></p>
                    <div class="card-number">2202 2080 1284 2135</div>
                    <p>👤 Олег Ф.</p>
                    <button class="copy-btn" onclick="copyCard()">📋 Скопировать номер карты</button>
                </div>
                
                <div class="instruction">
                    <strong>📝 ИНСТРУКЦИЯ ПО ОПЛАТЕ:</strong>
                    <ol>
                        <li>Откройте приложение вашего банка</li>
                        <li>Переведите <strong>${selectedPlan.price} ₽</strong> на карту <strong>2202 2080 1284 2135</strong></li>
                        <li>В <strong>КОММЕНТАРИЙ К ПЕРЕВОДУ</strong> обязательно укажите код: <code style="background:#fff;padding:2px 6px;">${orderCode}</code></li>
                        <li>После перевода нажмите кнопку ниже</li>
                    </ol>
                </div>
                
                <button class="pay-btn" onclick="sendOrder()">
                    ✅ Я оплатил, отправить заявку
                </button>
            `;
            resultDiv.scrollIntoView({ behavior: 'smooth' });
        }
        
        function copyOrderCode() {
            navigator.clipboard.writeText(orderCode);
            const btn = event.target;
            btn.textContent = '✅ Скопировано!';
            setTimeout(() => { btn.textContent = '📋 Скопировать код'; }, 2000);
        }
        
        function copyCard() {
            navigator.clipboard.writeText('2202208012842135');
            const btn = event.target;
            btn.textContent = '✅ Скопировано!';
            setTimeout(() => { btn.textContent = '📋 Скопировать номер карты'; }, 2000);
        }
        
        async function sendOrder() {
            const btn = document.querySelector('.pay-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Отправляем заявку...';
            
            try {
                // Отправляем заявку на сервер
                const response = await fetch(`${API_URL}/api/create-order`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: orderCode,
                        type: selectedPlan.type,
                        duration: selectedPlan.duration,
                        days: selectedPlan.duration === '7d' ? 7 : (selectedPlan.duration === '1m' ? 30 : (selectedPlan.duration === '3m' ? 90 : 365)),
                        price: selectedPlan.price,
                        plan_name: selectedPlan.name
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('result').innerHTML = `
                        <div style="background: #d4edda; border-radius: 20px; padding: 20px;">
                            <h3>✅ Заявка №${orderCode} отправлена!</h3>
                            <p>Я проверю оплату и пришлю ссылку в Telegram.</p>
                            <hr>
                            <p>📌 <strong>Что дальше?</strong></p>
                            <ol style="margin-left: 20px;">
                                <li>Я проверю поступление перевода с кодом <strong>${orderCode}</strong></li>
                                <li>После проверки вы получите ссылку на подписку</li>
                                <li>Если у вас нет Telegram, напишите мне: <strong>@LudskoiStpax</strong></li>
                            </ol>
                            <hr>
                            <p>💬 <strong>@LudskoiStpax</strong> — по всем вопросам</p>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || 'Не удалось отправить заявку');
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <div style="background: #f8d7da; border-radius: 20px; padding: 20px;">
                        <h3>❌ Ошибка</h3>
                        <p>${error.message}</p>
                        <p>💬 Напишите @LudskoiStpax</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
