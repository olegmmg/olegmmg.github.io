<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samsung прошивки | olegmmg</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<nav class="nav-bar">
  <a class="nav-logo" href="/">⚡ olegmmg</a>
  <div class="nav-links">
    <a class="nav-link" href="/roms/"><i class="fas fa-microchip"></i> ROM</a>
    <a class="nav-link active" href="/samsung/"><i class="fab fa-samsung"></i> Samsung</a>
    <a class="nav-link" href="/recovery/"><i class="fas fa-tools"></i> Recovery</a>
    <a class="nav-link" href="/stock/"><i class="fas fa-box"></i> Сток</a>
  </div>
  <div class="nav-right">
    <button class="theme-toggle" id="themeToggle"><i class="fas fa-sun"></i> Светлая</button>
  </div>
</nav>

<div class="page-header">
  <h1><i class="fab fa-samsung"></i> Samsung</h1>
  <p>Кастомные ROM, Recovery и сток прошивки для устройств Samsung</p>
</div>

<div class="container">
  <!-- Поиск -->
  <div class="search-row">
    <div class="search-wrap">
      <i class="fas fa-search search-icon"></i>
      <input class="search-box" id="searchBox" type="text" placeholder="Поиск модели по названию или codename...">
    </div>
    <button class="reset-btn" id="resetSearchBtn" style="margin-left:0.5rem; padding:0.5rem 1rem; background:#1a1a2e; border:1px solid #2A2A4A; border-radius:8px; color:#fff; cursor:pointer;">
      <i class="fas fa-times"></i> Сбросить
    </button>
  </div>

  <div class="filter-section">
    <span class="filter-label"><i class="fas fa-mobile-alt"></i> МОДЕЛЬ</span>
    <div class="pills" id="devicePills"></div>
  </div>

  <div class="stats-row" style="margin-top:1rem">
    <span>Найдено моделей: <strong id="deviceCount">0</strong></span>
    <span style="margin-left:1rem">Выбрано: <strong id="selDevice">—</strong></span>
  </div>

  <!-- Tabs -->
  <div style="display:flex;gap:0;margin:1rem 0 0;border-bottom:2px solid #2A2A4A">
    <button class="tab-btn active" data-tab="roms">🧩 ROM</button>
    <button class="tab-btn" data-tab="recovery">🛠 Recovery</button>
    <button class="tab-btn" data-tab="stock">📦 Сток</button>
  </div>

  <div id="tab-roms" class="tab-content" style="margin-top:1rem"></div>
  <div id="tab-recovery" class="tab-content" style="display:none;margin-top:1rem"></div>
  <div id="tab-stock" class="tab-content" style="display:none;margin-top:1rem"></div>

  <div class="page-footer"><i class="fab fa-samsung"></i> Samsung · by OlegMMG</div>
</div>

<style>
.tab-btn{background:transparent;border:none;color:#666;padding:.8rem 1.4rem;font-size:.95rem;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;transition:.15s}
.tab-btn.active{color:#fff;border-bottom-color:#6366F1}
.tab-btn:hover{color:#ccc}
.filter-section{margin-bottom:.5rem}
.search-row{display:flex;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:0.5rem}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#666}
.search-box{width:100%;background:#050508;border:1px solid #2A2A4A;color:#fff;padding:0.7rem 0.7rem 0.7rem 2.5rem;border-radius:10px;font-size:0.9rem;outline:none}
.search-box:focus{border-color:#6366F1}
.reset-btn:hover{background:#2A2A4A}
.fw-table{width:100%;border-collapse:collapse}
.fw-table th{text-align:left;padding:.7rem .5rem;color:#555;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #2A2A4A}
.fw-row{border-bottom:1px solid rgba(255,255,255,.04)}
.fw-row td{padding:.85rem .5rem;vertical-align:middle}
.fw-row:hover td{background:rgba(255,255,255,.02)}
.badge{display:inline-block;border-radius:20px;padding:.2rem .7rem;font-size:.75rem;font-weight:700}
.badge-STABLE,.badge-OFFICIAL,.badge-LATEST{background:rgba(22,163,74,.15);color:#4ade80;border:1px solid rgba(22,163,74,.25)}
.badge-BETA{background:rgba(202,138,4,.12);color:#fbbf24;border:1px solid rgba(202,138,4,.2)}
.badge-PORT,.badge-UNOFFICIAL{background:rgba(99,102,241,.15);color:#a5b4fc;border:1px solid rgba(99,102,241,.25)}
.badge-TWRP{background:rgba(37,99,235,.15);color:#60a5fa;border:1px solid rgba(37,99,235,.25)}
.badge-OrangeFox{background:rgba(234,88,12,.15);color:#fb923c;border:1px solid rgba(234,88,12,.2)}
.badge-PitchBlack{background:rgba(168,85,247,.15);color:#c084fc;border:1px solid rgba(168,85,247,.2)}
.badge-admin{background:rgba(99,102,241,.2);color:#a5b4fc;font-size:.7rem}
.badge-user{background:rgba(34,197,94,.15);color:#4ade80;font-size:.7rem}
.dl-btn{display:inline-flex;align-items:center;gap:5px;padding:.3rem .9rem;border-radius:20px;font-size:.8rem;font-weight:600;border:1px solid rgba(37,117,252,.4);color:#60a5fa;text-decoration:none;transition:.15s}
.dl-btn:hover{background:#2563eb;color:#fff;border-color:#2563eb}
.empty{text-align:center;padding:2rem;color:#444;font-size:.95rem}
.loading{text-align:center;padding:2rem;color:#666}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid #2A2A4A;border-top-color:#6366F1;border-radius:50%;animation:spin 0.6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{transition:all 0.15s}
.pill.hidden{display:none}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCzyMi_QRO5kxH_KY6hwpZP5ezASC30lQ",
  authDomain: "project-magnet-0-12-0.firebaseapp.com",
  databaseURL: "https://project-magnet-0-12-0-default-rtdb.firebaseio.com",
  projectId: "project-magnet-0-12-0",
  storageBucket: "project-magnet-0-12-0.firebasestorage.app",
  messagingSenderId: "806168706834",
  appId: "1:806168706834:web:e13093dd8940641508bdcb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let devicesData = {};
let romsData = {};
let recoveriesData = {};
let stockData = {};
let selCode = null;
let isLoading = false;
let searchQuery = '';
let allDevices = [];

const themeToggle = document.getElementById('themeToggle');
themeToggle.onclick = () => { document.body.classList.toggle('dark'); };

const searchBox = document.getElementById('searchBox');
const resetSearchBtn = document.getElementById('resetSearchBtn');
const deviceCountSpan = document.getElementById('deviceCount');

async function loadData() {
  if(isLoading) return;
  isLoading = true;
  
  try {
    const pillsDiv = document.getElementById('devicePills');
    pillsDiv.innerHTML = '<div class="loading"><span class="spinner"></span> Загрузка устройств...</div>';
    
    const [devicesSnap, romsSnap, recoveriesSnap, stockSnap] = await Promise.all([
      get(ref(db, 'flashtool/devices/samsung')),
      get(ref(db, 'flashtool/samsung/roms')),
      get(ref(db, 'flashtool/samsung/recoveries')),
      get(ref(db, 'flashtool/samsung/stock'))
    ]);
    
    devicesData = devicesSnap.val() || {};
    romsData = romsSnap.val() || {};
    recoveriesData = recoveriesSnap.val() || {};
    stockData = stockSnap.val() || {};
    
    // Создаем массив всех устройств
    allDevices = Object.entries(devicesData).map(([codename, info]) => ({
      codename: codename,
      name: info.name || codename,
      searchStr: (info.name + ' ' + codename).toLowerCase()
    }));
    
    renderDevices();
  } catch (e) {
    console.error('Ошибка загрузки:', e);
    const pillsDiv = document.getElementById('devicePills');
    pillsDiv.innerHTML = `<div class="empty" style="color:#f87171">❌ Ошибка загрузки: ${e.message}</div>`;
  } finally {
    isLoading = false;
  }
}

function filterDevices() {
  const query = searchQuery.toLowerCase().trim();
  let filtered = allDevices;
  
  if (query) {
    filtered = allDevices.filter(device => 
      device.searchStr.includes(query)
    );
  }
  
  deviceCountSpan.textContent = filtered.length;
  
  // Показываем/скрываем кнопки устройств
  document.querySelectorAll('#devicePills .pill').forEach(btn => {
    const codename = btn.dataset.code;
    const device = allDevices.find(d => d.codename === codename);
    const matches = !query || (device && device.searchStr.includes(query));
    
    if (matches) {
      btn.classList.remove('hidden');
    } else {
      btn.classList.add('hidden');
      // Если скрытое устройство было выбрано - сбрасываем выбор
      if (selCode === codename) {
        selCode = null;
        document.getElementById('selDevice').textContent = '—';
        renderAllTabs();
      }
    }
  });
  
  // Если после фильтрации нет видимых устройств и есть выбранное - сбрасываем
  const visibleDevices = document.querySelectorAll('#devicePills .pill:not(.hidden)');
  if (visibleDevices.length === 0 && selCode !== null) {
    selCode = null;
    document.getElementById('selDevice').textContent = '—';
    renderAllTabs();
  }
}

function renderDevices() {
  const pills = document.getElementById('devicePills');
  pills.innerHTML = '';
  
  if (allDevices.length === 0) {
    pills.innerHTML = '<div class="empty">📭 Нет устройств в базе</div>';
    deviceCountSpan.textContent = '0';
    return;
  }
  
  allDevices.forEach(device => {
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.textContent = device.name;
    btn.dataset.code = device.codename;
    btn.title = device.codename;
    btn.onclick = () => {
      document.querySelectorAll('#devicePills .pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      selCode = device.codename;
      document.getElementById('selDevice').textContent = device.name;
      renderAllTabs();
    };
    pills.appendChild(btn);
  });
  
  // Применяем фильтр поиска
  filterDevices();
  
  // Автоматически выбираем первое видимое устройство если есть и нет выбранного
  if(allDevices.length > 0 && !selCode) {
    const firstVisible = document.querySelector('#devicePills .pill:not(.hidden)');
    if(firstVisible) firstVisible.click();
  }
}

function renderAllTabs() {
  renderTabRoms();
  renderTabRecovery();
  renderTabStock();
}

function renderTabRoms() {
  const el = document.getElementById('tab-roms');
  if (!selCode) {
    el.innerHTML = '<div class="empty">👈 Выберите модель слева</div>';
    return;
  }
  
  const items = romsData[selCode] || {};
  const itemsArray = Object.entries(items).map(([key, value]) => ({ id: key, ...value }));
  
  if (itemsArray.length === 0) {
    el.innerHTML = '<div class="empty">📭 Нет ROM для этой модели</div>';
    return;
  }
  
  el.innerHTML = `
    <table class="fw-table">
      <thead>
        <tr><th>ROM</th><th>Android</th><th>Build</th><th>Bootloader</th><th>Статус</th><th>Источник</th><th></th></tr>
      </thead>
      <tbody>
        ${itemsArray.map(item => `
          <tr class="fw-row">
            <td><b style="color:#fff">${escapeHtml(item.name)}</b></td>
            <td><span style="color:#777"><i class="fab fa-android"></i> ${escapeHtml(item.android || '—')}</span></td>
            <td><code style="font-size:.78rem;color:#555">${escapeHtml(item.build || '—')}</code></td>
            <td><code style="font-size:.78rem;color:#555">${escapeHtml(item.bootloader || '—')}</code></td>
            <td><span class="badge badge-${item.status}">${escapeHtml(item.status)}</span></td>
            <td><span class="badge ${item.by_admin ? 'badge-admin' : 'badge-user'}">${item.by_admin ? '👑 Admin' : '👤 User'}</span></td>
            <td><a href="${item.url}" class="dl-btn" target="_blank" rel="noopener noreferrer"><i class="fas fa-download"></i> Скачать</a></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderTabRecovery() {
  const el = document.getElementById('tab-recovery');
  if (!selCode) {
    el.innerHTML = '<div class="empty">👈 Выберите модель слева</div>';
    return;
  }
  
  const items = recoveriesData[selCode] || {};
  const itemsArray = Object.entries(items).map(([key, value]) => ({ id: key, ...value }));
  
  if (itemsArray.length === 0) {
    el.innerHTML = '<div class="empty">📭 Нет Recovery для этой модели</div>';
    return;
  }
  
  el.innerHTML = `
    <table class="fw-table">
      <thead>
        <tr><th>Recovery</th><th>Версия</th><th>Тип</th><th>Статус</th><th>Источник</th><th></th></tr>
      </thead>
      <tbody>
        ${itemsArray.map(item => `
          <tr class="fw-row">
            <td><b style="color:#fff">${escapeHtml(item.name)}</b></td>
            <td><span style="font-family:monospace;color:#777">${escapeHtml(item.version || '—')}</span></td>
            <td><span class="badge badge-${item.type || 'TWRP'}">${escapeHtml(item.type || 'TWRP')}</span></td>
            <td><span class="badge badge-${item.status}">${escapeHtml(item.status)}</span></td>
            <td><span class="badge ${item.by_admin ? 'badge-admin' : 'badge-user'}">${item.by_admin ? '👑 Admin' : '👤 User'}</span></td>
            <td><a href="${item.url}" class="dl-btn" target="_blank" rel="noopener noreferrer"><i class="fas fa-download"></i> Скачать</a></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderTabStock() {
  const el = document.getElementById('tab-stock');
  if (!selCode) {
    el.innerHTML = '<div class="empty">👈 Выберите модель слева</div>';
    return;
  }
  
  const items = stockData[selCode] || {};
  const itemsArray = Object.entries(items).map(([key, value]) => ({ id: key, ...value }));
  
  if (itemsArray.length === 0) {
    el.innerHTML = '<div class="empty">📭 Нет сток прошивок для этой модели</div>';
    return;
  }
  
  el.innerHTML = `
    <table class="fw-table">
      <thead>
        <tr><th>Прошивка</th><th>Android</th><th>Build</th><th>Bootloader</th><th>Регион</th><th>Статус</th><th>Источник</th><th></th></tr>
      </thead>
      <tbody>
        ${itemsArray.map(item => `
          <tr class="fw-row">
            <td><b style="color:#fff">${escapeHtml(item.name)}</b></td>
            <td><span style="color:#777"><i class="fab fa-android"></i> ${escapeHtml(item.android || '—')}</span></td>
            <td><code style="font-size:.78rem;color:#555">${escapeHtml(item.build || '—')}</code></td>
            <td><code style="font-size:.78rem;color:#555">${escapeHtml(item.bootloader || '—')}</code></td>
            <td><span style="color:#666">${escapeHtml(item.region || 'Global')}</span></td>
            <td><span class="badge badge-${item.status}">${escapeHtml(item.status)}</span></td>
            <td><span class="badge ${item.by_admin ? 'badge-admin' : 'badge-user'}">${item.by_admin ? '👑 Admin' : '👤 User'}</span></td>
            <td><a href="${item.url}" class="dl-btn" target="_blank" rel="noopener noreferrer"><i class="fas fa-download"></i> Скачать</a></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

// Поиск
searchBox.oninput = (e) => {
  searchQuery = e.target.value;
  filterDevices();
};

// Сброс поиска
resetSearchBtn.onclick = () => {
  searchBox.value = '';
  searchQuery = '';
  filterDevices();
};

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    btn.classList.add('active');
    const tabId = 'tab-' + btn.dataset.tab;
    const tabContent = document.getElementById(tabId);
    if(tabContent) tabContent.style.display = 'block';
  };
});

// Загружаем данные
loadData();
</script>
</body>
</html>
