<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта воздушных тревог России</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #080810;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        /* Жидкое стекло - общий стиль */
        .liquid-glass {
            background: linear-gradient(135deg,
                    rgba(20, 20, 40, 0.55) 0%,
                    rgba(15, 15, 30, 0.65) 50%,
                    rgba(10, 10, 25, 0.7) 100%);
            backdrop-filter: blur(8px) saturate(120%);
            -webkit-backdrop-filter: blur(8px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Легенда */
        .legend {
            position: fixed;
            left: 12px;
            bottom: 12px;
            padding: 10px 14px;
            z-index: 1000;
            font-size: 11px;
            line-height: 1.5;
            max-width: 230px;
        }

        .legend h3 {
            font-size: 12px;
            margin-bottom: 6px;
            padding-bottom: 5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            color: #ddd;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 2px;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .legend-label {
            font-size: 11px;
            color: #bbb;
        }

        /* Время обновления */
        .update-time {
            position: fixed;
            right: 10px;
            top: 10px;
            padding: 5px 10px;
            z-index: 1000;
            font-size: 10px;
            color: #999;
            border-radius: 6px;
        }

        /* Статистика */
        .stats {
            position: fixed;
            left: 12px;
            top: 10px;
            padding: 5px 10px;
            z-index: 1000;
            font-size: 11px;
            color: #bbb;
            border-radius: 6px;
        }

        .stats .val {
            color: #ff3333;
            font-weight: 700;
        }

        .stats .att {
            color: #ffaa00;
            font-weight: 600;
        }

        .stats .sep {
            color: rgba(255, 255, 255, 0.2);
            margin: 0 4px;
        }

        /* Кнопка языка */
        .lang-toggle {
            position: fixed;
            right: 10px;
            top: 52px;
            padding: 4px 9px;
            cursor: pointer;
            font-size: 10px;
            z-index: 1000;
            font-family: inherit;
            font-weight: 500;
            color: #aaa;
            border: none;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .lang-toggle:hover {
            background: linear-gradient(135deg,
                    rgba(30, 30, 55, 0.7) 0%,
                    rgba(20, 20, 40, 0.8) 100%);
            color: #fff;
        }

        /* Баннер Telegram */
        .telegram-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg,
                    rgba(24, 130, 180, 0.75) 0%,
                    rgba(20, 100, 140, 0.85) 100%);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: white;
            padding: 6px 16px;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .telegram-banner.hidden {
            display: none;
        }

        .banner-icon {
            font-size: 18px;
        }

        .banner-link {
            background: rgba(255, 255, 255, 0.25);
            padding: 4px 12px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 11px;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .banner-link:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .banner-close {
            background: rgba(0, 0, 0, 0.3);
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .banner-close:hover {
            background: rgba(0, 0, 0, 0.5);
        }

        /* Смещение при баннере */
        body.banner-visible .update-time {
            top: 44px;
        }
        body.banner-visible .stats {
            top: 44px;
        }
        body.banner-visible .lang-toggle {
            top: 84px;
        }

        /* Загрузка */
        .loading-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg,
                    rgba(15, 15, 30, 0.8) 0%,
                    rgba(10, 10, 20, 0.9) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 20px 28px;
            border-radius: 14px;
            z-index: 2000;
            font-size: 13px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ff4444;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            font-size: 13px;
            color: #ccc;
        }
        .loading-sub {
            font-size: 10px;
            color: #777;
        }

        /* Ошибка */
        .error-toast {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: linear-gradient(135deg,
                    rgba(255, 50, 50, 0.8) 0%,
                    rgba(200, 0, 0, 0.9) 100%);
            backdrop-filter: blur(6px);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            z-index: 2000;
            display: none;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Попапы */
        .leaflet-popup-content-wrapper {
            background: linear-gradient(135deg,
                    rgba(15, 15, 30, 0.8) 0%,
                    rgba(10, 10, 20, 0.9) 100%) !important;
            backdrop-filter: blur(10px) !important;
            -webkit-backdrop-filter: blur(10px) !important;
            color: #ddd !important;
            border-radius: 10px !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
            font-size: 12px !important;
        }

        .leaflet-popup-content {
            margin: 8px 10px !important;
            line-height: 1.5 !important;
        }

        .leaflet-popup-tip {
            background: rgba(15, 15, 30, 0.9) !important;
        }

        .leaflet-popup-close-button {
            color: #aaa !important;
            font-size: 16px !important;
            padding: 4px 6px !important;
        }

        .region-popup h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #fff;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 10px;
            letter-spacing: 0.3px;
        }

        .alert-count {
            font-weight: 700;
            color: #ff4444;
        }

        @media (max-width: 600px) {
            .legend {
                left: 6px;
                bottom: 6px;
                padding: 8px 10px;
                font-size: 10px;
                max-width: 200px;
            }
            .stats {
                left: 6px;
                top: 6px;
                padding: 4px 8px;
                font-size: 10px;
            }
            .update-time {
                right: 6px;
                top: 6px;
                padding: 4px 8px;
                font-size: 9px;
            }
            .lang-toggle {
                right: 6px;
                top: 44px;
                padding: 3px 7px;
                font-size: 9px;
            }
            .telegram-banner {
                padding: 4px 10px;
                font-size: 10px;
                gap: 6px;
            }
            body.banner-visible .update-time {
                top: 38px;
            }
            body.banner-visible .stats {
                top: 38px;
            }
            body.banner-visible .lang-toggle {
                top: 72px;
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Telegram Баннер -->
    <div id="telegramBanner" class="telegram-banner">
        <span class="banner-icon">📢</span>
        <span>Подпишитесь на Telegram</span>
        <a href="https://t.me/olegmmg" target="_blank" class="banner-link" rel="noopener noreferrer">@olegmmg →</a>
        <button id="closeBannerBtn" class="banner-close" aria-label="Закрыть">✕</button>
    </div>

    <!-- Загрузка -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text" data-i18n="loading_map">Загрузка карты...</div>
        <div class="loading-sub" data-i18n="loading_borders">Загрузка границ регионов</div>
    </div>

    <!-- Кнопка языка -->
    <button class="lang-toggle liquid-glass" id="langToggle">EN</button>

    <!-- Легенда -->
    <div class="legend liquid-glass">
        <h3 data-i18n="legend_title">🚨 Обозначения</h3>
        <div class="legend-item">
            <div class="legend-color" style="background:#ff0000; border:1px solid #ff4444;"></div>
            <span class="legend-label" data-i18n="legend_missile_alert">🚀 Ракетная тревога</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#ff6600; border:1px solid #ff8833;"></div>
            <span class="legend-label" data-i18n="legend_missile_danger">⚠️ Ракетная опасность</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#ff00ff; border:1px solid #ff44ff;"></div>
            <span class="legend-label" data-i18n="legend_drone_attack">✈️ Атака БПЛА</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:#ffcc00; border:1px solid #ffdd44;"></div>
            <span class="legend-label" data-i18n="legend_drone_danger">⚠️ Опасность БПЛА</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:transparent; border:1px dashed #555;"></div>
            <span class="legend-label" data-i18n="legend_clear">✅ Отбой</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background:rgba(30,30,40,0.5); border:1px solid #444;"></div>
            <span class="legend-label" data-i18n="legend_no_data">📡 Нет данных</span>
        </div>
    </div>

    <!-- Время -->
    <div class="update-time liquid-glass" id="updateTime" data-i18n="loading">Загрузка...</div>

    <!-- Статистика -->
    <div class="stats liquid-glass" id="stats">
        ⚠️ <span data-i18n="stats_danger">Тревог</span>: <span class="val">0</span>
    </div>

    <!-- Ошибка -->
    <div class="error-toast" id="errorToast"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ========== НАСТРОЙКА СЕРВЕРОВ ==========
        const API_SERVERS = [
            { url: `https://radar-u913.onrender.com/api/statuses`, name: "Основной" },
            { url: `https://radar-twp9.onrender.com/api/statuses`, name: "Резервный" },
        ];

        let currentServerIndex = 0;

        async function fetchWithMultiFallback() {
            const startIndex = currentServerIndex;
            for (let i = 0; i < API_SERVERS.length; i++) {
                const idx = (startIndex + i) % API_SERVERS.length;
                const srv = API_SERVERS[idx];
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 10000);
                    const r = await fetch(srv.url, { signal: ctrl.signal });
                    clearTimeout(t);
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    const d = await r.json();
                    if (currentServerIndex !== idx && idx !== 0) {
                        currentServerIndex = idx;
                        console.log(`✅ ${srv.name}`);
                    } else if (idx === 0 && currentServerIndex !== 0) {
                        currentServerIndex = 0;
                        console.log(`✅ Основной`);
                    }
                    return d;
                } catch (e) {
                    console.warn(`❌ ${srv.name}:`, e.message);
                }
            }
            throw new Error("Все сервера недоступны");
        }

        // ---------- БАННЕР ----------
        function initBanner() {
            const b = document.getElementById('telegramBanner');
            const c = document.getElementById('closeBannerBtn');
            b.classList.remove('hidden');
            document.body.classList.add('banner-visible');
            c.addEventListener('click', () => {
                b.classList.add('hidden');
                document.body.classList.remove('banner-visible');
            });
        }

        // ---------- ЛОКАЛИЗАЦИЯ ----------
        const tr = {
            ru: {
                loading_map: "Загрузка карты...",
                loading_borders: "Загрузка границ",
                legend_title: "🚨 Обозначения",
                legend_missile_alert: "🚀 Ракетная тревога",
                legend_missile_danger: "⚠️ Ракетная опасность",
                legend_drone_attack: "✈️ Атака БПЛА",
                legend_drone_danger: "⚠️ Опасность БПЛА",
                legend_clear: "✅ Отбой",
                legend_no_data: "📡 Нет данных",
                loading: "Загрузка...",
                stats_danger: "Тревог",
                stats_attacks: "Атак БПЛА",
                updated: "Обновлено",
                error_map: "Ошибка карты",
                error_loading: "Ошибка",
                alert_clear: "ОТБОЙ",
                alert_no_data: "НЕТ ДАННЫХ",
                alert_count: "Оповещений за час",
                missile_alert: "РАКЕТНАЯ ТРЕВОГА",
                missile_danger: "РАКЕТНАЯ ОПАСНОСТЬ",
                drone_attack: "АТАКА БПЛА",
                drone_danger: "ОПАСНОСТЬ БПЛА",
                reset_view: "Сброс вида",
                info_title: "Карта тревог",
                info_text: "🚀 Ракетная тревога — срочно в укрытие\n⚠️ Ракетная опасность — возможен пуск\n✈️ Атака БПЛА — активная атака дронов\n⚠️ Опасность БПЛА — угроза атаки\n✅ Отбой — угроза миновала\n\nОбновление каждые 30 сек"
            },
            en: {
                loading_map: "Loading map...",
                loading_borders: "Loading borders",
                legend_title: "🚨 Legend",
                legend_missile_alert: "🚀 Missile alert",
                legend_missile_danger: "⚠️ Missile danger",
                legend_drone_attack: "✈️ Drone attack",
                legend_drone_danger: "⚠️ Drone danger",
                legend_clear: "✅ Clear",
                legend_no_data: "📡 No data",
                loading: "Loading...",
                stats_danger: "Alerts",
                stats_attacks: "Drone attacks",
                updated: "Updated",
                error_map: "Map error",
                error_loading: "Error",
                alert_clear: "CLEAR",
                alert_no_data: "NO DATA",
                alert_count: "Alerts/hour",
                missile_alert: "MISSILE ALERT",
                missile_danger: "MISSILE DANGER",
                drone_attack: "DRONE ATTACK",
                drone_danger: "DRONE DANGER",
                reset_view: "Reset view",
                info_title: "Alert Map",
                info_text: "🚀 Missile alert — take cover\n⚠️ Missile danger — possible launch\n✈️ Drone attack — active attack\n⚠️ Drone danger — threat\n✅ Clear — threat over\n\nUpdates every 30s"
            }
        };

        let lang = localStorage.getItem('radar_lang') || 'ru';
        if (!tr[lang]) lang = 'ru';

        function t(k) { return tr[lang][k] || tr.ru[k] || k; }

        function updUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const k = el.getAttribute('data-i18n');
                if (tr[lang][k]) el.textContent = tr[lang][k];
            });
            document.documentElement.lang = lang;
            document.getElementById('langToggle').textContent = lang === 'ru' ? 'EN' : 'RU';
            if (currentData && Object.keys(currentData).length > 0) {
                updMap(currentData);
                loadNew(currentData);
            }
            if (lastUpd) updTime(lastUpd);
        }

        function togLang() {
            lang = lang === 'ru' ? 'en' : 'ru';
            localStorage.setItem('radar_lang', lang);
            updUI();
        }
        document.getElementById('langToggle').addEventListener('click', togLang);

        // ---------- ГЕО ----------
        const GEO_URL = "/Radar/geoBoundaries-RUS-ADM1_simplified.geojson";
        const NEW_URL = "/Radar/ukraine_regions_needed.geojson";

        const RMAP = {
            "Altai Krai": { api: "Алтайский край", ru: "Алтайский край", en: "Altai Krai" },
            "Belgorod Oblast": { api: "Белгородская область", ru: "Белгородская обл.", en: "Belgorod" },
            "Bryansk Oblast": { api: "Брянская область", ru: "Брянская обл.", en: "Bryansk" },
            "Krasnodar Krai": { api: "Краснодарский край", ru: "Краснодарский край", en: "Krasnodar" },
            "Kursk Oblast": { api: "Курская область", ru: "Курская обл.", en: "Kursk" },
            "Moscow": { api: "Москва", ru: "Москва", en: "Moscow" },
            "Moscow Oblast": { api: "Московская область", ru: "Московская обл.", en: "Moscow Oblast" },
            "Rostov Oblast": { api: "Ростовская область", ru: "Ростовская обл.", en: "Rostov" },
            "Voronezh Oblast": { api: "Воронежская область", ru: "Воронежская обл.", en: "Voronezh" },
            // Остальные регионы сокращены для примера, добавьте полный список как в оригинале
            "Adygea": { api: "Республика Адыгея", ru: "Адыгея", en: "Adygea" }
        };

        // Упрощенная карта новых регионов
        const NMAP = {
            "Donetsk Oblast": { api: "Донецкая Народная Республика", ru: "ДНР", en: "Donetsk PR" },
            "Luhansk Oblast": { api: "Луганская Народная Республика", ru: "ЛНР", en: "Luhansk PR" },
            "Zaporizhia Oblast": { api: "Запорожская область", ru: "Запорожская обл.", en: "Zaporizhia" },
            "Kherson Oblast": { api: "Херсонская область", ru: "Херсонская обл.", en: "Kherson" },
            "Autonomous Republic of Crimea": { api: "Республика Крым", ru: "Крым", en: "Crimea" },
            "Sevastopol": { api: "Республика Крым", ru: "Севастополь", en: "Sevastopol" }
        };

        function gDisp(n, nr) {
            const m = nr ? NMAP : RMAP;
            const e = m[n];
            if (!e) return n;
            return lang === 'ru' ? e.ru : e.en;
        }

        function gApi(n, nr) {
            const m = nr ? NMAP : RMAP;
            return m[n] ? m[n].api : null;
        }

        function trMsg(m) {
            if (!m || lang === 'ru') return m;
            return m.replace(/Ракетная тревога/gi, 'Missile alert')
                .replace(/Ракетная опасность/gi, 'Missile danger')
                .replace(/Атака БПЛА/gi, 'Drone attack')
                .replace(/Опасность БПЛА/gi, 'Drone danger')
                .replace(/Отбой/gi, 'All clear')
                .replace(/Нет данных/gi, 'No data');
        }

        // Яркие, различимые цвета для каждого статуса
        const COLS = {
            missile_alert: { fill: "rgba(255,0,0,0.55)", border: "#ff0000", icon: "🚀", lru: "РАКЕТНАЯ ТРЕВОГА",
                len: "MISSILE ALERT" },
            missile_danger: { fill: "rgba(255,100,0,0.45)", border: "#ff6600", icon: "⚠️",
            lru: "РАКЕТНАЯ ОПАСНОСТЬ", len: "MISSILE DANGER" },
            drone_attack: { fill: "rgba(255,0,255,0.4)", border: "#ff00ff", icon: "✈️", lru: "АТАКА БПЛА",
                len: "DRONE ATTACK" },
            drone_danger: { fill: "rgba(255,200,0,0.4)", border: "#ffcc00", icon: "⚠️", lru: "ОПАСНОСТЬ БПЛА",
                len: "DRONE DANGER" }
        };

        function gLab(s) { return COLS[s] ? (lang === 'ru' ? COLS[s].lru : COLS[s].len) : s; }

        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([55.75, 37.62], 5);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM',
            maxZoom: 19
        }).addTo(map);

        let mLay, nLay, geoData, currentData = {},
            lastUpd = null;

        function showLoad(txt, sub) {
            document.querySelector('.loading-text').textContent = txt || t('loading_map');
            if (sub) document.querySelector('.loading-sub').textContent = sub;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoad() { document.getElementById('loadingOverlay').style.display = 'none'; }

        function updStats(regs) {
            let d = 0,
                a = 0;
            for (const r in regs) {
                const s = regs[r].status;
                if (s === 'drone_attack') a++;
                if (s && s !== 'clear') d++;
            }
            const el = document.getElementById('stats');
            if (a > 0) {
                el.innerHTML =
                    `⚠️ ${t('stats_danger')}: <span class="val">${d}</span><span class="sep">|</span>✈️ ${t('stats_attacks')}: <span class="att">${a}</span>`;
            } else {
                el.innerHTML = `⚠️ ${t('stats_danger')}: <span class="val">${d}</span>`;
            }
        }

        function mkSty(s, hov) {
            if (!s || s === 'clear') {
                return { fillColor: "transparent", weight: hov ? 1.5 : 1, color: hov ? "#777" : "#444", fillOpacity: 0,
                    opacity: hov ? 0.7 : 0.3, dashArray: '5,5' };
            }
            if (COLS[s]) {
                return {
                    fillColor: COLS[s].fill,
                    weight: hov ? 3 : (s === 'drone_attack' ? 2.5 : 2),
                    color: COLS[s].border,
                    fillOpacity: hov ? 0.75 : 0.6,
                    opacity: hov ? 1 : 0.85,
                    dashArray: null
                };
            }
            return { fillColor: "rgba(30,30,40,0.3)", weight: 1, color: "#444", fillOpacity: 0.3, opacity: 0.4,
                dashArray: '3,3' };
        }

        function bindEv(l, s) {
            l.on('mouseover', function() { this.setStyle(mkSty(s, true));
                this.bringToFront(); });
            l.on('mouseout', function() { this.setStyle(mkSty(s, false)); });
        }

        function clMsg(m) {
            if (!m) return '';
            return m.replace(/❗️Радар.*?\n?/g, '').replace(/🌐 Обход.*?\n?/g, '')
                .replace(/@radarrussiia\n?/g, '').replace(/@Internet_Boost_bot.*?\n?/g, '')
                .replace(/https?:\/\/t\.me\/\S*/g, '').replace(/🔴 Радар ДНР.*?\n?/g, '')
                .replace(/📢 Оповещения.*?\s*/g, '').trim();
        }

        function mkPop(dn, rd) {
            const s = rd && rd.status;
            let h = `<div class="region-popup"><h4>${dn}</h4>`;
            if (rd && s === 'clear') {
                h +=
                    `<span class="status-badge" style="background:#1a5c1a;">✅ ${t('alert_clear')}</span><br><br>📊 ${t('alert_count')}: <span class="alert-count">${rd.alerts_last_hour||0}</span>`;
            } else if (rd && COLS[s]) {
                const msg = trMsg(clMsg(rd.message || ''));
                h +=
                    `<span class="status-badge" style="background:${COLS[s].border}">${COLS[s].icon} ${gLab(s)}</span><br><br>📊 ${t('alert_count')}: <span class="alert-count">${rd.alerts_last_hour||0}</span>`;
                if (msg) h +=
                    `<br><br><small style="color:#999;">📝 ${msg.substring(0,150)}${msg.length>150?'...':''}</small>`;
            } else {
                h += `<span style="color:#666;">📡 ${t('alert_no_data')}</span>`;
            }
            h += '</div>';
            return h;
        }

        function updMap(regs) {
            if (mLay) map.removeLayer(mLay);
            if (!geoData) return;
            mLay = L.geoJSON(geoData, {
                style: f => {
                    const nm = f.properties.shapeName;
                    const an = gApi(nm, false);
                    const st = an && regs[an] ? regs[an].status : null;
                    return mkSty(st, false);
                },
                onEachFeature: (f, l) => {
                    const nm = f.properties.shapeName;
                    const an = gApi(nm, false);
                    const rd = an ? regs[an] : null;
                    const dn = gDisp(nm, false);
                    l.bindPopup(mkPop(dn, rd), { maxWidth: 250 });
                    bindEv(l, rd ? rd.status : null);
                }
            }).addTo(map);
        }

        async function loadNew(regs) {
            if (nLay) map.removeLayer(nLay);
            try {
                const r = await fetch(NEW_URL);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const d = await r.json();
                nLay = L.geoJSON(d, {
                    style: f => {
                        const nm = f.properties.shapeName;
                        const an = gApi(nm, true);
                        const st = an && regs[an] ? regs[an].status : null;
                        return mkSty(st, false);
                    },
                    onEachFeature: (f, l) => {
                        const nm = f.properties.shapeName;
                        const an = gApi(nm, true) || nm;
                        const rd = regs[an] || null;
                        const dn = gDisp(nm, true);
                        l.bindPopup(mkPop(dn, rd), { maxWidth: 250 });
                        bindEv(l, rd ? rd.status : null);
                    }
                }).addTo(map);
            } catch (e) { console.warn('Новые регионы:', e); }
        }

        async function loadStat() {
            try {
                const d = await fetchWithMultiFallback();
                currentData = d.regions || {};
                lastUpd = d.last_updated;
                updMap(currentData);
                updTime(lastUpd);
                updStats(currentData);
                await loadNew(currentData);
            } catch (e) {
                showErr(`${t('error_loading')}: ${e.message}`);
                console.error(e);
            } finally { hideLoad(); }
        }

        async function init() {
            showLoad(t('loading_map'), t('loading_borders'));
            try {
                const r = await fetch(GEO_URL);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                geoData = await r.json();
                await loadStat();
                setInterval(loadStat, 30000);
            } catch (e) {
                console.error(e);
                showErr(t('error_map'));
                hideLoad();
            }
        }

        function updTime(iso) {
            if (!iso) return;
            const d = new Date(iso);
            document.getElementById('updateTime').innerHTML =
                `🕐 ${t('updated')}: ${d.toLocaleTimeString(lang==='ru'?'ru-RU':'en-US')}`;
        }

        function showErr(m, dur = 4000) {
            const t = document.getElementById('errorToast');
            t.textContent = '⚠️ ' + m;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', dur);
        }

        initBanner();
        updUI();
        init();

        // Кнопки управления
        setTimeout(() => {
            const ResetC = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function() {
                    const d = L.DomUtil.create('div');
                    d.innerHTML = '🗺️';
                    d.title = t('reset_view');
                    d.style.cssText = `
                        background: linear-gradient(135deg, rgba(20,20,40,0.55), rgba(10,10,25,0.7));
                        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
                        color: #fff; width: 32px; height: 32px; border-radius: 8px;
                        cursor: pointer; font-size: 16px; display: flex; align-items: center;
                        justify-content: center; border: 1px solid rgba(255,255,255,0.12);
                        margin-bottom: 6px; transition: all 0.2s;
                    `;
                    d.onmouseover = () => { d.style.background =
                            'linear-gradient(135deg, rgba(40,40,70,0.7), rgba(20,20,45,0.8))'; };
                    d.onmouseout = () => { d.style.background =
                            'linear-gradient(135deg, rgba(20,20,40,0.55), rgba(10,10,25,0.7))'; };
                    d.onclick = () => map.setView([55.75, 37.62], 5);
                    return d;
                }
            });
            new ResetC().addTo(map);

            const InfoC = L.Control.extend({
                options: { position: 'topright' },
                onAdd: function() {
                    const d = L.DomUtil.create('div');
                    d.innerHTML = 'ℹ️';
                    d.title = t('info_title');
                    d.style.cssText = `
                        background: linear-gradient(135deg, rgba(20,20,40,0.55), rgba(10,10,25,0.7));
                        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
                        color: #fff; width: 32px; height: 32px; border-radius: 8px;
                        cursor: pointer; font-size: 16px; display: flex; align-items: center;
                        justify-content: center; border: 1px solid rgba(255,255,255,0.12);
                        margin-top: 50px; margin-right: 8px; transition: all 0.2s;
                    `;
                    d.onmouseover = () => { d.style.background =
                            'linear-gradient(135deg, rgba(40,40,70,0.7), rgba(20,20,45,0.8))'; };
                    d.onmouseout = () => { d.style.background =
                            'linear-gradient(135deg, rgba(20,20,40,0.55), rgba(10,10,25,0.7))'; };
                    d.onclick = () => alert(t('info_text'));
                    return d;
                }
            });
            new InfoC().addTo(map);
        }, 1000);
    </script>
</body>
</html>
