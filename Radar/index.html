<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта воздушных тревог России</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; }
#map { height: 100vh; width: 100vw; }

.legend {
    position: fixed; left: 20px; bottom: 20px;
    background: rgba(0,0,0,0.85); color: white;
    padding: 15px 20px; border-radius: 10px;
    z-index: 1000; font-size: 13px; line-height: 1.8;
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    max-width: 250px;
}
.legend h3 { margin-bottom: 8px; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 5px; }
.legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.legend-color { width: 20px; height: 20px; border-radius: 3px; flex-shrink: 0; }

.update-time {
    position: fixed; right: 20px; top: 20px;
    background: rgba(0,0,0,0.8); color: #ccc;
    padding: 8px 15px; border-radius: 20px;
    z-index: 1000; font-size: 11px;
    backdrop-filter: blur(10px);
}

.status-badge {
    display: inline-block; padding: 4px 10px; border-radius: 5px;
    color: white; font-weight: bold; margin-top: 5px; font-size: 13px;
}
.alert-count { font-weight: bold; font-size: 16px; color: #ff4444; }
.region-popup { font-size: 13px; line-height: 1.6; min-width: 240px; }
.region-popup h4 { margin-bottom: 8px; font-size: 16px; margin-top: 0; }

.error-toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #ff4444; color: white; padding: 10px 20px;
    border-radius: 8px; z-index: 2000; display: none;
}

.stats {
    position: fixed; left: 20px; top: 20px;
    background: rgba(0,0,0,0.8); color: #ccc;
    padding: 8px 15px; border-radius: 20px;
    z-index: 1000; font-size: 12px;
    backdrop-filter: blur(10px);
}

@keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 0.85; }
    100% { opacity: 0.5; }
}
.pulse-border {
    animation: pulse 2s infinite;
}
</style>
</head>
<body>
<div id="map"></div>

<div class="legend">
    <h3>🚨 Обозначения</h3>
    <div class="legend-item"><div class="legend-color" style="background:rgba(45,0,0,0.7); border: 1px solid #ff0000;"></div> 🚀 Ракетная тревога</div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(139,0,0,0.6); border: 1px solid #ff4444;"></div> ⚠️ Ракетная опасность</div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(255,0,0,0.5); border: 1px solid #ff6666;"></div> ✈️ Атака БПЛА</div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(255,215,0,0.5); border: 1px solid #ffdd44;"></div> 🛸 Опасность БПЛА</div>
    <div class="legend-item"><div class="legend-color" style="background:transparent; border: 1px dashed #444;"></div> ✅ Отбой</div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(51,51,51,0.2); border: 1px solid #333;"></div> 📡 Нет данных</div>
</div>

<div class="update-time" id="updateTime">Загрузка...</div>
<div class="stats" id="stats">⚠️ Регионов с тревогой: 0</div>
<div class="error-toast" id="errorToast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_URL = 'https://radar-e1lb.onrender.com/api/statuses';
const GEOJSON_URL = "https://raw.githubusercontent.com/timurkanaz/Russia_geojson_OSM/master/GeoJson's/Countries/Russia_regions.geojson";

const GEOJSON_ALIASES = {
    "Московская область": "Московская обл.",
    "Москва": "Москва",
    "Белгородская область": "Белгородская обл.",
    "Брянская область": "Брянская обл.",
    "Владимирская область": "Владимирская обл.",
    "Воронежская область": "Воронежская обл.",
    "Ивановская область": "Ивановская обл.",
    "Калужская область": "Калужская обл.",
    "Костромская область": "Костромская обл.",
    "Курская область": "Курская обл.",
    "Липецкая область": "Липецкая обл.",
    "Орловская область": "Орловская обл.",
    "Рязанская область": "Рязанская обл.",
    "Смоленская область": "Смоленская обл.",
    "Тамбовская область": "Тамбовская обл.",
    "Тверская область": "Тверская обл.",
    "Тульская область": "Тульская обл.",
    "Ярославская область": "Ярославская обл.",
    "Архангельская область": "Архангельская обл.",
    "Вологодская область": "Вологодская обл.",
    "Калининградская область": "Калининградская обл.",
    "Ленинградская область": "Ленинградская обл.",
    "Санкт-Петербург": "Санкт-Петербург",
    "Мурманская область": "Мурманская обл.",
    "Новгородская область": "Новгородская обл.",
    "Псковская область": "Псковская обл.",
    "Республика Карелия": "Республика Карелия",
    "Республика Коми": "Республика Коми",
    "Ненецкий АО": "Ненецкий АО",
    "Астраханская область": "Астраханская обл.",
    "Волгоградская область": "Волгоградская обл.",
    "Краснодарский край": "Краснодарский край",
    "Республика Адыгея": "Республика Адыгея",
    "Республика Калмыкия": "Республика Калмыкия",
    "Ростовская область": "Ростовская обл.",
    "Республика Крым": "Республика Крым",
    "Севастополь": "Севастополь",
    "Ставропольский край": "Ставропольский край",
    "Республика Дагестан": "Республика Дагестан",
    "Чеченская Республика": "Чеченская респ.",
    "Республика Ингушетия": "Республика Ингушетия",
    "Республика Северная Осетия": "Республика Северная Осетия",
    "Кабардино-Балкарская Республика": "Кабардино-Балкарская респ.",
    "Карачаево-Черкесская Республика": "Карачаево-черкесская респ.",
    "Кировская область": "Кировская обл.",
    "Нижегородская область": "Нижегородская обл.",
    "Оренбургская область": "Оренбургская обл.",
    "Пензенская область": "Пензенская обл.",
    "Пермский край": "Пермский край",
    "Республика Башкортостан": "Республика Башкортостан",
    "Республика Марий Эл": "Республика Марий-Эл",
    "Республика Мордовия": "Республика Мордовия",
    "Республика Татарстан": "Республика Татарстан",
    "Самарская область": "Самарская обл.",
    "Саратовская область": "Саратовская обл.",
    "Республика Удмуртия": "Удмуртская респ.",
    "Ульяновская область": "Ульяновская обл.",
    "Чувашская Республика": "Чувашская респ.",
    "Курганская область": "Курганская обл.",
    "Свердловская область": "Свердловская обл.",
    "Тюменская область": "Тюменская обл.",
    "Челябинская область": "Челябинская обл.",
    "Ханты-Мансийский АО": "Ханты-Мансийский АО",
    "Ямало-Ненецкий АО": "Ямало-Ненецкий АО",
    "Омская область": "Омская обл.",
    "Новосибирская область": "Новосибирская обл.",
    "Томская область": "Томская обл.",
    "Алтайский край": "Алтайский край",
    "Кемеровская область": "Кемеровская обл.",
    "Республика Алтай": "Республика Алтай",
    "Республика Хакасия": "Республика Хакасия",
    "Республика Тыва": "Республика Тыва",
    "Красноярский край": "Красноярский край",
    "Республика Бурятия": "Республика Бурятия",
    "Иркутская область": "Иркутская обл.",
    "Забайкальский край": "Забайкальский край",
    "Амурская область": "Амурская обл.",
    "Республика Саха (Якутия)": "Республика Саха (Якутия)",
    "Еврейская АО": "Еврейская АО",
    "Приморский край": "Приморский край",
    "Хабаровский край": "Хабаровский край",
    "Сахалинская область": "Сахалинская обл.",
    "Магаданская область": "Магаданская обл.",
    "Камчатский край": "Камчатский край",
    "Чукотский АО": "Чукотский АО"
};

// Только для активных угроз - цветная заливка
const COLORS = {
    missile_alert: { fill: "rgba(45,0,0,0.7)", border: "#ff0000", icon: "🚀", label: "РАКЕТНАЯ ТРЕВОГА" },
    missile_danger: { fill: "rgba(139,0,0,0.6)", border: "#ff4444", icon: "⚠️", label: "РАКЕТНАЯ ОПАСНОСТЬ" },
    drone_attack: { fill: "rgba(255,0,0,0.5)", border: "#ff6666", icon: "✈️", label: "АТАКА БПЛА" },
    drone_danger: { fill: "rgba(255,215,0,0.5)", border: "#ffdd44", icon: "🛸", label: "ОПАСНОСТЬ БПЛА" }
};

const map = L.map('map').setView([55.75, 37.62], 5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM',
    maxZoom: 19
}).addTo(map);

let geoLayer;
let geojsonData;

function updateStats(regions) {
    let dangerCount = 0;
    let attackCount = 0;
    for (const r in regions) {
        const status = regions[r].status;
        if (status === 'drone_attack') attackCount++;
        if (status && status !== 'clear') dangerCount++;
    }
    document.getElementById('stats').innerHTML = `⚠️ Регионов с тревогой: ${dangerCount}${attackCount > 0 ? ` | ✈️ Атак: ${attackCount}` : ''}`;
}

fetch(GEOJSON_URL)
    .then(r => {
        if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
        return r.json();
    })
    .then(geojson => {
        console.log('✅ GeoJSON загружен');
        geojsonData = geojson;
        loadStatuses();
        setInterval(loadStatuses, 30000);
    })
    .catch(err => {
        console.error('❌ Ошибка GeoJSON:', err);
        showError('Не удалось загрузить карту');
    });

function loadStatuses() {
    if (!geojsonData) return;
    fetch(API_URL)
        .then(r => {
            if (!r.ok) throw new Error('Сервер недоступен');
            return r.json();
        })
        .then(data => {
            hideError();
            updateMap(data);
            updateTime(data.last_updated);
            updateStats(data.regions);
        })
        .catch(err => {
            showError('Ошибка: ' + err.message);
            console.error(err);
        });
}

function cleanMessage(msg) {
    if (!msg) return '';
    return msg
        .replace(/❗️Радар по всей России.*?\n?/g, '')
        .replace(/🌐 Обход белых списков.*?\n?/g, '')
        .replace(/@radarrussiia\n?/g, '')
        .replace(/@Internet_Boost_bot.*?\n?/g, '')
        .replace(/https?:\/\/t\.me\/Internet_Boost_bot\S*/g, '')
        .trim();
}

function updateMap(data) {
    if (geoLayer) map.removeLayer(geoLayer);
    
    const regions = data.regions || {};
    
    geoLayer = L.geoJSON(geojsonData, {
        style: feature => {
            const geojsonName = feature.properties.region;
            let apiName = null;
            for (const key in GEOJSON_ALIASES) {
                if (GEOJSON_ALIASES[key] === geojsonName) {
                    apiName = key;
                    break;
                }
            }
            const statusData = regions[apiName];
            const status = statusData?.status;
            
            // clear или отсутствие данных - без заливки
            if (!status || status === 'clear') {
                return {
                    fillColor: "transparent",
                    weight: 0.5,
                    color: "#444444",
                    fillOpacity: 0,
                    opacity: 0.3
                };
            }
            
            // Активные угрозы - цветная заливка
            if (COLORS[status]) {
                const isAttack = status === 'drone_attack';
                return {
                    fillColor: COLORS[status].fill,
                    weight: isAttack ? 2.5 : 1.5,
                    color: COLORS[status].border,
                    fillOpacity: isAttack ? 0.8 : 0.7,
                    opacity: 0.9
                };
            }
            
            return {
                fillColor: "transparent",
                weight: 0.5,
                color: "#444",
                fillOpacity: 0,
                opacity: 0.3
            };
        },
        onEachFeature: (feature, layer) => {
            const geojsonName = feature.properties.region;
            let matchedApiName = null;
            for (const key in GEOJSON_ALIASES) {
                if (GEOJSON_ALIASES[key] === geojsonName) {
                    matchedApiName = key;
                    break;
                }
            }
            const regionData = regions[matchedApiName];
            const status = regionData?.status;
            
            let popupHTML = `<div class="region-popup"><h4>${matchedApiName || geojsonName}</h4>`;
            
            if (regionData && status === 'clear') {
                popupHTML += `
                    <span class="status-badge" style="background:#2d5a2d;">✅ ОТБОЙ</span>
                    <br><br>
                    <strong>📊 Оповещений:</strong> <span class="alert-count">${regionData.alerts_last_hour || 0}</span>
                `;
            } else if (regionData && COLORS[status]) {
                const cleanMsg = cleanMessage(regionData.message || '');
                popupHTML += `
                    <span class="status-badge" style="background:${COLORS[status].border}">${COLORS[status].icon} ${COLORS[status].label}</span>
                    <br><br>
                    <strong>📊 Оповещений:</strong> <span class="alert-count">${regionData.alerts_last_hour || 0}</span>
                    ${cleanMsg ? '<br><br><small>📝 ' + cleanMsg.substring(0, 150) + (cleanMsg.length > 150 ? '...' : '') + '</small>' : ''}
                `;
            } else {
                popupHTML += `<p style="color:#888;">📡 НЕТ ДАННЫХ</p>`;
            }
            
            popupHTML += '</div>';
            layer.bindPopup(popupHTML);
            
            // Эффект при наведении
            layer.on('mouseover', function() {
                const s = status;
                if (s && COLORS[s]) {
                    this.setStyle({
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.85
                    });
                } else if (s === 'clear' || !s) {
                    this.setStyle({
                        weight: 1,
                        opacity: 0.6,
                        color: "#666"
                    });
                }
                this.bringToFront();
            });
            
            layer.on('mouseout', function() {
                const s = status;
                if (s && COLORS[s]) {
                    const isAttack = s === 'drone_attack';
                    this.setStyle({
                        weight: isAttack ? 2.5 : 1.5,
                        opacity: 0.9,
                        fillOpacity: isAttack ? 0.8 : 0.7
                    });
                } else {
                    this.setStyle({
                        weight: 0.5,
                        opacity: 0.3,
                        color: "#444"
                    });
                }
            });
        }
    }).addTo(map);
}

function updateTime(isoString) {
    if (!isoString) return;
    const date = new Date(isoString);
    document.getElementById('updateTime').innerHTML = 
        '🕐 Обновлено: ' + date.toLocaleTimeString('ru-RU') + 
        '<br>📅 ' + date.toLocaleDateString('ru-RU');
}

function showError(msg) {
    const toast = document.getElementById('errorToast');
    toast.textContent = '⚠️ ' + msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 5000);
}

function hideError() {
    document.getElementById('errorToast').style.display = 'none';
}

// Кнопка сброса вида
setTimeout(() => {
    const resetBtn = L.control({ position: 'bottomright' });
    resetBtn.onAdd = function() {
        const div = L.DomUtil.create('div', 'reset-button');
        div.innerHTML = '🗺️ Сброс вида';
        div.style.cssText = `
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            backdrop-filter: blur(10px);
            margin-right: 10px;
            margin-bottom: 10px;
            font-family: 'Segoe UI', sans-serif;
        `;
        div.onclick = () => {
            map.setView([55.75, 37.62], 5);
        };
        return div;
    };
    resetBtn.addTo(map);
    
    // Информационная кнопка
    const infoBtn = L.control({ position: 'topright' });
    infoBtn.onAdd = function() {
        const div = L.DomUtil.create('div', 'info-button');
        div.innerHTML = 'ℹ️';
        div.style.cssText = `
            background: rgba(0,0,0,0.8);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            margin-top: 60px;
            margin-right: 10px;
        `;
        div.onclick = () => {
            alert('📡 Карта воздушных тревог России\n\n' +
                  '🚀 Ракетная тревога - срочно пройдите в укрытие\n' +
                  '⚠️ Ракетная опасность - возможен пуск ракет\n' +
                  '✈️ Атака БПЛА - активная атака дронов\n' +
                  '🛸 Опасность БПЛА - угроза атаки дронов\n' +
                  '✅ Отбой - угроза миновала\n\n' +
                  'Данные обновляются каждые 30 секунд');
        };
        return div;
    };
    infoBtn.addTo(map);
}, 1000);
</script>
</body>
</html>
