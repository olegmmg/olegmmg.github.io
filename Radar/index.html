<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта воздушных тревог России</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; }
#map { height: 100vh; width: 100vw; }

.legend {
    position: fixed; left: 20px; bottom: 20px;
    background: rgba(0,0,0,0.85); color: white;
    padding: 15px 20px; border-radius: 10px;
    z-index: 1000; font-size: 13px; line-height: 1.8;
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    max-width: 280px;
}
.legend h3 { margin-bottom: 8px; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 5px; }
.legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.legend-color { width: 20px; height: 20px; border-radius: 3px; flex-shrink: 0; }

.update-time {
    position: fixed; right: 20px; top: 20px;
    background: rgba(0,0,0,0.8); color: #ccc;
    padding: 8px 15px; border-radius: 20px;
    z-index: 1000; font-size: 11px;
    backdrop-filter: blur(10px);
}

.status-badge {
    display: inline-block; padding: 4px 10px; border-radius: 5px;
    color: white; font-weight: bold; margin-top: 5px; font-size: 13px;
}
.alert-count { font-weight: bold; font-size: 16px; color: #ff4444; }
.region-popup { font-size: 13px; line-height: 1.6; min-width: 240px; }
.region-popup h4 { margin-bottom: 8px; font-size: 16px; margin-top: 0; }

.error-toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #ff4444; color: white; padding: 10px 20px;
    border-radius: 8px; z-index: 2000; display: none;
}

.stats {
    position: fixed; left: 20px; top: 20px;
    background: rgba(0,0,0,0.8); color: #ccc;
    padding: 8px 15px; border-radius: 20px;
    z-index: 1000; font-size: 12px;
    backdrop-filter: blur(10px);
}

.lang-toggle {
    position: fixed; right: 20px; top: 80px;
    background: rgba(0,0,0,0.8);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
    z-index: 1000;
    backdrop-filter: blur(10px);
    font-family: inherit;
}
.lang-toggle:hover {
    background: rgba(50,50,50,0.9);
}

.loading-overlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 20px 30px;
    border-radius: 15px;
    z-index: 2000;
    font-size: 16px;
    text-align: center;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    pointer-events: none;
}
.loading-spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #ff4444;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: #ccc; }
.loading-sub { font-size: 11px; color: #888; }
</style>
</head>
<body>
<div id="map"></div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" data-i18n="loading_map">Загрузка карты...</div>
    <div class="loading-sub" data-i18n="loading_borders">Загрузка границ регионов</div>
</div>

<button class="lang-toggle" id="langToggle">English</button>

<div class="legend">
    <h3 data-i18n="legend_title">🚨 Обозначения</h3>

    <div class="legend-item"><div class="legend-color" style="background:rgba(255,0,0,0.5); border: 1px solid #ff6666;"></div> <span data-i18n="legend_drone_attack">✈️ Атака БПЛА</span></div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(255,215,0,0.5); border: 1px solid #ffdd44;"></div> <span data-i18n="legend_drone_danger">⚠️ Опасность БПЛА</span></div>
    <div class="legend-item"><div class="legend-color" style="background:transparent; border: 1px dashed #444;"></div> <span data-i18n="legend_clear">✅ Отбой</span></div>

let currentLang = localStorage.getItem('radar_lang') || 'ru';
if (!translations[currentLang]) currentLang = 'ru';

function t(key) {
    return translations[currentLang][key] || translations.ru[key] || key;
}

function updateUI() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (key && translations[currentLang][key]) {
            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                el.placeholder = translations[currentLang][key];
            } else {
                el.textContent = translations[currentLang][key];
            }
        }
    });
    document.documentElement.lang = currentLang === 'ru' ? 'ru' : 'en';
    document.getElementById('langToggle').textContent = currentLang === 'ru' ? 'English' : 'Русский';
    
    const statsSpan = document.querySelector('#stats span');
    if (statsSpan) {
        statsSpan.textContent = t('stats_danger');
    }
    
    const updateTimeDiv = document.getElementById('updateTime');
    if (updateTimeDiv && updateTimeDiv.innerHTML.includes('Обновлено')) {
        const date = new Date();
        updateTimeDiv.innerHTML = `🕐 ${t('updated')}: ${date.toLocaleTimeString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}<br>📅 ${date.toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}`;
    }
}

function toggleLang() {
    currentLang = currentLang === 'ru' ? 'en' : 'ru';
    localStorage.setItem('radar_lang', currentLang);
    updateUI();
    
    if (currentRegionsData && Object.keys(currentRegionsData).length > 0) {
        updateMainMap(currentRegionsData);
        loadNewRegions(currentRegionsData);
    }
    if (lastUpdateTime) updateTime(lastUpdateTime);
}

document.getElementById('langToggle').addEventListener('click', toggleLang);

    "Volgograd Oblast":                  { api: "Волгоградская область",             ru: "Волгоградская область",             en: "Volgograd Oblast" },
    "Vologda Oblast":                    { api: "Вологодская область",               ru: "Вологодская область",               en: "Vologda Oblast" },
    "Voronezh Oblast":                   { api: "Воронежская область",               ru: "Воронежская область",               en: "Voronezh Oblast" },
    "Yamalo-Nenets Autonomous Okrug":    { api: "ЯНАО",                              ru: "ЯНАО",                              en: "Yamalo-Nenets AO" },
    "Yaroslavl Oblast":                  { api: "Ярославская область",               ru: "Ярославская область",               en: "Yaroslavl Oblast" },
    "Zabaykalsky Krai":                  { api: "Забайкальский край",                ru: "Забайкальский край",                en: "Zabaykalsky Krai" },
    "Adygea":                            { api: "Республика Адыгея",                 ru: "Республика Адыгея",                 en: "Republic of Adygea" }
};

// Backward compat: keep SHAPE_TO_API for any legacy code
const SHAPE_TO_API = Object.fromEntries(Object.entries(REGION_MAP).map(([k,v])=>[k,v.api]));

// New regions (occupied territories)
const NEW_REGIONS_MAP = {
    "Donetsk Oblast":               { api: "Донецкая Народная Республика",  ru: "Донецкая Народная Республика",  en: "Donetsk People's Republic" },
    "Luhansk Oblast":               { api: "Луганская Народная Республика", ru: "Луганская Народная Республика", en: "Luhansk People's Republic" },
    "Zaporizhia Oblast":            { api: "Запорожская область",            ru: "Запорожская область",            en: "Zaporizhia Oblast" },
    "Kherson Oblast":               { api: "Херсонская область",             ru: "Херсонская область",             en: "Kherson Oblast" },
    "Autonomous Republic of Crimea":{ api: "Республика Крым",                ru: "Республика Крым",                en: "Republic of Crimea" },
    "Sevastopol":                   { api: "Республика Крым",                ru: "Республика Крым",                en: "Sevastopol / Crimea" }
};

// Backward compat
const NEW_REGIONS_NAMES = Object.fromEntries(Object.entries(NEW_REGIONS_MAP).map(([k,v])=>[k,v.api]));

// Returns the display name for a region in the current language
function getDisplayName(shapeName, isNewRegion) {
    const map = isNewRegion ? NEW_REGIONS_MAP : REGION_MAP;
    const entry = map[shapeName];
    if (!entry) return shapeName;
    return currentLang === 'ru' ? entry.ru : entry.en;
}

// Returns the api key (Russian) for a region
function getApiName(shapeName, isNewRegion) {
    const map = isNewRegion ? NEW_REGIONS_MAP : REGION_MAP;
    return map[shapeName] ? map[shapeName].api : null;
}

// Translates alert message text from Russian to English key phrases when EN is active
function translateMessage(msg) {
    if (!msg || currentLang === 'ru') return msg;
    return msg
        .replace(/Ракетная тревога/gi, 'Missile alert')
        .replace(/Ракетная опасность/gi, 'Missile danger')
        .replace(/Атака БПЛА/gi, 'Drone attack')
        .replace(/Опасность БПЛА/gi, 'Drone danger')
        .replace(/Угроза атаки дронов/gi, 'Drone attack threat')
        .replace(/Отбой/gi, 'All clear')
        .replace(/Нет данных/gi, 'No data')
        .replace(/Тревога/gi, 'Alert')
        .replace(/Опасность/gi, 'Danger')
        .replace(/Данные обновляются/gi, 'Data updates')
        .replace(/каждые (\d+) секунд/gi, 'every $1 seconds')
        .replace(/Укрытие/gi, 'Shelter')
        .replace(/срочно в укрытие/gi, 'take cover immediately')
        .replace(/возможен пуск ракет/gi, 'possible missile launch')
        .replace(/активная атака дронов/gi, 'active drone attack')
        .replace(/угроза атаки дронов/gi, 'drone attack threat')
        .replace(/угроза миновала/gi, 'threat passed');
}

const COLORS = {
    missile_alert:  { fill: "rgba(45,0,0,0.7)",    border: "#ff0000", icon: "🚀", label_ru: "РАКЕТНАЯ ТРЕВОГА", label_en: "MISSILE ALERT" },
    missile_danger: { fill: "rgba(139,0,0,0.6)",   border: "#ff4444", icon: "⚠️", label_ru: "РАКЕТНАЯ ОПАСНОСТЬ", label_en: "MISSILE DANGER" },
    drone_attack:   { fill: "rgba(255,0,0,0.5)",   border: "#ff6666", icon: "✈️", label_ru: "АТАКА БПЛА", label_en: "DRONE ATTACK" },
    drone_danger:   { fill: "rgba(255,215,0,0.5)", border: "#ffdd44", icon: "⚠️", label_ru: "ОПАСНОСТЬ БПЛА", label_en: "DRONE DANGER" }
};

function getStatusLabel(status) {
    if (!COLORS[status]) return status;
    return currentLang === 'ru' ? COLORS[status].label_ru : COLORS[status].label_en;
}

const map = L.map('map').setView([55.75, 37.62], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM',
    maxZoom: 19
}).addTo(map);

let mainLayer, newRegionsLayer, geojsonData, currentRegionsData = {}, lastUpdateTime = null;

function showLoading(text, subtext) {
    const overlay = document.getElementById('loadingOverlay');
    document.querySelector('.loading-text').textContent = text || t('loading_map');
    if (subtext) document.querySelector('.loading-sub').textContent = subtext;
    overlay.style.display = 'flex';
}

function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
}

function updateStats(regions) {
    let dangerCount = 0, attackCount = 0;
    for (const r in regions) {
        const status = regions[r].status;
        if (status === 'drone_attack') attackCount++;
        if (status && status !== 'clear') dangerCount++;
    }
    document.getElementById('stats').innerHTML = `⚠️ ${t('stats_danger')}: ${dangerCount}${attackCount > 0 ? ` | ✈️ ${t('stats_attacks')}: ${attackCount}` : ''}`;
}

function makeStyle(status, hover) {
    if (!status || status === 'clear') {
        return { fillColor: "transparent", weight: hover ? 1 : 0.5, color: hover ? "#666" : "#444", fillOpacity: 0, opacity: hover ? 0.6 : 0.3 };
    }
    if (COLORS[status]) {
        const isAttack = status === 'drone_attack';
        return {
            fillColor: COLORS[status].fill,
            weight: hover ? 3 : (isAttack ? 2.5 : 1.5),
            color: COLORS[status].border,
            fillOpacity: hover ? 0.85 : (isAttack ? 0.8 : 0.7),
            opacity: hover ? 1 : 0.9
        };
    }
    return { fillColor: "transparent", weight: 0.5, color: "#444", fillOpacity: 0, opacity: 0.3 };
}

function makePopup(displayName, regionData) {
    const status = regionData && regionData.status;
    let html = `<div class="region-popup"><h4>${displayName}</h4>`;
    if (regionData && status === 'clear') {
        html += `<span class="status-badge" style="background:#2d5a2d;">✅ ${t('alert_clear')}</span><br><br><strong>📊 ${t('alert_count')}:</strong> <span class="alert-count">${regionData.alerts_last_hour || 0}</span>`;
    } else if (regionData && COLORS[status]) {
        const rawMsg = cleanMessage(regionData.message || '');
        const msg = translateMessage(rawMsg);
        html += `<span class="status-badge" style="background:${COLORS[status].border}">${COLORS[status].icon} ${getStatusLabel(status)}</span><br><br><strong>📊 ${t('alert_count')}:</strong> <span class="alert-count">${regionData.alerts_last_hour || 0}</span>${msg ? `<br><br><small>📝 ${msg.substring(0, 200)}${msg.length > 200 ? '...' : ''}</small>` : ''}`;
    } else {
        html += `<p style="color:#888;">📡 ${t('alert_no_data')}</p>`;
    }
    html += '</div>';
    return html;
}

function bindLayerEvents(layer, status) {
    layer.on('mouseover', function() { this.setStyle(makeStyle(status, true)); this.bringToFront(); });
    layer.on('mouseout', function() { this.setStyle(makeStyle(status, false)); });
}

function cleanMessage(msg) {
    if (!msg) return '';
    return msg.replace(/❗️Радар по всей России.*?\n?/g, '').replace(/🌐 Обход белых списков.*?\n?/g, '')
        .replace(/@radarrussiia\n?/g, '').replace(/@Internet_Boost_bot.*?\n?/g, '')
        .replace(/https?:\/\/t\.me\/Internet_Boost_bot\S*/g, '').replace(/🔴 Радар ДНР.*?\n?/g, '')
        .replace(/📢 Оповещения Радар ДНР:\s*/g, '').trim();
}

function updateMainMap(regions) {
    if (mainLayer) map.removeLayer(mainLayer);
    mainLayer = L.geoJSON(geojsonData, {
        style: feature => {
            const shapeName = feature.properties.shapeName;
            const apiName = getApiName(shapeName, false);
            const status = apiName && regions[apiName] ? regions[apiName].status : null;
            return makeStyle(status, false);
        },
        onEachFeature: (feature, layer) => {
            const shapeName = feature.properties.shapeName;
            const apiName = getApiName(shapeName, false);
            const regionData = apiName ? regions[apiName] : null;
            const status = regionData ? regionData.status : null;
            const displayName = getDisplayName(shapeName, false);
            layer.bindPopup(makePopup(displayName, regionData));
            bindLayerEvents(layer, status);
        }
    }).addTo(map);
}

async function loadNewRegions(regions) {
    if (newRegionsLayer) map.removeLayer(newRegionsLayer);
    try {
        const response = await fetch(NEW_REGIONS_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        newRegionsLayer = L.geoJSON(data, {
            style: feature => {
                const shapeName = feature.properties.shapeName;
                const apiName = getApiName(shapeName, true);
                const status = apiName && regions[apiName] ? regions[apiName].status : null;
                return makeStyle(status, false);
            },
            onEachFeature: (feature, layer) => {
                const shapeName = feature.properties.shapeName;
                const apiName = getApiName(shapeName, true) || shapeName;
                const regionData = regions[apiName] || null;
                const status = regionData ? regionData.status : null;
                const displayName = getDisplayName(shapeName, true);
                layer.bindPopup(makePopup(displayName, regionData));
                bindLayerEvents(layer, status);
            }
        }).addTo(map);
        console.log('✅ Новые регионы загружены');
    } catch (err) {
        console.warn('❌ Не удалось загрузить новые регионы:', err);
    }
}

async function loadStatuses() {
    showLoading(t('loading_map'), t('loading_borders'));
    try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(t('error_server'));
        const data = await response.json();
        currentRegionsData = data.regions || {};
        lastUpdateTime = data.last_updated;
        updateMainMap(currentRegionsData);
        updateTime(lastUpdateTime);
        updateStats(currentRegionsData);
        await loadNewRegions(currentRegionsData);
    } catch (err) {
        showError(`${t('error_loading')}: ${err.message}`);
        console.error(err);
    } finally {
        hideLoading();
    }
}

async function initMap() {
    showLoading(t('loading_map'), t('loading_borders'));
    try {
        const response = await fetch(GEOJSON_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        geojsonData = await response.json();
        console.log('✅ GeoJSON загружен');
        await loadStatuses();
        setInterval(loadStatuses, 30000);
    } catch (err) {
        console.error('❌ Ошибка загрузки карты:', err);
        showError(t('error_map'));
        hideLoading();
    }
}

function updateTime(isoString) {
    if (!isoString) return;
    const date = new Date(isoString);
    document.getElementById('updateTime').innerHTML = `🕐 ${t('updated')}: ${date.toLocaleTimeString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}<br>📅 ${date.toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}`;
}

function showError(msg) {
    const toast = document.getElementById('errorToast');
    toast.textContent = '⚠️ ' + msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 5000);
}

updateUI();
initMap();

setTimeout(() => {
    const resetBtn = L.control({ position: 'bottomright' });
    resetBtn.onAdd = function() {
        const div = L.DomUtil.create('div');
        div.innerHTML = t('reset_view');
        div.style.cssText = `background:rgba(0,0,0,0.8);color:white;padding:8px 15px;border-radius:20px;cursor:pointer;font-size:13px;backdrop-filter:blur(10px);margin-right:10px;margin-bottom:10px;font-family:'Segoe UI',sans-serif;`;
        div.onclick = () => map.setView([55.75, 37.62], 5);
        return div;
    };
    resetBtn.addTo(map);

    const infoBtn = L.control({ position: 'topright' });
    infoBtn.onAdd = function() {
        const div = L.DomUtil.create('div');
        div.innerHTML = 'ℹ️';
        div.style.cssText = `background:rgba(0,0,0,0.8);color:white;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);margin-top:60px;margin-right:10px;`;
        div.onclick = () => alert(t('info_text'));
        return div;
    };
    infoBtn.addTo(map);
}, 1000);
</script>
</body>
</html>
