<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта воздушных тревог России</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; }
#map { height: 100vh; width: 100vw; }

.legend {
    position: fixed; left: 20px; bottom: 20px;
    background: rgba(0,0,0,0.85); color: white;
    padding: 15px 20px; border-radius: 10px;
    z-index: 1000; font-size: 13px; line-height: 1.8;
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    max-width: 280px;
}
.legend h3 { margin-bottom: 8px; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 5px; }
.legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.legend-color { width: 20px; height: 20px; border-radius: 3px; flex-shrink: 0; }

.update-time {
    position: fixed; right: 20px; top: 20px;
    background: rgba(0,0,0,0.8); color: #ccc;
    padding: 8px 15px; border-radius: 20px;
    z-index: 1000; font-size: 11px;
    backdrop-filter: blur(10px);
}

.status-badge {
    display: inline-block; padding: 4px 10px; border-radius: 5px;
    color: white; font-weight: bold; margin-top: 5px; font-size: 13px;
}
.alert-count { font-weight: bold; font-size: 16px; color: #ff4444; }
.region-popup { font-size: 13px; line-height: 1.6; min-width: 240px; }
.region-popup h4 { margin-bottom: 8px; font-size: 16px; margin-top: 0; }

.error-toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #ff4444; color: white; padding: 10px 20px;
    border-radius: 8px; z-index: 2000; display: none;
}

.stats {
    position: fixed; left: 20px; top: 20px;
    background: rgba(0,0,0,0.8); color: #ccc;
    padding: 8px 15px; border-radius: 20px;
    z-index: 1000; font-size: 12px;
    backdrop-filter: blur(10px);
}

.lang-toggle {
    position: fixed; right: 20px; top: 80px;
    background: rgba(0,0,0,0.8);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 12px;
    z-index: 1000;
    backdrop-filter: blur(10px);
    font-family: inherit;
}
.lang-toggle:hover {
    background: rgba(50,50,50,0.9);
}

.loading-overlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 20px 30px;
    border-radius: 15px;
    z-index: 2000;
    font-size: 16px;
    text-align: center;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    pointer-events: none;
}
.loading-spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #ff4444;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 14px; color: #ccc; }
.loading-sub { font-size: 11px; color: #888; }
</style>
</head>
<body>
<div id="map"></div>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text" data-i18n="loading_map">Загрузка карты...</div>
    <div class="loading-sub" data-i18n="loading_borders">Загрузка границ регионов</div>
</div>

<button class="lang-toggle" id="langToggle">English</button>

<div class="legend">
    <h3 data-i18n="legend_title">🚨 Обозначения</h3>
    <div class="legend-item"><div class="legend-color" style="background:rgba(45,0,0,0.7); border: 1px solid #ff0000;"></div> <span data-i18n="legend_missile_alert">🚀 Ракетная тревога</span></div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(139,0,0,0.6); border: 1px solid #ff4444;"></div> <span data-i18n="legend_missile_danger">⚠️ Ракетная опасность</span></div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(255,0,0,0.5); border: 1px solid #ff6666;"></div> <span data-i18n="legend_drone_attack">✈️ Атака БПЛА</span></div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(255,215,0,0.5); border: 1px solid #ffdd44;"></div> <span data-i18n="legend_drone_danger">⚠️ Опасность БПЛА</span></div>
    <div class="legend-item"><div class="legend-color" style="background:transparent; border: 1px dashed #444;"></div> <span data-i18n="legend_clear">✅ Отбой</span></div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(51,51,51,0.2); border: 1px solid #333;"></div> <span data-i18n="legend_no_data">📡 Нет данных</span></div>
</div>

<div class="update-time" id="updateTime" data-i18n="loading">Загрузка...</div>
<div class="stats" id="stats">⚠️ <span data-i18n="stats_danger">Регионов с тревогой</span>: 0</div>
<div class="error-toast" id="errorToast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---------- ЛОКАЛИЗАЦИЯ ----------
const translations = {
    ru: {
        loading_map: "Загрузка карты...",
        loading_borders: "Загрузка границ регионов",
        legend_title: "🚨 Обозначения",
        legend_missile_alert: "🚀 Ракетная тревога",
        legend_missile_danger: "⚠️ Ракетная опасность",
        legend_drone_attack: "✈️ Атака БПЛА",
        legend_drone_danger: "⚠️ Опасность БПЛА",
        legend_clear: "✅ Отбой",
        legend_no_data: "📡 Нет данных",
        loading: "Загрузка...",
        stats_danger: "Регионов с тревогой",
        stats_attacks: "Атак",
        updated: "Обновлено",
        error_server: "Сервер недоступен",
        error_map: "Не удалось загрузить карту",
        error_loading: "Ошибка загрузки",
        alert_clear: "ОТБОЙ",
        alert_no_data: "НЕТ ДАННЫХ",
        alert_count: "Оповещений",
        popup_no_data: "📡 НЕТ ДАННЫХ",
        missile_alert: "РАКЕТНАЯ ТРЕВОГА",
        missile_danger: "РАКЕТНАЯ ОПАСНОСТЬ",
        drone_attack: "АТАКА БПЛА",
        drone_danger: "ОПАСНОСТЬ БПЛА",
        reset_view: "🗺️ Сброс вида",
        info_title: "📡 Карта воздушных тревог России",
        info_text: "🚀 Ракетная тревога — срочно в укрытие\n⚠️ Ракетная опасность — возможен пуск ракет\n✈️ Атака БПЛА — активная атака дронов\n⚠️ Опасность БПЛА — угроза атаки дронов\n✅ Отбой — угроза миновала\n\nДанные обновляются каждые 30 секунд"
    },
    en: {
        loading_map: "Loading map...",
        loading_borders: "Loading region borders",
        legend_title: "🚨 Legend",
        legend_missile_alert: "🚀 Missile alert",
        legend_missile_danger: "⚠️ Missile danger",
        legend_drone_attack: "✈️ Drone attack",
        legend_drone_danger: "⚠️ Drone danger",
        legend_clear: "✅ All clear",
        legend_no_data: "📡 No data",
        loading: "Loading...",
        stats_danger: "Regions in danger",
        stats_attacks: "Attacks",
        updated: "Updated",
        error_server: "Server unavailable",
        error_map: "Failed to load map",
        error_loading: "Loading error",
        alert_clear: "ALL CLEAR",
        alert_no_data: "NO DATA",
        alert_count: "Alerts",
        popup_no_data: "📡 NO DATA",
        missile_alert: "MISSILE ALERT",
        missile_danger: "MISSILE DANGER",
        drone_attack: "DRONE ATTACK",
        drone_danger: "DRONE DANGER",
        reset_view: "🗺️ Reset view",
        info_title: "📡 Russia Air Alert Map",
        info_text: "🚀 Missile alert — take cover immediately\n⚠️ Missile danger — possible missile launch\n✈️ Drone attack — active drone attack\n⚠️ Drone danger — threat of drone attack\n✅ All clear — threat is over\n\nData updates every 30 seconds"
    }
};

let currentLang = localStorage.getItem('radar_lang') || 'ru';
if (!translations[currentLang]) currentLang = 'ru';

function t(key) {
    return translations[currentLang][key] || translations.ru[key] || key;
}

function updateUI() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (key && translations[currentLang][key]) {
            if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                el.placeholder = translations[currentLang][key];
            } else {
                el.textContent = translations[currentLang][key];
            }
        }
    });
    document.documentElement.lang = currentLang === 'ru' ? 'ru' : 'en';
    document.getElementById('langToggle').textContent = currentLang === 'ru' ? 'English' : 'Русский';
    
    const statsSpan = document.querySelector('#stats span');
    if (statsSpan) {
        statsSpan.textContent = t('stats_danger');
    }
    
    const updateTimeDiv = document.getElementById('updateTime');
    if (updateTimeDiv && updateTimeDiv.innerHTML.includes('Обновлено')) {
        const date = new Date();
        updateTimeDiv.innerHTML = `🕐 ${t('updated')}: ${date.toLocaleTimeString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}<br>📅 ${date.toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}`;
    }
}

function toggleLang() {
    currentLang = currentLang === 'ru' ? 'en' : 'ru';
    localStorage.setItem('radar_lang', currentLang);
    updateUI();
    
    if (currentRegionsData && Object.keys(currentRegionsData).length > 0) {
        updateMainMap(currentRegionsData);
        loadNewRegions(currentRegionsData);
    }
    if (lastUpdateTime) updateTime(lastUpdateTime);
}

document.getElementById('langToggle').addEventListener('click', toggleLang);

// ---------- КОНФИГУРАЦИЯ ----------
const API_URL = 'https://radar-e1lb.onrender.com/api/statuses';
const GEOJSON_URL = "/Radar/geoBoundaries-RUS-ADM1_simplified.geojson";
const NEW_REGIONS_URL = "/Radar/ukraine_regions_needed.geojson";

const SHAPE_TO_API = {
    "Altai Krai": "Алтайский край", "Altai Republic": "Республика Алтай",
    "Amur Oblast": "Амурская область", "Arkhangelsk Oblast": "Архангельская область",
    "Astrakhan Oblast": "Астраханская область", "Bashkortostan": "Республика Башкортостан",
    "Belgorod Oblast": "Белгородская область", "Bryansk Oblast": "Брянская область",
    "Buryatia": "Республика Бурятия", "Chechnya": "Чеченская Республика",
    "Chelyabinsk Oblast": "Челябинская область", "Chukotka Autonomous Okrug": "Чукотский АО",
    "Chuvashia": "Чувашская Республика", "Dagestan": "Республика Дагестан",
    "Ingushetia": "Республика Ингушетия", "Ivanovo Oblast": "Ивановская область",
    "Irkutsk Oblast": "Иркутская область", "Jewish Autonomous Oblast": "Еврейская АО",
    "Kabardino-Balkaria": "Кабардино-Балкарская Республика", "Kaliningrad": "Калининградская область",
    "Kaluga Oblast": "Калужская область", "Kalmykia": "Республика Калмыкия",
    "Kamchatka Krai": "Камчатский край", "Karachay-Cherkessia": "Карачаево-Черкесская Республика",
    "Kemerovo Oblast": "Кемеровская область", "Khabarovsk Krai": "Хабаровский край",
    "Khanty-Mansiysk Autonomous Okrug – Ugra": "Ханты-Мансийский АО", "Khakassia": "Республика Хакасия",
    "Kirov Oblast": "Кировская область", "Komi Republic": "Республика Коми",
    "Kostroma Oblast": "Костромская область", "Krasnodar Krai": "Краснодарский край",
    "Krasnoyarsk Krai": "Красноярский край", "Kurgan Oblast": "Курганская область",
    "Kursk Oblast": "Курская область", "Leningrad oblast": "Ленинградская область",
    "Lipetsk Oblast": "Липецкая область", "Magadan Oblast": "Магаданская область",
    "Mari El": "Республика Марий Эл", "Moscow": "Москва", "Moscow Oblast": "Московская область",
    "Murmansk Oblast": "Мурманская область", "Nenets Autonomous Okrug": "Ненецкий АО",
    "Nizhny Novgorod Oblast": "Нижегородская область", "North Ossetia–Alania": "Республика Северная Осетия",
    "Novgorod Oblast": "Новгородская область", "Novosibirsk Oblast": "Новосибирская область",
    "Omsk Oblast": "Омская область", "Orenburg Oblast": "Оренбургская область",
    "Oryol Oblast": "Орловская область", "Penza Oblast": "Пензенская область",
    "Perm Krai": "Пермский край", "Primorsky Krai": "Приморский край",
    "Pskov Oblast": "Псковская область", "Republic of Karelia": "Республика Карелия",
    "Republic of Mordovia": "Республика Мордовия", "Rostov Oblast": "Ростовская область",
    "Ryazan Oblast": "Рязанская область", "Saint Petersburg": "Ленинградская область",
    "Sakha Republic": "Республика Саха (Якутия)", "Sakhalin Oblast": "Сахалинская область",
    "Samara Oblast": "Самарская область", "Saratov Oblast": "Саратовская область",
    "Smolensk Oblast": "Смоленская область", "Stavropol Krai": "Ставропольский край",
    "Sverdlovsk Oblast": "Свердловская область", "Tambov Oblast": "Тамбовская область",
    "Tatarstan": "Республика Татарстан", "Tomsk Oblast": "Томская область",
    "Tula Oblast": "Тульская область", "Tuva": "Республика Тыва", "Tver Oblast": "Тверская область",
    "Tyumen Oblast": "Тюменская область", "Udmurtia": "Республика Удмуртия",
    "Ulyanovsk Oblast": "Ульяновская область", "Vladimir Oblast": "Владимирская область",
    "Volgograd Oblast": "Волгоградская область", "Vologda Oblast": "Вологодская область",
    "Voronezh Oblast": "Воронежская область", "Yamalo-Nenets Autonomous Okrug": "ЯНАО",
    "Yaroslavl Oblast": "Ярославская область", "Zabaykalsky Krai": "Забайкальский край",
    "Adygea": "Республика Адыгея"
};

const NEW_REGIONS_NAMES = {
    "Donetsk Oblast": "Донецкая Народная Республика",
    "Luhansk Oblast": "Луганская Народная Республика",
    "Zaporizhia Oblast": "Запорожская область",
    "Kherson Oblast": "Херсонская область",
    "Autonomous Republic of Crimea": "Республика Крым",
    "Sevastopol": "Республика Крым"
};

const COLORS = {
    missile_alert:  { fill: "rgba(45,0,0,0.7)",    border: "#ff0000", icon: "🚀", label_ru: "РАКЕТНАЯ ТРЕВОГА", label_en: "MISSILE ALERT" },
    missile_danger: { fill: "rgba(139,0,0,0.6)",   border: "#ff4444", icon: "⚠️", label_ru: "РАКЕТНАЯ ОПАСНОСТЬ", label_en: "MISSILE DANGER" },
    drone_attack:   { fill: "rgba(255,0,0,0.5)",   border: "#ff6666", icon: "✈️", label_ru: "АТАКА БПЛА", label_en: "DRONE ATTACK" },
    drone_danger:   { fill: "rgba(255,215,0,0.5)", border: "#ffdd44", icon: "⚠️", label_ru: "ОПАСНОСТЬ БПЛА", label_en: "DRONE DANGER" }
};

function getStatusLabel(status) {
    if (!COLORS[status]) return status;
    return currentLang === 'ru' ? COLORS[status].label_ru : COLORS[status].label_en;
}

const map = L.map('map').setView([55.75, 37.62], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM',
    maxZoom: 19
}).addTo(map);

let mainLayer, newRegionsLayer, geojsonData, currentRegionsData = {}, lastUpdateTime = null;

function showLoading(text, subtext) {
    const overlay = document.getElementById('loadingOverlay');
    document.querySelector('.loading-text').textContent = text || t('loading_map');
    if (subtext) document.querySelector('.loading-sub').textContent = subtext;
    overlay.style.display = 'flex';
}

function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
}

function updateStats(regions) {
    let dangerCount = 0, attackCount = 0;
    for (const r in regions) {
        const status = regions[r].status;
        if (status === 'drone_attack') attackCount++;
        if (status && status !== 'clear') dangerCount++;
    }
    document.getElementById('stats').innerHTML = `⚠️ ${t('stats_danger')}: ${dangerCount}${attackCount > 0 ? ` | ✈️ ${t('stats_attacks')}: ${attackCount}` : ''}`;
}

function makeStyle(status, hover) {
    if (!status || status === 'clear') {
        return { fillColor: "transparent", weight: hover ? 1 : 0.5, color: hover ? "#666" : "#444", fillOpacity: 0, opacity: hover ? 0.6 : 0.3 };
    }
    if (COLORS[status]) {
        const isAttack = status === 'drone_attack';
        return {
            fillColor: COLORS[status].fill,
            weight: hover ? 3 : (isAttack ? 2.5 : 1.5),
            color: COLORS[status].border,
            fillOpacity: hover ? 0.85 : (isAttack ? 0.8 : 0.7),
            opacity: hover ? 1 : 0.9
        };
    }
    return { fillColor: "transparent", weight: 0.5, color: "#444", fillOpacity: 0, opacity: 0.3 };
}

function makePopup(displayName, regionData) {
    const status = regionData && regionData.status;
    let html = `<div class="region-popup"><h4>${displayName}</h4>`;
    if (regionData && status === 'clear') {
        html += `<span class="status-badge" style="background:#2d5a2d;">✅ ${t('alert_clear')}</span><br><br><strong>📊 ${t('alert_count')}:</strong> <span class="alert-count">${regionData.alerts_last_hour || 0}</span>`;
    } else if (regionData && COLORS[status]) {
        const msg = cleanMessage(regionData.message || '');
        html += `<span class="status-badge" style="background:${COLORS[status].border}">${COLORS[status].icon} ${getStatusLabel(status)}</span><br><br><strong>📊 ${t('alert_count')}:</strong> <span class="alert-count">${regionData.alerts_last_hour || 0}</span>${msg ? `<br><br><small>📝 ${msg.substring(0, 150)}${msg.length > 150 ? '...' : ''}</small>` : ''}`;
    } else {
        html += `<p style="color:#888;">📡 ${t('alert_no_data')}</p>`;
    }
    html += '</div>';
    return html;
}

function bindLayerEvents(layer, status) {
    layer.on('mouseover', function() { this.setStyle(makeStyle(status, true)); this.bringToFront(); });
    layer.on('mouseout', function() { this.setStyle(makeStyle(status, false)); });
}

function cleanMessage(msg) {
    if (!msg) return '';
    return msg.replace(/❗️Радар по всей России.*?\n?/g, '').replace(/🌐 Обход белых списков.*?\n?/g, '')
        .replace(/@radarrussiia\n?/g, '').replace(/@Internet_Boost_bot.*?\n?/g, '')
        .replace(/https?:\/\/t\.me\/Internet_Boost_bot\S*/g, '').replace(/🔴 Радар ДНР.*?\n?/g, '')
        .replace(/📢 Оповещения Радар ДНР:\s*/g, '').trim();
}

function updateMainMap(regions) {
    if (mainLayer) map.removeLayer(mainLayer);
    mainLayer = L.geoJSON(geojsonData, {
        style: feature => {
            const shapeName = feature.properties.shapeName;
            const apiName = SHAPE_TO_API[shapeName];
            const status = apiName && regions[apiName] ? regions[apiName].status : null;
            return makeStyle(status, false);
        },
        onEachFeature: (feature, layer) => {
            const shapeName = feature.properties.shapeName;
            const apiName = SHAPE_TO_API[shapeName];
            const regionData = apiName ? regions[apiName] : null;
            const status = regionData ? regionData.status : null;
            const displayName = apiName || shapeName;
            layer.bindPopup(makePopup(displayName, regionData));
            bindLayerEvents(layer, status);
        }
    }).addTo(map);
}

async function loadNewRegions(regions) {
    if (newRegionsLayer) map.removeLayer(newRegionsLayer);
    try {
        const response = await fetch(NEW_REGIONS_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        newRegionsLayer = L.geoJSON(data, {
            style: feature => {
                const shapeName = feature.properties.shapeName;
                const apiName = NEW_REGIONS_NAMES[shapeName];
                const status = apiName && regions[apiName] ? regions[apiName].status : null;
                return makeStyle(status, false);
            },
            onEachFeature: (feature, layer) => {
                const shapeName = feature.properties.shapeName;
                const apiName = NEW_REGIONS_NAMES[shapeName] || shapeName;
                const regionData = regions[apiName] || null;
                const status = regionData ? regionData.status : null;
                layer.bindPopup(makePopup(apiName, regionData));
                bindLayerEvents(layer, status);
            }
        }).addTo(map);
        console.log('✅ Новые регионы загружены');
    } catch (err) {
        console.warn('❌ Не удалось загрузить новые регионы:', err);
    }
}

async function loadStatuses() {
    showLoading(t('loading_map'), t('loading_borders'));
    try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error(t('error_server'));
        const data = await response.json();
        currentRegionsData = data.regions || {};
        lastUpdateTime = data.last_updated;
        updateMainMap(currentRegionsData);
        updateTime(lastUpdateTime);
        updateStats(currentRegionsData);
        await loadNewRegions(currentRegionsData);
    } catch (err) {
        showError(`${t('error_loading')}: ${err.message}`);
        console.error(err);
    } finally {
        hideLoading();
    }
}

async function initMap() {
    showLoading(t('loading_map'), t('loading_borders'));
    try {
        const response = await fetch(GEOJSON_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        geojsonData = await response.json();
        console.log('✅ GeoJSON загружен');
        await loadStatuses();
        setInterval(loadStatuses, 30000);
    } catch (err) {
        console.error('❌ Ошибка загрузки карты:', err);
        showError(t('error_map'));
        hideLoading();
    }
}

function updateTime(isoString) {
    if (!isoString) return;
    const date = new Date(isoString);
    document.getElementById('updateTime').innerHTML = `🕐 ${t('updated')}: ${date.toLocaleTimeString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}<br>📅 ${date.toLocaleDateString(currentLang === 'ru' ? 'ru-RU' : 'en-US')}`;
}

function showError(msg) {
    const toast = document.getElementById('errorToast');
    toast.textContent = '⚠️ ' + msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 5000);
}

updateUI();
initMap();

setTimeout(() => {
    const resetBtn = L.control({ position: 'bottomright' });
    resetBtn.onAdd = function() {
        const div = L.DomUtil.create('div');
        div.innerHTML = t('reset_view');
        div.style.cssText = `background:rgba(0,0,0,0.8);color:white;padding:8px 15px;border-radius:20px;cursor:pointer;font-size:13px;backdrop-filter:blur(10px);margin-right:10px;margin-bottom:10px;font-family:'Segoe UI',sans-serif;`;
        div.onclick = () => map.setView([55.75, 37.62], 5);
        return div;
    };
    resetBtn.addTo(map);

    const infoBtn = L.control({ position: 'topright' });
    infoBtn.onAdd = function() {
        const div = L.DomUtil.create('div');
        div.innerHTML = 'ℹ️';
        div.style.cssText = `background:rgba(0,0,0,0.8);color:white;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);margin-top:60px;margin-right:10px;`;
        div.onclick = () => alert(t('info_text'));
        return div;
    };
    infoBtn.addTo(map);
}, 1000);
</script>
