        let currentServerIndex = 0;

        async function fetchWithMultiFallback() {
            const startIndex = currentServerIndex;
            for (let i = 0; i < API_SERVERS.length; i++) {
                const idx = (startIndex + i) % API_SERVERS.length;
                const srv = API_SERVERS[idx];
                try {
                    const ctrl = new AbortController();
                    const t = setTimeout(() => ctrl.abort(), 10000);
                    const r = await fetch(srv.url, { signal: ctrl.signal });
                    clearTimeout(t);
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    const d = await r.json();
                    if (currentServerIndex !== idx && idx !== 0) {
                        currentServerIndex = idx;
                        console.log(`✅ ${srv.name}`);
                    } else if (idx === 0 && currentServerIndex !== 0) {
                        currentServerIndex = 0;
                        console.log(`✅ Основной`);
                    }
                    return d;
                } catch (e) {
                    console.warn(`❌ ${srv.name}:`, e.message);
                }
            }
            throw new Error("Все сервера недоступны");
        }

            "Novosibirsk Oblast": { api: "Новосибирская область", ru: "Новосибирская область", en: "Novosibirsk Oblast" },
            "Omsk Oblast": { api: "Омская область", ru: "Омская область", en: "Omsk Oblast" },
            "Orenburg Oblast": { api: "Оренбургская область", ru: "Оренбургская область", en: "Orenburg Oblast" },
            "Oryol Oblast": { api: "Орловская область", ru: "Орловская область", en: "Oryol Oblast" },
            "Penza Oblast": { api: "Пензенская область", ru: "Пензенская область", en: "Penza Oblast" },
            "Perm Krai": { api: "Пермский край", ru: "Пермский край", en: "Perm Krai" },
            "Primorsky Krai": { api: "Приморский край", ru: "Приморский край", en: "Primorsky Krai" },
            "Pskov Oblast": { api: "Псковская область", ru: "Псковская область", en: "Pskov Oblast" },
            "Republic of Karelia": { api: "Республика Карелия", ru: "Карелия", en: "Karelia" },
            "Republic of Mordovia": { api: "Республика Мордовия", ru: "Мордовия", en: "Mordovia" },
            "Rostov Oblast": { api: "Ростовская область", ru: "Ростовская область", en: "Rostov Oblast" },
            "Ryazan Oblast": { api: "Рязанская область", ru: "Рязанская область", en: "Ryazan Oblast" },
            "Saint Petersburg": { api: "Ленинградская область", ru: "Санкт-Петербург", en: "Saint Petersburg" },
            "Sakha Republic": { api: "Республика Саха (Якутия)", ru: "Якутия", en: "Sakha" },
            "Sakhalin Oblast": { api: "Сахалинская область", ru: "Сахалинская область", en: "Sakhalin Oblast" },
            "Samara Oblast": { api: "Самарская область", ru: "Самарская область", en: "Samara Oblast" },
            "Saratov Oblast": { api: "Саратовская область", ru: "Саратовская область", en: "Saratov Oblast" },
            "Smolensk Oblast": { api: "Смоленская область", ru: "Смоленская область", en: "Smolensk Oblast" },
            "Stavropol Krai": { api: "Ставропольский край", ru: "Ставропольский край", en: "Stavropol Krai" },
            "Sverdlovsk Oblast": { api: "Свердловская область", ru: "Свердловская область", en: "Sverdlovsk Oblast" },
            "Tambov Oblast": { api: "Тамбовская область", ru: "Тамбовская область", en: "Tambov Oblast" },
            "Tatarstan": { api: "Республика Татарстан", ru: "Татарстан", en: "Tatarstan" },
            "Tomsk Oblast": { api: "Томская область", ru: "Томская область", en: "Tomsk Oblast" },
            "Tula Oblast": { api: "Тульская область", ru: "Тульская область", en: "Tula Oblast" },
            "Tuva": { api: "Республика Тыва", ru: "Тыва", en: "Tuva" },
            "Tver Oblast": { api: "Тверская область", ru: "Тверская область", en: "Tver Oblast" },
            "Tyumen Oblast": { api: "Тюменская область", ru: "Тюменская область", en: "Tyumen Oblast" },
            "Udmurtia": { api: "Республика Удмуртия", ru: "Удмуртия", en: "Udmurtia" },
            "Ulyanovsk Oblast": { api: "Ульяновская область", ru: "Ульяновская область", en: "Ulyanovsk Oblast" },
            "Vladimir Oblast": { api: "Владимирская область", ru: "Владимирская область", en: "Vladimir Oblast" },
            "Volgograd Oblast": { api: "Волгоградская область", ru: "Волгоградская область", en: "Volgograd Oblast" },
            "Vologda Oblast": { api: "Вологодская область", ru: "Вологодская область", en: "Vologda Oblast" },
            "Voronezh Oblast": { api: "Воронежская область", ru: "Воронежская область", en: "Voronezh Oblast" },
            "Yamalo-Nenets Autonomous Okrug": { api: "ЯНАО", ru: "ЯНАО", en: "Yamalo-Nenets AO" },
            "Yaroslavl Oblast": { api: "Ярославская область", ru: "Ярославская область", en: "Yaroslavl Oblast" },
            "Zabaykalsky Krai": { api: "Забайкальский край", ru: "Забайкальский край", en: "Zabaykalsky Krai" },
            "Adygea": { api: "Республика Адыгея", ru: "Адыгея", en: "Adygea" }
        };

        const NMAP = {
            "Donetsk Oblast": { api: "Донецкая Народная Республика", ru: "ДНР", en: "Donetsk PR" },
            "Luhansk Oblast": { api: "Луганская Народная Республика", ru: "ЛНР", en: "Luhansk PR" },
            "Zaporizhia Oblast": { api: "Запорожская область", ru: "Запорожская область", en: "Zaporizhia" },
            "Kherson Oblast": { api: "Херсонская область", ru: "Херсонская область", en: "Kherson" },
            "Autonomous Republic of Crimea": { api: "Республика Крым", ru: "Крым", en: "Crimea" },
            "Sevastopol": { api: "Республика Крым", ru: "Севастополь", en: "Sevastopol" }
        };

        function gDisp(n, nr) {
            const m = nr ? NMAP : RMAP;
            const e = m[n];
            if (!e) return n;
            return lang === 'ru' ? e.ru : e.en;
        }

        function gApi(n, nr) {
            const m = nr ? NMAP : RMAP;
            return m[n] ? m[n].api : null;
        }

        function trMsg(m) {
            if (!m || lang === 'ru') return m;
            return m.replace(/Ракетная тревога/gi, 'Missile alert')
                .replace(/Ракетная опасность/gi, 'Missile danger')
                .replace(/Атака БПЛА/gi, 'Drone attack')
                .replace(/Опасность БПЛА/gi, 'Drone danger')
                .replace(/Отбой/gi, 'All clear')
                .replace(/Нет данных/gi, 'No data');
        }

        // Цвета из оригинала
        const COLS = {
            missile_alert: { fill: "rgba(45,0,0,0.7)", border: "#ff0000", icon: "🚀", lru: "РАКЕТНАЯ ТРЕВОГА", len: "MISSILE ALERT" },
            missile_danger: { fill: "rgba(139,0,0,0.6)", border: "#ff4444", icon: "⚠️", lru: "РАКЕТНАЯ ОПАСНОСТЬ", len: "MISSILE DANGER" },
            drone_attack: { fill: "rgba(255,0,0,0.5)", border: "#ff6666", icon: "✈️", lru: "АТАКА БПЛА", len: "DRONE ATTACK" },
            drone_danger: { fill: "rgba(255,215,0,0.5)", border: "#ffdd44", icon: "⚠️", lru: "ОПАСНОСТЬ БПЛА", len: "DRONE DANGER" }
        };

        function gLab(s) { return COLS[s] ? (lang === 'ru' ? COLS[s].lru : COLS[s].len) : s; }

        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([55.75, 37.62], 5);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OSM',
            maxZoom: 19
        }).addTo(map);

        let mLay, nLay, geoData, currentData = {}, lastUpd = null;

        function showLoad(txt, sub) {
            document.querySelector('.loading-text').textContent = txt || t('loading_map');
            if (sub) document.querySelector('.loading-sub').textContent = sub;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoad() { document.getElementById('loadingOverlay').style.display = 'none'; }

        function updStats(regs) {
            let d = 0, a = 0;
            for (const r in regs) {
                const s = regs[r].status;
                if (s === 'drone_attack') a++;
                if (s && s !== 'clear') d++;
            }
            const el = document.getElementById('stats');
            if (a > 0) {
                el.innerHTML = `⚠️ ${t('stats_danger')}: <span class="val">${d}</span><span class="sep">|</span>✈️ ${t('stats_attacks')}: <span class="att">${a}</span>`;
            } else {
                el.innerHTML = `⚠️ ${t('stats_danger')}: <span class="val">${d}</span>`;
            }
        }

        function mkSty(s, hov) {
            if (!s || s === 'clear') {
                return { fillColor: "transparent", weight: hov ? 1.5 : 1, color: hov ? "#777" : "#444", fillOpacity: 0, opacity: hov ? 0.7 : 0.3, dashArray: '5,5' };
            }
            if (COLS[s]) {
                return {
                    fillColor: COLS[s].fill,
                    weight: hov ? 3 : (s === 'drone_attack' ? 2.5 : 1.5),
                    color: COLS[s].border,
                    fillOpacity: hov ? 0.85 : 0.7,
                    opacity: hov ? 1 : 0.9,
                    dashArray: null
                };
            }
            return { fillColor: "rgba(51,51,51,0.2)", weight: 1, color: "#333", fillOpacity: 0.2, opacity: 0.4, dashArray: '3,3' };
        }

        function bindEv(l, s) {
            l.on('mouseover', function() { this.setStyle(mkSty(s, true)); this.bringToFront(); });
            l.on('mouseout', function() { this.setStyle(mkSty(s, false)); });
        }

        function clMsg(m) {
            if (!m) return '';
            return m.replace(/❗️Радар.*?\n?/g, '').replace(/🌐 Обход.*?\n?/g, '')
                .replace(/@radarrussiia\n?/g, '').replace(/@Internet_Boost_bot.*?\n?/g, '')
                .replace(/https?:\/\/t\.me\/\S*/g, '').replace(/🔴 Радар ДНР.*?\n?/g, '')
                .replace(/📢 Оповещения.*?\s*/g, '').trim();
        }

        function mkPop(dn, rd) {
            const s = rd && rd.status;
            let h = `<div class="region-popup"><h4>${dn}</h4>`;
            if (rd && s === 'clear') {
                h += `<span class="status-badge" style="background:#2d5a2d;">✅ ${t('alert_clear')}</span><br><br>📊 ${t('alert_count')}: <span class="alert-count">${rd.alerts_last_hour||0}</span>`;
            } else if (rd && COLS[s]) {
                const msg = trMsg(clMsg(rd.message || ''));
                h += `<span class="status-badge" style="background:${COLS[s].border}">${COLS[s].icon} ${gLab(s)}</span><br><br>📊 ${t('alert_count')}: <span class="alert-count">${rd.alerts_last_hour||0}</span>`;
                if (msg) h += `<br><br><small style="color:#999;">📝 ${msg.substring(0,150)}${msg.length>150?'...':''}</small>`;
            } else {
                h += `<span style="color:#666;">📡 ${t('alert_no_data')}</span>`;
            }
            h += '</div>';
            return h;
        }

        function updMap(regs) {
            if (mLay) map.removeLayer(mLay);
            if (!geoData) return;
            mLay = L.geoJSON(geoData, {
                style: f => {
                    const nm = f.properties.shapeName;
                    const an = gApi(nm, false);
                    const st = an && regs[an] ? regs[an].status : null;
                    return mkSty(st, false);
                },
                onEachFeature: (f, l) => {
                    const nm = f.properties.shapeName;
                    const an = gApi(nm, false);
                    const rd = an ? regs[an] : null;
                    const dn = gDisp(nm, false);
                    l.bindPopup(mkPop(dn, rd), { maxWidth: 250 });
                    bindEv(l, rd ? rd.status : null);
                }
            }).addTo(map);
        }

        async function loadNew(regs) {
            if (nLay) map.removeLayer(nLay);
            try {
                const r = await fetch(NEW_URL);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const d = await r.json();
                nLay = L.geoJSON(d, {
                    style: f => {
                        const nm = f.properties.shapeName;
                        const an = gApi(nm, true);
                        const st = an && regs[an] ? regs[an].status : null;
                        return mkSty(st, false);
                    },
                    onEachFeature: (f, l) => {
                        const nm = f.properties.shapeName;
                        const an = gApi(nm, true) || nm;
                        const rd = regs[an] || null;
                        const dn = gDisp(nm, true);
                        l.bindPopup(mkPop(dn, rd), { maxWidth: 250 });
                        bindEv(l, rd ? rd.status : null);
                    }
                }).addTo(map);
            } catch (e) { console.warn('Новые регионы:', e); }
        }

        async function loadStat() {
            try {
                const d = await fetchWithMultiFallback();
                currentData = d.regions || {};
                lastUpd = d.last_updated;
                updMap(currentData);
                updTime(lastUpd);
                updStats(currentData);
                await loadNew(currentData);
            } catch (e) {
                showErr(`${t('error_loading')}: ${e.message}`);
                console.error(e);
            } finally { hideLoad(); }
        }

        async function init() {
            showLoad(t('loading_map'), t('loading_borders'));
            try {
                const r = await fetch(GEO_URL);
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                geoData = await r.json();
                await loadStat();
                setInterval(loadStat, 30000);
            } catch (e) {
                console.error(e);
                showErr(t('error_map'));
                hideLoad();
            }
        }

        function updTime(iso) {
            if (!iso) return;
            const d = new Date(iso);
            document.getElementById('updateTime').innerHTML = `🕐 ${t('updated')}: ${d.toLocaleTimeString(lang==='ru'?'ru-RU':'en-US')}`;
        }

        function showErr(m, dur = 4000) {
            const t = document.getElementById('errorToast');
            t.textContent = '⚠️ ' + m;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', dur);
        }

        initBanner();
        updUI();
        init();

        setTimeout(() => {
            const ResetC = L.Control.extend({
                options: { position: 'bottomright' },
                onAdd: function() {
                    const d = L.DomUtil.create('div');
                    d.innerHTML = '🗺️';
                    d.title = t('reset_view');
                    d.style.cssText = `
                        background: linear-gradient(135deg, rgba(20,20,40,0.55), rgba(10,10,25,0.7));
                        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
                        color: #fff; width: 32px; height: 32px; border-radius: 8px;
                        cursor: pointer; font-size: 16px; display: flex; align-items: center;
                        justify-content: center; border: 1px solid rgba(255,255,255,0.12);
                        margin-bottom: 6px; transition: all 0.2s;
                    `;
                    d.onmouseover = () => { d.style.background = 'linear-gradient(135deg, rgba(40,40,70,0.7), rgba(20,20,45,0.8))'; };
                    d.onmouseout = () => { d.style.background = 'linear-gradient(135deg, rgba(20,20,40,0.55), rgba(10,10,25,0.7))'; };
                    d.onclick = () => map.setView([55.75, 37.62], 5);
                    return d;
                }
            });
            new ResetC().addTo(map);

            const InfoC = L.Control.extend({
                options: { position: 'topright' },
                onAdd: function() {
                    const d = L.DomUtil.create('div');
                    d.innerHTML = 'ℹ️';
                    d.title = t('info_title');
                    d.style.cssText = `
                        background: linear-gradient(135deg, rgba(20,20,40,0.55), rgba(10,10,25,0.7));
                        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
                        color: #fff; width: 32px; height: 32px; border-radius: 8px;
                        cursor: pointer; font-size: 16px; display: flex; align-items: center;
                        justify-content: center; border: 1px solid rgba(255,255,255,0.12);
                        margin-top: 50px; margin-right: 8px; transition: all 0.2s;
                    `;
                    d.onmouseover = () => { d.style.background = 'linear-gradient(135deg, rgba(40,40,70,0.7), rgba(20,20,45,0.8))'; };
                    d.onmouseout = () => { d.style.background = 'linear-gradient(135deg, rgba(20,20,40,0.55), rgba(10,10,25,0.7))'; };
                    d.onclick = () => alert(t('info_text'));
                    return d;
                }
            });
            new InfoC().addTo(map);
        }, 1000);
    </script>
