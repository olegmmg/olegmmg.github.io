<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта воздушных тревог России</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; }
#map { height: 100vh; width: 100vw; }

.legend {
    position: fixed; left: 20px; bottom: 20px;
    background: rgba(0,0,0,0.85); color: white;
    padding: 15px 20px; border-radius: 10px;
    z-index: 1000; font-size: 13px; line-height: 1.8;
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(10px);
    max-width: 250px;
}
.legend h3 { margin-bottom: 8px; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 5px; }
.legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.legend-color { width: 20px; height: 20px; border-radius: 3px; flex-shrink: 0; }

.update-time {
    position: fixed; right: 20px; top: 20px;
    background: rgba(0,0,0,0.8); color: #ccc;
    padding: 8px 15px; border-radius: 20px;
    z-index: 1000; font-size: 11px;
    backdrop-filter: blur(10px);
}

.status-badge {
    display: inline-block; padding: 4px 10px; border-radius: 5px;
    color: white; font-weight: bold; margin-top: 5px; font-size: 13px;
}
.alert-count { font-weight: bold; font-size: 16px; color: #ff4444; }
.region-popup { font-size: 13px; line-height: 1.6; min-width: 240px; }
.region-popup h4 { margin-bottom: 8px; font-size: 16px; margin-top: 0; }

.error-toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #ff4444; color: white; padding: 10px 20px;
    border-radius: 8px; z-index: 2000; display: none;
}

.stats {
    position: fixed; left: 20px; top: 20px;
    background: rgba(0,0,0,0.8); color: #ccc;
    padding: 8px 15px; border-radius: 20px;
    z-index: 1000; font-size: 12px;
    backdrop-filter: blur(10px);
}

/* Индикатор загрузки */
.loading-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 20px 30px;
    border-radius: 15px;
    z-index: 2000;
    font-size: 16px;
    text-align: center;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    pointer-events: none;
}
.loading-spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #ff4444;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin {
    to { transform: rotate(360deg); }
}
.loading-text {
    font-size: 14px;
    color: #ccc;
}
.loading-sub {
    font-size: 11px;
    color: #888;
}

@keyframes pulse {
    0% { opacity: 0.5; }
    50% { opacity: 0.85; }
    100% { opacity: 0.5; }
}
</style>
</head>
<body>
<div id="map"></div>

<!-- Индикатор загрузки -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Загрузка карты...</div>
    <div class="loading-sub">Загрузка границ регионов</div>
</div>

<div class="legend">
    <h3>🚨 Обозначения</h3>
    <div class="legend-item"><div class="legend-color" style="background:rgba(45,0,0,0.7); border: 1px solid #ff0000;"></div> 🚀 Ракетная тревога</div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(139,0,0,0.6); border: 1px solid #ff4444;"></div> ⚠️ Ракетная опасность</div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(255,0,0,0.5); border: 1px solid #ff6666;"></div> ✈️ Атака БПЛА</div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(255,215,0,0.5); border: 1px solid #ffdd44;"></div> 🛸 Опасность БПЛА</div>
    <div class="legend-item"><div class="legend-color" style="background:transparent; border: 1px dashed #444;"></div> ✅ Отбой</div>
    <div class="legend-item"><div class="legend-color" style="background:rgba(51,51,51,0.2); border: 1px solid #333;"></div> 📡 Нет данных</div>
</div>

<div class="update-time" id="updateTime">Загрузка...</div>
<div class="stats" id="stats">⚠️ Регионов с тревогой: 0</div>
<div class="error-toast" id="errorToast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_URL = 'https://radar-e1lb.onrender.com/api/statuses';
const GEOJSON_URL = "/Radar/geoBoundaries-RUS-ADM1_simplified.geojson";

    "Забайкальский край": "Zabaykalsky Krai",
    "Донецкая Народная Республика": "Донецкая область",
    "Луганская Народная Республика": "Луганская область",
    "Запорожская область": "Запорожская область",
    "Херсонская область": "Херсонская область"
    "Республика Крым": "Республика Крым",
    "Севастополь": "Севастополь",
    
    // Дальневосточный ФО
    "Амурская область": "Amur Oblast",
    "Республика Саха (Якутия)": "Sakha Republic",
    "Еврейская АО": "Jewish Autonomous Oblast",
    "Приморский край": "Primorsky Krai",
    "Хабаровский край": "Khabarovsk Krai",
    "Сахалинская область": "Sakhalin Oblast",
    "Магаданская область": "Magadan Oblast",
    "Камчатский край": "Kamchatka Krai",
    "Чукотский АО": "Chukotka Autonomous Okrug"
};

const COLORS = {
    missile_alert: { fill: "rgba(45,0,0,0.7)", border: "#ff0000", icon: "🚀", label: "РАКЕТНАЯ ТРЕВОГА" },
    missile_danger: { fill: "rgba(139,0,0,0.6)", border: "#ff4444", icon: "⚠️", label: "РАКЕТНАЯ ОПАСНОСТЬ" },
    drone_attack: { fill: "rgba(255,0,0,0.5)", border: "#ff6666", icon: "✈️", label: "АТАКА БПЛА" },
    drone_danger: { fill: "rgba(255,215,0,0.5)", border: "#ffdd44", icon: "🛸", label: "ОПАСНОСТЬ БПЛА" }
};

const map = L.map('map').setView([55.75, 37.62], 5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM',
    maxZoom: 19
}).addTo(map);

let mainLayer;
let newRegionsLayer;
let geojsonData;
let currentRegionsData = {};

// Управление индикатором загрузки
function showLoading(text, subtext) {
    const overlay = document.getElementById('loadingOverlay');
    document.querySelector('.loading-text').textContent = text || 'Загрузка...';
    if (subtext) document.querySelector('.loading-sub').textContent = subtext;
    overlay.style.display = 'flex';
}

function hideLoading() {
    const overlay = document.getElementById('loadingOverlay');
    overlay.style.display = 'none';
}

function updateStats(regions) {
    let dangerCount = 0;
    let attackCount = 0;
    for (const r in regions) {
        const status = regions[r].status;
        if (status === 'drone_attack') attackCount++;
        if (status && status !== 'clear') dangerCount++;
    }
    document.getElementById('stats').innerHTML = `⚠️ Регионов с тревогой: ${dangerCount}${attackCount > 0 ? ` | ✈️ Атак: ${attackCount}` : ''}`;
}

async function loadNewRegions(regionsData) {
    if (newRegionsLayer) map.removeLayer(newRegionsLayer);
    
    try {
        const response = await fetch(NEW_REGIONS_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        console.log('✅ Новые регионы загружены');
        
        newRegionsLayer = L.geoJSON(data, {
            style: feature => {
                const shapeName = feature.properties?.shapeName || '';
                const apiName = NEW_REGIONS_NAMES[shapeName] || shapeName;
                const statusData = regionsData[apiName];
                const status = statusData?.status;
                
                if (!status || status === 'clear') {
                    return {
                        fillColor: "transparent",
                        weight: 1,
                        color: "#444444",
                        fillOpacity: 0,
                        opacity: 0.4
                    };
                }
                
                if (COLORS[status]) {
                    const isAttack = status === 'drone_attack';
                    return {
                        fillColor: COLORS[status].fill,
                        weight: isAttack ? 2.5 : 1.5,
                        color: COLORS[status].border,
                        fillOpacity: isAttack ? 0.8 : 0.7,
                        opacity: 0.9
                    };
                }
                
                return {
                    fillColor: "transparent",
                    weight: 1,
                    color: "#444",
                    fillOpacity: 0,
                    opacity: 0.4
                };
            },
            onEachFeature: (feature, layer) => {
                const shapeName = feature.properties?.shapeName || 'Территория';
                const apiName = NEW_REGIONS_NAMES[shapeName] || shapeName;
                const regionData = regionsData[apiName];
                const status = regionData?.status;
                
                let popupHTML = `<div class="region-popup"><h4>${apiName}</h4>`;
                
                if (regionData && status === 'clear') {
                    popupHTML += `<span class="status-badge" style="background:#2d5a2d;">✅ ОТБОЙ</span><br><br><strong>📊 Оповещений:</strong> <span class="alert-count">${regionData.alerts_last_hour || 0}</span>`;
                } else if (regionData && COLORS[status]) {
                    const cleanMsg = cleanMessage(regionData.message || '');
                    popupHTML += `<span class="status-badge" style="background:${COLORS[status].border}">${COLORS[status].icon} ${COLORS[status].label}</span><br><br><strong>📊 Оповещений:</strong> <span class="alert-count">${regionData.alerts_last_hour || 0}</span>${cleanMsg ? '<br><br><small>📝 ' + cleanMsg.substring(0, 150) + (cleanMsg.length > 150 ? '...' : '') + '</small>' : ''}`;
                } else {
                    popupHTML += `<p style="color:#888;">📡 НЕТ ДАННЫХ</p>`;
                }
                
                popupHTML += '</div>';
                layer.bindPopup(popupHTML);
                
                layer.on('mouseover', function() {
                    const s = status;
                    if (s && COLORS[s]) {
                        this.setStyle({ weight: 3, opacity: 1, fillOpacity: 0.85 });
                    } else {
                        this.setStyle({ weight: 1.5, opacity: 0.6, color: "#666" });
                    }
                    this.bringToFront();
                });
                
                layer.on('mouseout', function() {
                    const s = status;
                    if (s && COLORS[s]) {
                        const isAttack = s === 'drone_attack';
                        this.setStyle({ weight: isAttack ? 2.5 : 1.5, opacity: 0.9, fillOpacity: isAttack ? 0.8 : 0.7 });
                    } else {
                        this.setStyle({ weight: 1, opacity: 0.4, color: "#444" });
                    }
                });
            }
        }).addTo(map);
    } catch (err) {
        console.warn('❌ Не удалось загрузить новые регионы:', err);
    }
}

async function loadStatuses() {
    showLoading('Обновление данных...', 'Получение информации о тревогах');
    
    try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Сервер недоступен');
        const data = await response.json();
        
        currentRegionsData = data.regions || {};
        updateMainMap(data);
        updateTime(data.last_updated);
        updateStats(currentRegionsData);
        await loadNewRegions(currentRegionsData);
    } catch (err) {
        showError('Ошибка: ' + err.message);
        console.error(err);
    } finally {
        hideLoading();
    }
}

async function initMap() {
    showLoading('Загрузка карты...', 'Загрузка границ регионов');
    
    try {
        const response = await fetch(GEOJSON_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        geojsonData = await response.json();
        console.log('✅ GeoJSON загружен');
        
        await loadStatuses();
        setInterval(loadStatuses, 30000);
    } catch (err) {
        console.error('❌ Ошибка загрузки карты:', err);
        showError('Не удалось загрузить карту');
        hideLoading();
    }
}

function cleanMessage(msg) {
    if (!msg) return '';
    return msg
        .replace(/❗️Радар по всей России.*?\n?/g, '')
        .replace(/🌐 Обход белых списков.*?\n?/g, '')
        .replace(/@radarrussiia\n?/g, '')
        .replace(/@Internet_Boost_bot.*?\n?/g, '')
        .replace(/https?:\/\/t\.me\/Internet_Boost_bot\S*/g, '')
        .replace(/🔴 Радар ДНР.*?\n?/g, '')
        .replace(/📢 Оповещения Радар ДНР:\s*/g, '')
        .trim();
}

function updateMainMap(data) {
    if (mainLayer) map.removeLayer(mainLayer);
    
    const regions = data.regions || {};
    
    mainLayer = L.geoJSON(geojsonData, {
        style: feature => {
            const geojsonName = feature.properties.region;
            let apiName = null;
            for (const key in GEOJSON_ALIASES) {
                if (GEOJSON_ALIASES[key] === geojsonName) {
                    apiName = key;
                    break;
                }
            }
            const statusData = regions[apiName];
            const status = statusData?.status;
            
            if (!status || status === 'clear') {
                return {
                    fillColor: "transparent",
                    weight: 0.5,
                    color: "#444444",
                    fillOpacity: 0,
                    opacity: 0.3
                };
            }
            
            if (COLORS[status]) {
                const isAttack = status === 'drone_attack';
                return {
                    fillColor: COLORS[status].fill,
                    weight: isAttack ? 2.5 : 1.5,
                    color: COLORS[status].border,
                    fillOpacity: isAttack ? 0.8 : 0.7,
                    opacity: 0.9
                };
            }
            
            return {
                fillColor: "transparent",
                weight: 0.5,
                color: "#444",
                fillOpacity: 0,
                opacity: 0.3
            };
        },
        onEachFeature: (feature, layer) => {
            const geojsonName = feature.properties.region;
            let matchedApiName = null;
            for (const key in GEOJSON_ALIASES) {
                if (GEOJSON_ALIASES[key] === geojsonName) {
                    matchedApiName = key;
                    break;
                }
            }
            const regionData = regions[matchedApiName];
            const status = regionData?.status;
            
            let popupHTML = `<div class="region-popup"><h4>${matchedApiName || geojsonName}</h4>`;
            
            if (regionData && status === 'clear') {
                popupHTML += `<span class="status-badge" style="background:#2d5a2d;">✅ ОТБОЙ</span><br><br><strong>📊 Оповещений:</strong> <span class="alert-count">${regionData.alerts_last_hour || 0}</span>`;
            } else if (regionData && COLORS[status]) {
                const cleanMsg = cleanMessage(regionData.message || '');
                popupHTML += `<span class="status-badge" style="background:${COLORS[status].border}">${COLORS[status].icon} ${COLORS[status].label}</span><br><br><strong>📊 Оповещений:</strong> <span class="alert-count">${regionData.alerts_last_hour || 0}</span>${cleanMsg ? '<br><br><small>📝 ' + cleanMsg.substring(0, 150) + (cleanMsg.length > 150 ? '...' : '') + '</small>' : ''}`;
            } else {
                popupHTML += `<p style="color:#888;">📡 НЕТ ДАННЫХ</p>`;
            }
            
            popupHTML += '</div>';
            layer.bindPopup(popupHTML);
            
            layer.on('mouseover', function() {
                const s = status;
                if (s && COLORS[s]) {
                    this.setStyle({ weight: 3, opacity: 1, fillOpacity: 0.85 });
                } else if (s === 'clear' || !s) {
                    this.setStyle({ weight: 1, opacity: 0.6, color: "#666" });
                }
                this.bringToFront();
            });
            
            layer.on('mouseout', function() {
                const s = status;
                if (s && COLORS[s]) {
                    const isAttack = s === 'drone_attack';
                    this.setStyle({ weight: isAttack ? 2.5 : 1.5, opacity: 0.9, fillOpacity: isAttack ? 0.8 : 0.7 });
                } else {
                    this.setStyle({ weight: 0.5, opacity: 0.3, color: "#444" });
                }
            });
        }
    }).addTo(map);
}

function updateTime(isoString) {
    if (!isoString) return;
    const date = new Date(isoString);
    document.getElementById('updateTime').innerHTML = '🕐 Обновлено: ' + date.toLocaleTimeString('ru-RU') + '<br>📅 ' + date.toLocaleDateString('ru-RU');
}

function showError(msg) {
    const toast = document.getElementById('errorToast');
    toast.textContent = '⚠️ ' + msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', 5000);
}

function hideError() {
    document.getElementById('errorToast').style.display = 'none';
}
