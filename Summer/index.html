<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ждём лето! — olegmmg.art</title>
<style>
:root{
  --bg1:#ffd9a8; --bg2:#ffb05c; --bg3:#ff8a2b;
  --ink:#3b1d08; --title:#b3140f; --track:rgba(120,50,0,.18); --fill:#8a3b05;
  --link:#7a2e00; --bar-bg:rgba(255,244,228,.92); --bar-ink:#3b1d08; --bar-line:rgba(120,50,0,.25);
  --autumn:#c2410c; --winter:#4f6bd8; --spring:#e9b800; --done:#6b2a00;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#4a2406; --bg2:#7a3a0c; --bg3:#a44d10;
    --ink:#ffe8cf; --title:#ff6a4d; --track:rgba(255,220,180,.18); --fill:#ffc27a;
    --link:#ffd199; --bar-bg:rgba(40,18,4,.92); --bar-ink:#ffe8cf; --bar-line:rgba(255,200,140,.3);
    --autumn:#ea7a2c; --winter:#7e95f0; --spring:#f2c91a; --done:#ffc27a;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; color:var(--ink);
  font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg1);
  background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar-bg);backdrop-filter:blur(8px)}
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:11;
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:var(--bar-bg); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--bar-line);
}
.back{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  font:inherit; font-weight:700; color:var(--bar-ink);
  background:transparent; border:1.5px solid var(--bar-line); border-radius:999px;
  padding:7px 14px 7px 10px; -webkit-tap-highlight-color:transparent;
}
.back:active{background:var(--track)}
.back svg{width:18px;height:18px}
.domain{margin-left:auto; font-weight:700; color:var(--link); text-decoration:none; letter-spacing:.2px}
.wrap{max-width:560px; margin:0 auto; padding:14px 14px 40px}
h1{margin:6px 0 4px; text-align:center; color:var(--title); font-size:clamp(34px,10vw,48px); line-height:1.1}
.more{display:inline-block; margin:6px 0 10px; color:var(--link); font-weight:600}
.lead{text-align:center; margin:4px 0 10px}
.row{display:grid; grid-template-columns:78px 1fr; gap:8px; align-items:center; margin:5px 0; font-variant-numeric:tabular-nums}
.row .v{white-space:nowrap; font-size:15px}
.row .lbl{font-size:15px}
.meter{display:grid; grid-template-columns:96px 1fr; gap:8px; align-items:center; margin:5px 0}
.meter .num{font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap}
.bar{height:14px; background:var(--track); border-radius:3px; overflow:hidden}
.bar>i{display:block; height:100%; width:0; background:var(--fill)}
.dates{display:grid; grid-template-columns:1fr 1fr 1fr; text-align:center; gap:4px; margin:18px 0 12px; font-size:14px; font-variant-numeric:tabular-nums}
.dates b{display:block; font-weight:400; opacity:.85}
.prog{height:14px; background:var(--track); border-radius:3px; overflow:hidden; display:flex}
.prog>i{display:block; height:100%; background:var(--done); width:0}
.pct{text-align:center; margin:8px 0 22px; font-size:15px; font-variant-numeric:tabular-nums; word-break:break-all}
.seasons{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.s .sb{height:14px; background:var(--track); border-radius:3px; overflow:hidden; margin-bottom:6px}
.s .sb>i{display:block; height:100%; width:0}
.s p{margin:0; text-align:center; font-size:13px; font-variant-numeric:tabular-nums; word-break:break-all}
@media(max-width:380px){.row{grid-template-columns:64px 1fr}.meter{grid-template-columns:86px 1fr}.row .v,.meter .num{font-size:13px}}
</style>
</head>
<body>
<header class="top">
  <button class="back" id="back" type="button" aria-label="Назад на уровень выше">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    Назад
  </button>
  <a class="domain" href="https://olegmmg.art" id="dom">olegmmg.art</a>
</header>

<main class="wrap">
  <h1 id="title">Ждём лето!</h1>
  <a class="more" href="#" id="more">Другие интересности</a>
  <p class="lead" id="lead">До лета осталось…</p>

  <div id="meters"></div>

  <div class="dates">
    <div><span id="d0"></span><b id="t0"></b></div>
    <div>сейчас:<br><span id="dn"></span><b id="tn"></b></div>
    <div><span id="d1"></span><b id="t1"></b></div>
  </div>

  <div class="prog"><i id="pbar"></i></div>
  <div class="pct" id="pct"></div>

  <div class="seasons" id="seasons"></div>
</main>

<script>
(function(){
  // Кнопка «Назад»: на уровень выше по адресу
  function parentUrl(){
    var u = new URL(location.href);
    var p = u.pathname;
    if (p === "/" || p === "") return null;
    var parts = p.split("/").filter(Boolean);
    if (!/\/$/.test(p)) parts.pop();        // убрали файл (summer.html)
    else parts.pop();                        // убрали последнюю папку
    return u.origin + "/" + (parts.length ? parts.join("/") + "/" : "");
  }
  document.getElementById("back").addEventListener("click", function(){
    var up = parentUrl();
    if (up && up !== location.href) location.href = up;
    else if (history.length > 1) history.back();
    else location.href = "https://olegmmg.art";
  });
  var up = parentUrl();
  document.getElementById("more").href = up || "https://olegmmg.art";

  var pad = function(n,l){ return String(n).padStart(l||2,"0"); };
  var fmtD = function(d){ return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear(); };
  var fmtT = function(d){ return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+"."+pad(d.getMilliseconds(),3); };

  var units = [
    ["месяцев"],
    ["дней"],
    ["часов"],
    ["минут"],
    ["секунд"]
  ];
  var box = document.getElementById("meters");
  units.forEach(function(u,i){
    var r = document.createElement("div"); r.className = "meter";
    r.innerHTML = '<span class="lbl">'+u[0]+':</span>'+'<span></span>';
    // подпись+число слева, шкала справа
    r.innerHTML = '<span class="num"><span class="lbl">'+u[0]+': </span></span><div class="bar"><i></i></div>';
    r.style.gridTemplateColumns = "minmax(0,auto) 1fr";
    box.appendChild(r);
  });
  // Двухколоночная раскладка: подпись | число+шкала
  box.innerHTML = "";
  var rows = units.map(function(u){
    var r = document.createElement("div");
    r.className = "row";
    r.innerHTML = '<span class="lbl">'+u[0]+':</span><div style="display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center"><span class="v"></span><div class="bar"><i></i></div></div>';
    r.style.gridTemplateColumns = "76px 1fr";
    box.appendChild(r);
    return { v: r.querySelector(".v"), i: r.querySelector("i") };
  });

  var seasonsBox = document.getElementById("seasons");
  var seasonDefs = [
    { name:"осени", gen:"осень", m:8,  color:"var(--autumn)" },
    { name:"зимы",  gen:"зима",  m:11, color:"var(--winter)" },
    { name:"весны", gen:"весна", m:2,  color:"var(--spring)" }
  ];
  var sEls = seasonDefs.map(function(s){
    var d = document.createElement("div"); d.className = "s";
    d.innerHTML = '<div class="sb"><i style="background:'+s.color+'"></i></div><p></p>';
    seasonsBox.appendChild(d);
    return { bar:d.querySelector("i"), p:d.querySelector("p") };
  });

  function period(now){
    var y = now.getFullYear(), m = now.getMonth();
    if (m >= 8) return { start:new Date(y,8,1),   end:new Date(y+1,5,1), summer:false, y:y };
    if (m <= 4) return { start:new Date(y-1,8,1), end:new Date(y,5,1),   summer:false, y:y-1 };
    return { start:new Date(y,5,1), end:new Date(y,8,1), summer:true, y:y };
  }

  var el = {
    d0:document.getElementById("d0"), t0:document.getElementById("t0"),
    d1:document.getElementById("d1"), t1:document.getElementById("t1"),
    dn:document.getElementById("dn"), tn:document.getElementById("tn"),
    pbar:document.getElementById("pbar"), pct:document.getElementById("pct"),
    lead:document.getElementById("lead"), title:document.getElementById("title")
  };
  var lastSummer = null;

  function tick(){
    var now = new Date();
    var p = period(now);
    var total = p.end - p.start;
    var left = Math.max(0, p.end - now);
    var done = Math.min(1, Math.max(0, (now - p.start) / total));

    if (p.summer !== lastSummer){
      lastSummer = p.summer;
      el.title.textContent = p.summer ? "Ура, лето!" : "Ждём лето!";
      el.lead.textContent  = p.summer ? "До конца лета осталось…" : "До лета осталось…";
      seasonsBox.style.display = p.summer ? "none" : "";
    }

    // Календарная разбивка: каждая единица — остаток, не уместившийся в старшую
    var Y = now.getFullYear(), M = now.getMonth();
    function addM(n){
      var t = new Date(Y, M+n, 1);
      var dim0 = new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
      return new Date(t.getFullYear(), t.getMonth(), Math.min(now.getDate(), dim0), now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
    }
    var mo = (p.end.getFullYear()-Y)*12 + p.end.getMonth() - M;
    if (mo < 0) mo = 0;
    var anchor = addM(mo);
    while (mo > 0 && anchor > p.end){ mo--; anchor = addM(mo); }
    var rem = Math.max(0, p.end - anchor);
    var dd = Math.floor(rem/864e5); rem -= dd*864e5;
    var hh = Math.floor(rem/36e5);  rem -= hh*36e5;
    var mi = Math.floor(rem/6e4);   rem -= mi*6e4;
    var ss = rem/1000;
    var dim = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0).getDate();
    var tm = (p.end.getFullYear()-p.start.getFullYear())*12 + p.end.getMonth() - p.start.getMonth();
    var vals = [[String(mo), mo/tm], [String(dd), dd/dim], [String(hh), hh/24], [String(mi), mi/60], [ss.toFixed(3), ss/60]];
    vals.forEach(function(x,i){
      rows[i].v.textContent = x[0];
      rows[i].i.style.width = (x[1]*100) + "%";
    });

    el.d0.textContent = fmtD(p.start); el.t0.textContent = "00:00:00.000";
    el.d1.textContent = fmtD(p.end);   el.t1.textContent = "00:00:00.000";
    el.dn.textContent = fmtD(now);     el.tn.textContent = fmtT(now);

    el.pbar.style.width = (done*100) + "%";
    el.pct.textContent = (done*100).toFixed(14) + "% " + (p.summer ? "лета завершено!" : "нелетнего периода завершено!");

    if (!p.summer){
      seasonDefs.forEach(function(s,i){
        var y = p.y + (s.m < 8 ? 1 : 0);
        var a = new Date(y, s.m, 1);
        var b = new Date(y + (s.m === 11 ? 1 : 0), (s.m + 3) % 12, 1);
        var f = (now - a) / (b - a);
        var e = sEls[i];
        if (f <= 0){
          e.bar.style.width = "0%";
          e.p.textContent = s.gen + " ещё не началась";
        } else {
          f = Math.min(1, f);
          e.bar.style.width = (f*100) + "%";
          e.p.textContent = (f*100).toFixed(14) + "% " + s.name + " завершено" + (f >= 1 ? "!" : "");
        }
      });
    }
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
