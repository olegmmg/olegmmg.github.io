<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кастомные прошивки | Выбор по модели</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #1e293b;
            transition: background 0.2s, color 0.2s;
            line-height: 1.5;
        }

        /* тёмная тема (включена по умолчанию) */
        body.dark {
            background: #0b1120;
            color: #e2e8f0;
        }

        body.dark .card,
        body.dark .selector-panel,
        body.dark .rom-table {
            background: #1e293b;
            border-color: #334155;
        }

        body.dark .brand-btn,
        body.dark .model-btn {
            background: #1e293b;
            border-color: #334155;
            color: #cbd5e1;
        }

        body.dark .brand-btn.active,
        body.dark .model-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        body.dark .search-box,
        body.dark .version-badge {
            background: #2d3b52;
            border-color: #40536d;
            color: #e2e8f0;
        }

        body.dark .rom-row {
            border-bottom-color: #334155;
        }

        body.dark .rom-name {
            color: #a5c9ff;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* шапка */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .title-section h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }

        .title-section p {
            color: #64748b;
            font-size: 1rem;
        }

        body.dark .title-section p {
            color: #94a3b8;
        }

        .theme-toggle {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
        }

        body.dark .theme-toggle {
            background: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }

        /* панели выбора */
        .selection-area {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .selector-panel {
            background: white;
            border-radius: 28px;
            padding: 1.5rem 1.8rem;
            border: 1px solid #f0f2f5;
            box-shadow: 0 12px 24px -8px rgba(0, 34, 68, 0.08);
        }

        .panel-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #2563eb;
            margin-bottom: 1.2rem;
        }

        .panel-label i {
            font-size: 1.2rem;
        }

        .brand-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .brand-btn {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 0.7rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .brand-btn i {
            font-size: 1rem;
            opacity: 0.8;
        }

        .brand-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
            box-shadow: 0 8px 14px -6px rgba(37, 99, 235, 0.4);
        }

        .model-selector {
            margin-top: 0.5rem;
        }

        .model-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-top: 1rem;
        }

        .model-btn {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            padding: 0.6rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .model-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }

        .model-btn i {
            font-size: 0.9rem;
        }

        .placeholder-text {
            color: #94a3b8;
            font-style: italic;
            padding: 0.8rem 0;
        }

        /* таблица/список ROM */
        .roms-container {
            background: white;
            border-radius: 28px;
            padding: 1.8rem;
            border: 1px solid #f0f2f5;
            box-shadow: 0 16px 28px -8px rgba(0, 34, 68, 0.12);
            margin-top: 0.5rem;
        }

        .roms-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .roms-header h2 {
            font-size: 1.6rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .roms-header h2 i {
            color: #2563eb;
            font-size: 1.8rem;
        }

        .device-chip {
            background: #dbeafe;
            border-radius: 40px;
            padding: 0.4rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #1d4ed8;
        }

        body.dark .device-chip {
            background: #1e3a8a;
            color: #bfdbfe;
        }

        .rom-table {
            width: 100%;
            border-collapse: collapse;
        }

        .rom-table th {
            text-align: left;
            padding: 0.8rem 0.5rem;
            color: #64748b;
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e2e8f0;
        }

        body.dark .rom-table th {
            color: #94a3b8;
            border-bottom-color: #334155;
        }

        .rom-row {
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.1s;
        }

        body.dark .rom-row {
            border-bottom-color: #2d3b52;
        }

        .rom-row:hover {
            background: #fafcff;
        }

        body.dark .rom-row:hover {
            background: #253341;
        }

        .rom-row td {
            padding: 1rem 0.5rem;
            vertical-align: middle;
        }

        .rom-name {
            font-weight: 700;
            color: #2563eb;
            font-size: 1.05rem;
        }

        .android-version {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #475569;
        }

        body.dark .android-version {
            color: #9ca3af;
        }

        .version-badge {
            background: #e6edff;
            border-radius: 30px;
            padding: 0.25rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #2563eb;
            display: inline-block;
        }

        .download-btn {
            background: none;
            border: 1px solid #2563eb;
            color: #2563eb;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            text-decoration: none;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #2563eb;
            color: white;
        }

        body.dark .download-btn {
            border-color: #3b82f6;
            color: #90b4fa;
        }
        body.dark .download-btn:hover {
            background: #2563eb;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: #94a3b8;
        }

        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 2rem;
        }

        body.dark .footer {
            border-top-color: #1e293b;
        }

        /* поиск */
        .search-wrapper {
            position: relative;
            min-width: 260px;
        }

        .search-box {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            font-size: 0.95rem;
            background: white;
            color: #1e293b;
            outline: none;
        }

        .search-box:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
    </style>
</head>
<body class="dark"> <!-- тёмная тема по умолчанию -->
    <div class="container">
        <!-- шапка -->
        <div class="header">
            <div class="title-section">
                <h1><i class="fas fa-microchip"></i> Кастомные сборники</h1>
                <p>Выберите бренд и модель — получите список прошивок</p>
            </div>
            <div class="theme-toggle" id="themeToggle">
                <i class="fas fa-sun"></i>
                <span>Светлая тема</span>
            </div>
        </div>

        <!-- Панель выбора бренда и модели -->
        <div class="selection-area">
            <!-- Бренды -->
            <div class="selector-panel">
                <div class="panel-label"><i class="fas fa-building"></i> ШАГ 1: БРЕНД</div>
                <div class="brand-grid" id="brandContainer">
                    <button class="brand-btn" data-brand="all"><i class="fas fa-layer-group"></i> Все бренды</button>
                    <button class="brand-btn" data-brand="samsung"><i class="fab fa-samsung"></i> Samsung</button>
                    <button class="brand-btn" data-brand="xiaomi"><i class="fas fa-mobile-alt"></i> Xiaomi</button>
                    <button class="brand-btn" data-brand="google"><i class="fab fa-google"></i> Google Pixel</button>
                    <button class="brand-btn" data-brand="oneplus"><i class="fas fa-mobile-alt"></i> OnePlus</button>
                    <button class="brand-btn" data-brand="other"><i class="fas fa-tablet-alt"></i> Другие</button>
                </div>
            </div>

            <!-- Модели (динамически) -->
            <div class="selector-panel model-selector">
                <div class="panel-label"><i class="fas fa-list-ul"></i> ШАГ 2: МОДЕЛЬ</div>
                <div id="modelContainer" class="model-list">
                    <!-- будут вставлены кнопки моделей через js -->
                    <span class="placeholder-text">Сначала выберите бренд</span>
                </div>
            </div>
        </div>

        <!-- Поиск по ROM (фильтр по названию прошивки) -->
        <div style="display: flex; justify-content: flex-end; margin-bottom: 1rem;">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-box" id="romSearch" placeholder="Фильтр по названию ROM...">
            </div>
        </div>

        <!-- Список ROM для выбранной модели -->
        <div class="roms-container">
            <div class="roms-header">
                <h2><i class="fas fa-code-branch"></i> Доступные прошивки</h2>
                <div class="device-chip" id="selectedDeviceDisplay">устройство не выбрано</div>
            </div>

            <!-- таблица ROM -->
            <table class="rom-table" id="romTable">
                <thead>
                    <tr>
                        <th>ROM</th>
                        <th>Версия Android</th>
                        <th>Статус</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="romListBody">
                    <!-- будут заполнены данными -->
                </tbody>
            </table>
            <div id="emptyRomMessage" class="empty-state" style="display: none;">
                <i class="fas fa-compact-disc fa-2x" style="margin-bottom: 1rem; opacity: 0.6;"></i>
                <p>Нет прошивок для отображения. Выберите модель.</p>
            </div>
        </div>

        <div class="footer">
            <i class="fas fa-robot"></i> База кастомных прошивок • обновлено 12.02.2025
        </div>
    </div>

    <script>
        (function() {
            // ----- Данные: бренд -> модели -> список ROM -----
            const romData = {
                samsung: {
                    name: 'Samsung',
                    models: {
                        'galaxy-s21': { name: 'Galaxy S21', roms: [
                            { name: 'LineageOS 21', android: '14', status: 'STABLE' },
                            { name: 'PixelOS 14', android: '14', status: 'BETA' },
                            { name: 'crDroid 10', android: '14', status: 'STABLE' }
                        ]},
                        'galaxy-note20': { name: 'Galaxy Note20', roms: [
                            { name: 'PixelOS 14', android: '14', status: 'STABLE' },
                            { name: 'LineageOS 20', android: '13', status: 'STABLE' },
                            { name: 'HavocOS 5.6', android: '13', status: 'OFFICIAL' }
                        ]},
                        'galaxy-a52': { name: 'Galaxy A52', roms: [
                            { name: 'crDroid 9', android: '13', status: 'STABLE' },
                            { name: 'ArrowOS 13', android: '13', status: 'UNOFFICIAL' }
                        ]}
                    }
                },
                xiaomi: {
                    name: 'Xiaomi',
                    models: {
                        'mi-13-pro': { name: 'Xiaomi 13 Pro', roms: [
                            { name: 'crDroid 10.2', android: '14', status: 'STABLE' },
                            { name: 'EliteRom', android: '14', status: 'BETA' },
                            { name: 'xiaomi.eu', android: '14', status: 'STABLE' }
                        ]},
                        'redmi-note-12': { name: 'Redmi Note 12', roms: [
                            { name: 'LineageOS 20', android: '13', status: 'STABLE' },
                            { name: 'PixelExperience', android: '13', status: 'OFFICIAL' }
                        ]},
                        'poco-f5': { name: 'Poco F5', roms: [
                            { name: 'Evolution X', android: '14', status: 'STABLE' },
                            { name: 'Paranoid Android', android: '14', status: 'BETA' }
                        ]}
                    }
                },
                google: {
                    name: 'Google Pixel',
                    models: {
                        'pixel-7': { name: 'Pixel 7', roms: [
                            { name: 'Evolution X 9.0', android: '14', status: 'STABLE' },
                            { name: 'GrapheneOS', android: '14', status: 'STABLE' },
                            { name: 'CalyxOS', android: '14', status: 'BETA' }
                        ]},
                        'pixel-6a': { name: 'Pixel 6a', roms: [
                            { name: 'GrapheneOS', android: '14', status: 'STABLE' },
                            { name: 'LineageOS 21', android: '14', status: 'STABLE' }
                        ]}
                    }
                },
                oneplus: {
                    name: 'OnePlus',
                    models: {
                        'oneplus-9-pro': { name: 'OnePlus 9 Pro', roms: [
                            { name: 'YAAP 14', android: '14', status: 'STABLE' },
                            { name: 'crDroid 9', android: '13', status: 'OFFICIAL' }
                        ]},
                        'oneplus-8t': { name: 'OnePlus 8T', roms: [
                            { name: 'LineageOS 21', android: '14', status: 'STABLE' },
                            { name: 'PixelOS', android: '13', status: 'UNOFFICIAL' }
                        ]}
                    }
                },
                other: {
                    name: 'Другие',
                    models: {
                        'lenovo-tab-p11': { name: 'Lenovo Tab P11', roms: [
                            { name: 'LineageOS 20', android: '13', status: 'UNOFFICIAL' }
                        ]},
                        'surface-rt': { name: 'Surface RT', roms: [
                            { name: 'RTDroid', android: '4.4', status: 'LEGACY' }
                        ]}
                    }
                }
            };

            // Состояние
            let selectedBrand = 'all';            // 'all' или ключ бренда
            let selectedModelKey = '';             // например 'galaxy-s21'
            let romSearchQuery = '';

            // DOM элементы
            const brandBtns = document.querySelectorAll('.brand-btn');
            const modelContainer = document.getElementById('modelContainer');
            const romListBody = document.getElementById('romListBody');
            const selectedDeviceSpan = document.getElementById('selectedDeviceDisplay');
            const emptyMsg = document.getElementById('emptyRomMessage');
            const romSearchInput = document.getElementById('romSearch');
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;

            // --- переключение темы ---
            themeToggle.addEventListener('click', () => {
                body.classList.toggle('dark');
                const icon = themeToggle.querySelector('i');
                const span = themeToggle.querySelector('span');
                if (body.classList.contains('dark')) {
                    icon.className = 'fas fa-sun';
                    span.innerText = 'Светлая тема';
                } else {
                    icon.className = 'fas fa-moon';
                    span.innerText = 'Тёмная тема';
                }
            });

            // --- Обновить список моделей на основе выбранного бренда ---
            function renderModels() {
                modelContainer.innerHTML = '';
                if (selectedBrand === 'all') {
                    // Для "все бренды" показываем все модели всех брендов (сгруппированные?)
                    // Но по заданию: "сначала выбрать бренд, потом марку" — для all можно показать модели всех брендов.
                    let allModels = [];
                    for (let brandKey in romData) {
                        const brand = romData[brandKey];
                        for (let modelKey in brand.models) {
                            allModels.push({
                                key: modelKey,
                                name: brand.models[modelKey].name,
                                brand: brandKey
                            });
                        }
                    }
                    // сортировка по имени
                    allModels.sort((a, b) => a.name.localeCompare(b.name));
                    if (allModels.length === 0) {
                        modelContainer.innerHTML = '<span class="placeholder-text">Нет моделей</span>';
                    } else {
                        allModels.forEach(m => {
                            const btn = document.createElement('button');
                            btn.className = `model-btn ${selectedModelKey === m.key ? 'active' : ''}`;
                            btn.dataset.model = m.key;
                            btn.dataset.brand = m.brand;
                            btn.innerHTML = `<i class="fas fa-mobile"></i> ${m.name}`;
                            btn.addEventListener('click', () => {
                                // при выборе модели запоминаем и её бренд тоже (для согласованности)
                                document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
                                btn.classList.add('active');
                                selectedModelKey = m.key;
                                // синхронизируем бренд, но не сбрасываем фильтр главный? (оставим как есть, но лучше установить активный бренд соответственно)
                                // также подсветим соответствующий бренд
                                setActiveBrand(m.brand);
                                renderRoms();
                            });
                            modelContainer.appendChild(btn);
                        });
                    }
                } else {
                    // выбран конкретный бренд
                    const brandData = romData[selectedBrand];
                    if (!brandData || Object.keys(brandData.models).length === 0) {
                        modelContainer.innerHTML = '<span class="placeholder-text">Нет моделей для этого бренда</span>';
                    } else {
                        for (let [modelKey, model] of Object.entries(brandData.models)) {
                            const btn = document.createElement('button');
                            btn.className = `model-btn ${selectedModelKey === modelKey ? 'active' : ''}`;
                            btn.dataset.model = modelKey;
                            btn.innerHTML = `<i class="fas fa-mobile"></i> ${model.name}`;
                            btn.addEventListener('click', () => {
                                document.querySelectorAll('.model-btn').forEach(b => b.classList.remove('active'));
                                btn.classList.add('active');
                                selectedModelKey = modelKey;
                                renderRoms();
                            });
                            modelContainer.appendChild(btn);
                        }
                    }
                }
                // Если после смены бренда выбранная модель не принадлежит ему — сбросить
                if (selectedBrand !== 'all' && selectedModelKey) {
                    const brandData = romData[selectedBrand];
                    if (!brandData || !brandData.models[selectedModelKey]) {
                        selectedModelKey = '';
                    }
                }
                if (selectedBrand === 'all' && selectedModelKey) {
                    // проверим, существует ли эта модель хоть где-то
                    let exists = false;
                    for (let b in romData) {
                        if (romData[b].models[selectedModelKey]) { exists = true; break; }
                    }
                    if (!exists) selectedModelKey = '';
                }
                // отрендерить ромы (возможно, сброшенные)
                renderRoms();
            }

            // --- Установить активный бренд в кнопках и обновить модели ---
            function setActiveBrand(brandKey) {
                selectedBrand = brandKey;
                brandBtns.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.dataset.brand === brandKey) btn.classList.add('active');
                });
                renderModels();
            }

            // --- Обработчики брендов ---
            brandBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const brand = btn.dataset.brand; // 'all', 'samsung', ...
                    setActiveBrand(brand);
                });
            });

            // --- Отрендерить список ROM в таблице на основе выбранной модели + поиск ---
            function renderRoms() {
                let roms = [];
                let deviceName = '';

                if (selectedModelKey) {
                    // Ищем модель по всем брендам (или конкретному)
                    if (selectedBrand !== 'all') {
                        const model = romData[selectedBrand]?.models[selectedModelKey];
                        if (model) {
                            roms = model.roms || [];
                            deviceName = model.name;
                        }
                    } else {
                        // all brands - ищем везде
                        for (let brandKey in romData) {
                            const model = romData[brandKey].models[selectedModelKey];
                            if (model) {
                                roms = model.roms || [];
                                deviceName = model.name;
                                break;
                            }
                        }
                    }
                }

                // фильтр по поиску (romSearchQuery)
                if (romSearchQuery.trim() !== '') {
                    const query = romSearchQuery.toLowerCase().trim();
                    roms = roms.filter(r => r.name.toLowerCase().includes(query));
                }

                // Обновить заголовок
                selectedDeviceSpan.innerText = deviceName || 'устройство не выбрано';

                // Очистить таблицу
                romListBody.innerHTML = '';

                if (roms.length === 0) {
                    emptyMsg.style.display = 'block';
                } else {
                    emptyMsg.style.display = 'none';
                    roms.forEach(rom => {
                        const row = document.createElement('tr');
                        row.className = 'rom-row';
                        row.innerHTML = `
                            <td><span class="rom-name">${rom.name}</span></td>
                            <td><span class="android-version"><i class="fab fa-android"></i> ${rom.android}</span></td>
                            <td><span class="version-badge">${rom.status}</span></td>
                            <td><a href="#" class="download-btn"><i class="fas fa-download"></i> Скачать</a></td>
                        `;
                        romListBody.appendChild(row);
                    });

                    // добавить обработчики на кнопки скачать (предотвращение перехода)
                    document.querySelectorAll('.download-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.preventDefault();
                            alert('📥 Демо-скачивание. Ссылка на прошивку.');
                        });
                    });
                }
            }

            // --- Поиск по ROM ---
            romSearchInput.addEventListener('input', (e) => {
                romSearchQuery = e.target.value;
                renderRoms();
            });

            // --- Инициализация: выбрать первый бренд (samsung) для наглядности? Но можно оставить 'all'
            setActiveBrand('samsung');  // для демо выбран самсунг, чтобы сразу видеть модели
            // дополнительно выберем первую модель самсунга
            setTimeout(() => {
                // симулируем клик на первую модель samsung (galaxy-s21)
                const firstModelBtn = document.querySelector('[data-model="galaxy-s21"]');
                if (firstModelBtn) {
                    firstModelBtn.click();
                } else {
                    // если нет, то просто обновить
                    renderRoms();
                }
            }, 50);

            // перехват кликов на скачивание
        })();
    </script>
</body>
</html>
