<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кастомные прошивки | Модели устройств</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #1e293b;
            transition: background 0.2s, color 0.2s;
            line-height: 1.5;
        }

        /* тёмная тема */
        body.dark {
            background: #0b1120;
            color: #e2e8f0;
        }

        body.dark .brand-btn,
        body.dark .model-card {
            background: #1e293b;
            border-color: #334155;
        }

        body.dark .brand-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }

        body.dark .model-card {
            box-shadow: 0 8px 16px -6px rgba(0, 0, 0, 0.4);
        }

        body.dark .model-card:hover {
            border-color: #3b82f6;
        }

        body.dark .codename {
            color: #9ca3af;
        }

        body.dark .search-box {
            background: #1e293b;
            border-color: #334155;
            color: #e2e8f0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* шапка */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .title-section h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
        }

        .title-section p {
            color: #64748b;
            font-size: 1rem;
        }

        body.dark .title-section p {
            color: #94a3b8;
        }

        .theme-toggle {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 0.5rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.15s;
        }

        body.dark .theme-toggle {
            background: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }

        /* панель марок */
        .brands-panel {
            margin-bottom: 2rem;
        }

        .brands-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 1rem;
        }

        .brands-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .brand-btn {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 40px;
            padding: 0.7rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .brand-btn i {
            font-size: 1.1rem;
        }

        .brand-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
            box-shadow: 0 8px 16px -6px rgba(37, 99, 235, 0.4);
        }

        /* поиск */
        .search-section {
            margin-bottom: 2rem;
            display: flex;
            justify-content: flex-end;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .search-box {
            width: 100%;
            padding: 0.9rem 1.2rem 0.9rem 3rem;
            border: 1px solid #e2e8f0;
            border-radius: 50px;
            font-size: 1rem;
            background: white;
            color: #1e293b;
            outline: none;
            transition: 0.2s;
        }

        .search-box:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* статистика */
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            color: #475569;
        }

        body.dark .stats {
            color: #9ca3af;
        }

        .reset-btn {
            background: none;
            border: 1px dashed #cbd5e1;
            border-radius: 30px;
            padding: 0.4rem 1.2rem;
            font-size: 0.9rem;
            color: #64748b;
            cursor: pointer;
            transition: 0.1s;
        }

        .reset-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        /* сетка карточек моделей - 5 в ряд */
        .models-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        @media (max-width: 1200px) {
            .models-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 900px) {
            .models-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .models-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .model-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem 1rem;
            border: 2px solid #f0f2f5;
            box-shadow: 0 8px 16px -6px rgba(0, 34, 68, 0.08);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            aspect-ratio: 1 / 0.9;
        }

        .model-card:hover {
            transform: translateY(-6px);
            border-color: #2563eb;
            box-shadow: 0 20px 30px -10px rgba(37, 99, 235, 0.2);
        }

        .card-icon {
            font-size: 2.2rem;
            color: #2563eb;
            margin-bottom: 1rem;
        }

        .model-name {
            font-weight: 700;
            font-size: 1.25rem;
            line-height: 1.3;
            margin-bottom: 0.4rem;
        }

        .codename {
            font-size: 0.9rem;
            color: #64748b;
            font-family: 'SF Mono', 'Fira Code', monospace;
            background: #f1f5f9;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 0.6rem;
        }

        body.dark .codename {
            background: #2d3b52;
            color: #b9c7e0;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: #94a3b8;
            font-size: 1.2rem;
        }

        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            padding-top: 2rem;
        }

        body.dark .footer {
            border-top-color: #1e293b;
        }
    </style>
</head>
<body class="dark"> <!-- тёмная тема по умолчанию -->
    <div class="container">
        <!-- шапка -->
        <div class="header">
            <div class="title-section">
                <h1><i class="fas fa-microchip"></i> Кастомные сборники</h1>
                <p>Выберите марку — затем модель, чтобы увидеть прошивки</p>
            </div>
            <div class="theme-toggle" id="themeToggle">
                <i class="fas fa-sun"></i>
                <span>Светлая тема</span>
            </div>
        </div>

        <!-- Меню выбора марки (бренда) -->
        <div class="brands-panel">
            <div class="brands-title"><i class="fas fa-tag"></i> МАРКА УСТРОЙСТВА</div>
            <div class="brands-grid" id="brandContainer">
                <button class="brand-btn active" data-brand="all"><i class="fas fa-layer-group"></i> Все</button>
                <button class="brand-btn" data-brand="samsung"><i class="fab fa-samsung"></i> Samsung</button>
                <button class="brand-btn" data-brand="xiaomi"><i class="fas fa-mobile-alt"></i> Xiaomi</button>
                <button class="brand-btn" data-brand="google"><i class="fab fa-google"></i> Google</button>
                <button class="brand-btn" data-brand="oneplus"><i class="fas fa-mobile-alt"></i> OnePlus</button>
                <button class="brand-btn" data-brand="other"><i class="fas fa-tablet-alt"></i> Другие</button>
            </div>
        </div>

        <!-- Поиск по модели -->
        <div class="search-section">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-box" id="modelSearch" placeholder="Поиск по названию или кодовому имени...">
            </div>
        </div>

        <!-- Статистика и сброс -->
        <div class="stats">
            <span id="resultCount">Найдено моделей: <strong>18</strong></span>
            <button class="reset-btn" id="resetFilters"><i class="fas fa-undo-alt"></i> Сбросить</button>
        </div>

        <!-- Сетка карточек моделей (5 в ряд) -->
        <div class="models-grid" id="modelsGrid">
            <!-- карточки будут сгенерированы через JS -->
        </div>

        <div class="footer">
            <i class="fas fa-robot"></i> База кастомных прошивок • выберите модель для просмотра ROM
        </div>
    </div>

    <script>
        (function() {
            // ----- ДАННЫЕ: марка -> массив моделей (название, кодовое имя) -----
            const devicesData = {
                samsung: [
                    { name: 'Galaxy S21', codename: 'o1c' },
                    { name: 'Galaxy S21+', codename: 't2s' },
                    { name: 'Galaxy S21 Ultra', codename: 'p3s' },
                    { name: 'Galaxy Note20', codename: 'c1s' },
                    { name: 'Galaxy Note20 Ultra', codename: 'c2s' },
                    { name: 'Galaxy A52', codename: 'a52q' },
                    { name: 'Galaxy A72', codename: 'a72q' },
                    { name: 'Galaxy S20', codename: 'x1s' },
                    { name: 'Galaxy Z Fold3', codename: 'q2s' },
                    { name: 'Galaxy Z Flip3', codename: 'b2s' }
                ],
                xiaomi: [
                    { name: 'Xiaomi 13 Pro', codename: 'nuwa' },
                    { name: 'Xiaomi 13', codename: 'fuxi' },
                    { name: 'Redmi Note 12', codename: 'tapas' },
                    { name: 'Redmi Note 12 Pro', codename: 'ruby' },
                    { name: 'Poco F5', codename: 'marble' },
                    { name: 'Poco X5 Pro', codename: 'redwood' },
                    { name: 'Mi 11', codename: 'venus' },
                    { name: 'Mi 11 Ultra', codename: 'star' }
                ],
                google: [
                    { name: 'Pixel 7 Pro', codename: 'cheetah' },
                    { name: 'Pixel 7', codename: 'panther' },
                    { name: 'Pixel 6a', codename: 'bluejay' },
                    { name: 'Pixel 6', codename: 'oriole' },
                    { name: 'Pixel 5', codename: 'redfin' }
                ],
                oneplus: [
                    { name: 'OnePlus 9 Pro', codename: 'lemonadep' },
                    { name: 'OnePlus 9', codename: 'lemonade' },
                    { name: 'OnePlus 8T', codename: 'kebab' },
                    { name: 'OnePlus 8 Pro', codename: 'instantnoodlep' },
                    { name: 'OnePlus Nord 2', codename: 'denniz' }
                ],
                other: [
                    { name: 'Lenovo Tab P11', codename: 'j606f' },
                    { name: 'Surface Duo', codename: 'zeta' },
                    { name: 'Fairphone 4', codename: 'fp4' },
                    { name: 'Sony Xperia 1 III', codename: 'pdx215' }
                ]
            };

            // Состояние
            let activeBrand = 'all';
            let searchQuery = '';

            // DOM элементы
            const brandBtns = document.querySelectorAll('.brand-btn');
            const modelsGrid = document.getElementById('modelsGrid');
            const searchInput = document.getElementById('modelSearch');
            const resultCountStrong = document.querySelector('#resultCount strong');
            const resetBtn = document.getElementById('resetFilters');
            const themeToggle = document.getElementById('themeToggle');
            const body = document.body;

            // --- Тема ---
            themeToggle.addEventListener('click', () => {
                body.classList.toggle('dark');
                const icon = themeToggle.querySelector('i');
                const span = themeToggle.querySelector('span');
                if (body.classList.contains('dark')) {
                    icon.className = 'fas fa-sun';
                    span.innerText = 'Светлая тема';
                } else {
                    icon.className = 'fas fa-moon';
                    span.innerText = 'Тёмная тема';
                }
            });

            // --- Функция рендера карточек ---
            function renderModels() {
                let allModels = [];

                if (activeBrand === 'all') {
                    // собираем все модели из всех брендов
                    for (let brand in devicesData) {
                        allModels.push(...devicesData[brand].map(m => ({ ...m, brand })));
                    }
                } else {
                    // модели только выбранного бренда
                    allModels = (devicesData[activeBrand] || []).map(m => ({ ...m, brand: activeBrand }));
                }

                // фильтр по поиску (по названию модели и кодовому имени)
                if (searchQuery.trim() !== '') {
                    const query = searchQuery.toLowerCase().trim();
                    allModels = allModels.filter(m => 
                        m.name.toLowerCase().includes(query) || 
                        m.codename.toLowerCase().includes(query)
                    );
                }

                // обновление счетчика
                resultCountStrong.innerText = allModels.length;

                // очистить сетку
                modelsGrid.innerHTML = '';

                if (allModels.length === 0) {
                    modelsGrid.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open fa-3x" style="opacity:0.5; margin-bottom:1rem;"></i><p>Нет моделей по выбранным фильтрам</p></div>';
                    return;
                }

                // создаем карточки
                allModels.forEach(model => {
                    const card = document.createElement('a');
                    card.href = '#';  // в реальности здесь может быть ссылка на прошивки модели
                    card.className = 'model-card';
                    // Добавляем обработчик для демо-перехода (можно заменить на реальную навигацию)
                    card.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert(`📲 Переход к прошивкам для ${model.name} (${model.codename}) — здесь будет список ROM`);
                    });

                    // Иконка в зависимости от бренда (просто для красоты)
                    let iconHtml = '<i class="fas fa-mobile-alt card-icon"></i>';
                    if (model.brand === 'samsung') iconHtml = '<i class="fas fa-mobile-alt card-icon" style="color:#1428A0;"></i>';
                    else if (model.brand === 'google') iconHtml = '<i class="fab fa-google card-icon" style="color:#4285F4;"></i>';
                    else if (model.brand === 'oneplus') iconHtml = '<i class="fas fa-mobile-alt card-icon" style="color:#EB0028;"></i>';
                    
                    card.innerHTML = `
                        ${iconHtml}
                        <div class="model-name">${model.name}</div>
                        <div class="codename"><i class="fas fa-hashtag" style="opacity:0.6;"></i> ${model.codename}</div>
                    `;
                    modelsGrid.appendChild(card);
                });
            }

            // --- Обработчики брендов ---
            brandBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    brandBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activeBrand = btn.dataset.brand;
                    renderModels();
                });
            });

            // --- Поиск ---
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderModels();
            });

            // --- Сброс фильтров ---
            resetBtn.addEventListener('click', () => {
                // сброс бренда на "Все"
                brandBtns.forEach(b => b.classList.remove('active'));
                document.querySelector('[data-brand="all"]').classList.add('active');
                activeBrand = 'all';
                // очистка поиска
                searchInput.value = '';
                searchQuery = '';
                renderModels();
            });

            // --- Инициализация ---
            renderModels();

            // дополнительно: предотвращение перехода по ссылкам
            document.querySelectorAll('.model-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    e.preventDefault();
                });
            });
        })();
    </script>
</body>
</html>
