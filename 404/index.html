<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Страница не найдена | 404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Montserrat', sans-serif;
            background: linear-gradient(145deg, #0b0c10 0%, #0f1117 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eef4ff;
            padding: 1.5rem;
        }

        .container {
            max-width: 820px;
            width: 100%;
            text-align: center;
            background: rgba(18, 22, 35, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 2.5rem 1.8rem 3rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(80, 100, 150, 0.25);
            transition: all 0.2s ease;
        }

        /* Анимация цифр */
        .error-code {
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #c0e0ff, #7c9cff, #5a6eff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            animation: floatGlow 3s ease-in-out infinite;
        }

        @keyframes floatGlow {
            0% {
                transform: translateY(0px);
                filter: drop-shadow(0 0 3px rgba(90, 110, 255, 0.3));
            }
            50% {
                transform: translateY(-8px);
                filter: drop-shadow(0 0 12px rgba(90, 110, 255, 0.5));
            }
            100% {
                transform: translateY(0px);
                filter: drop-shadow(0 0 3px rgba(90, 110, 255, 0.3));
            }
        }

        .glitch-text {
            font-size: clamp(1.6rem, 5vw, 2.5rem);
            font-weight: 600;
            margin: 0.75rem 0 0.5rem;
            background: linear-gradient(120deg, #ffffff, #b9d0ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .description {
            font-size: 1rem;
            max-width: 460px;
            margin: 1.2rem auto 0;
            color: #a7b6d9;
            line-height: 1.5;
            font-weight: 450;
        }

        .illustration {
            margin: 2rem auto 1.5rem;
            opacity: 0.8;
        }

        .astronaut-svg {
            max-width: 180px;
            width: 45%;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.4));
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        .astronaut-svg:hover {
            transform: scale(1.02) rotate(2deg);
        }

        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin: 2rem 0 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 3rem;
            text-decoration: none;
            transition: 0.2s ease;
            cursor: pointer;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(100, 130, 210, 0.4);
            background: rgba(25, 30, 50, 0.6);
            color: #eef3ff;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(105deg, #2b3b8c, #1e2a6e);
            border: none;
            box-shadow: 0 6px 14px rgba(30, 42, 110, 0.4);
            color: white;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: linear-gradient(105deg, #3a4da0, #25347a);
            transform: translateY(-3px);
            box-shadow: 0 12px 22px -8px rgba(30, 42, 110, 0.6);
        }

        .btn-outline:hover {
            background: rgba(100, 130, 210, 0.25);
            border-color: #6c8eff;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .search-container {
            margin-top: 1.2rem;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 3rem;
            background: rgba(12, 15, 28, 0.8);
            border: 1px solid #2f3b66;
            color: #eef4ff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .search-input:focus {
            border-color: #5e7cff;
            background: #0c1022;
            box-shadow: 0 0 0 3px rgba(94, 124, 255, 0.2);
        }

        .search-input::placeholder {
            color: #7c88aa;
            font-weight: 400;
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 5px;
            background: #2b3b8c;
            border: none;
            border-radius: 3rem;
            padding: 0.55rem 1.2rem;
            color: white;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-btn:hover {
            background: #3e53aa;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #6e7da3;
            border-top: 1px dashed rgba(100, 130, 210, 0.3);
            padding-top: 1.5rem;
            letter-spacing: 0.3px;
        }

        @media (max-width: 540px) {
            .container {
                padding: 1.8rem 1.2rem 2rem;
                border-radius: 2rem;
            }
            .btn {
                padding: 0.6rem 1.3rem;
                font-size: 0.9rem;
            }
            .search-input {
                padding: 0.7rem 1rem;
            }
            .search-btn {
                padding: 0.45rem 1rem;
                font-size: 0.8rem;
            }
        }

        /* анимация появления */
        .container > * {
            animation: fadeSlideUp 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
            opacity: 0;
        }

        .error-code { animation-delay: 0.05s; }
        .illustration { animation-delay: 0.1s; }
        .glitch-text { animation-delay: 0.2s; }
        .description { animation-delay: 0.3s; }
        .action-buttons { animation-delay: 0.4s; }
        .search-container { animation-delay: 0.5s; }
        .footer-note { animation-delay: 0.6s; }

        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(18px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="error-code">404</div>

    <div class="illustration">
        <svg class="astronaut-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="44" fill="url(#gradAstro)" stroke="#86a0ff" stroke-width="2.5"/>
            <circle cx="100" cy="92" r="24" fill="#12182e" stroke="#9bb3ff" stroke-width="2"/>
            <circle cx="84" cy="84" r="3" fill="#f0f4ff"/>
            <circle cx="116" cy="84" r="3" fill="#f0f4ff"/>
            <path d="M92 106 Q100 116 108 106" stroke="#bbd0ff" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M70 74 L52 58 M130 74 L148 58" stroke="#97adff" stroke-width="3" stroke-linecap="round"/>
            <path d="M100 136 L100 160 M84 148 L100 160 L116 148" stroke="#7f9aff" stroke-width="2.8" stroke-linecap="round"/>
            <circle cx="100" cy="160" r="6" fill="#2d3d7a" stroke="#a0b6ff" stroke-width="2"/>
            <defs>
                <radialGradient id="gradAstro" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(80 80) scale(60)">
                    <stop stop-color="#2f489e"/>
                    <stop offset="1" stop-color="#141c44"/>
                </radialGradient>
            </defs>
        </svg>
    </div>

    <h1 class="glitch-text">Потерялся в космосе?</h1>
    <p class="description">
        Кажется, страница, которую вы ищете, покинула орбиту или была удалена.
        Но не волнуйтесь — мы поможем вернуться на главную.
    </p>

    <div class="action-buttons">
        <a href="/" class="btn btn-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-right: 4px;">
                <path d="M3 12L5 10M5 10L12 3L19 10M5 10V20C5 20.5523 5.44772 21 6 21H9M19 10L21 12M19 10V20C19 20.5523 18.5523 21 18 21H15M9 21C9.55228 21 10 20.5523 10 20V16C10 15.4477 10.4477 15 11 15H13C13.5523 15 14 15.4477 14 16V20C14 20.5523 14.4477 21 15 21M9 21H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            На главную
        </a>
        <a href="/search" class="btn btn-outline">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="10.5" cy="10.5" r="6.5"/>
                <path d="M21 21L15.5 15.5"/>
            </svg>
            Поиск по сайту
        </a>
    </div>

    <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="Что искали? Название статьи или услуги...">
        <button class="search-btn" id="searchButton">Найти</button>
    </div>

    <div class="footer-note">
        ✦ Ошибка 404 — страница не найдена ✦<br>
        Если вы уверены, что ссылка верна, свяжитесь с поддержкой.
    </div>
</div>

<script>
    // Простая обработка поиска (можно заменить на реальную логику или отправку формы)
    const searchBtn = document.getElementById('searchButton');
    const searchInput = document.getElementById('searchInput');

    function handleSearch() {
        let query = searchInput.value.trim();
        if (query === "") {
            query = "404 помощь";
        }
        // Перенаправление на поисковую систему сайта (если есть)
        // Пример: /search?q=...   измените под свою структуру
        if (window.location.origin) {
            window.location.href = `/search?q=${encodeURIComponent(query)}`;
        } else {
            alert("Поиск: " + query + "\n(Настройте обработчик поиска под ваш сайт)");
        }
    }

    searchBtn.addEventListener('click', handleSearch);
    searchInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleSearch();
        }
    });
</script>
</body>
</html>
