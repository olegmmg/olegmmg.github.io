<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сток прошивки | olegmmg</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="../shared.css">
</head>
<body data-page="stock">
<nav class="nav-bar">
  <a class="nav-logo" href="/">⚡ olegmmg</a>
  <div class="nav-links">
    <a class="nav-link" href="/roms/"><i class="fas fa-microchip"></i> ROM</a>
    <a class="nav-link" href="/recovery/"><i class="fas fa-tools"></i> Recovery</a>
    <a class="nav-link active" href="/stock/"><i class="fas fa-box"></i> Сток</a>
    <a class="nav-link" href="/samsung/"><i class="fab fa-samsung"></i> Samsung</a>
    <a class="nav-link" href="/repo"><i class="fas fa-cube"></i> iOS Repo</a>
  </div>
  <div class="nav-right" style="display:flex;align-items:center;gap:8px"><button onclick="toggleLang()" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 12px;font-size:11px;color:inherit;cursor:pointer;font-family:inherit;" class="lang-toggle">English</button>
    <button class="theme-toggle" id="themeToggle"><i class="fas fa-sun"></i> Светлая</button>
  </div>
</nav>

<div class="page-header">
  <h1><i class="fas fa-box"></i> Сток прошивки</h1>
  <p>Официальные прошивки от производителей</p>
</div>

<div class="container">
  <div class="filter-section">
    <span class="filter-label"><i class="fas fa-tag"></i> МАРКА</span>
    <div class="pills" id="brandPills">
      <button class="pill active" data-brand="all"><i class="fas fa-layer-group"></i> Все</button>
      <button class="pill" data-brand="xiaomi"><i class="fas fa-mobile-alt"></i> Xiaomi</button>
      <button class="pill" data-brand="google"><i class="fab fa-google"></i> Google</button>
      <button class="pill" data-brand="oneplus"><i class="fas fa-mobile-alt"></i> OnePlus</button>
      <button class="pill" data-brand="other"><i class="fas fa-tablet-alt"></i> Другие</button>
    </div>
  </div>
  <div class="search-row">
    <div class="search-wrap">
      <i class="fas fa-search search-icon"></i>
      <input class="search-box" id="searchBox" type="text" placeholder="Поиск устройства...">
    </div>
  </div>
  <div class="stats-row">
    <span>Найдено: <strong id="countEl">...</strong></span>
    <button class="reset-btn" id="resetBtn"><i class="fas fa-undo-alt"></i> Сбросить</button>
  </div>
  <div class="models-grid" id="grid">
    <div class="loading-state"><div class="spinner"></div><p>Загрузка...</p></div>
  </div>
  <div class="page-footer">📦 Сток прошивки · by OlegMMG</div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">—</h2>
      <button class="close-btn" id="closeBtn">&times;</button>
    </div>
    <div class="modal-filters">
      <label><i class="fab fa-android"></i> Android:</label>
      <select class="filter-select" id="filterAndroid"><option value="all">Все версии</option></select>
      <label><i class="fas fa-globe"></i> Регион:</label>
      <select class="filter-select" id="filterRegion"><option value="all">Все</option></select>
    </div>
    <table class="rom-table">
      <thead><tr><th>Прошивка</th><th>Android</th><th>Регион</th><th>Сборка</th><th>Статус</th><th>Источник</th><th></th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyMsg" style="display:none;text-align:center;padding:2rem;color:#64748b">
      <i class="fas fa-box-open fa-2x" style="margin-bottom:.8rem"></i><br>Нет прошивок
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCCzyMi_QRO5kxH_KY6hwpZP5ezASC30lQ",
  authDomain: "project-magnet-0-12-0.firebaseapp.com",
  databaseURL: "https://project-magnet-0-12-0-default-rtdb.firebaseio.com",
  projectId: "project-magnet-0-12-0",
  storageBucket: "project-magnet-0-12-0.firebasestorage.app",
  messagingSenderId: "806168706834",
  appId: "1:806168706834:web:e13093dd8940641508bdcb"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let devicesData = {};
let stockData = {};
let brand = 'all';
let q = '';
let cur = null;
let selA = 'all';
let selR = 'all';
let isLoading = false;

const grid = document.getElementById('grid');
const countEl = document.getElementById('countEl');
const search = document.getElementById('searchBox');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const closeBtn = document.getElementById('closeBtn');
const tableBody = document.getElementById('tableBody');
const emptyMsg = document.getElementById('emptyMsg');
const filterA = document.getElementById('filterAndroid');
const filterR = document.getElementById('filterRegion');

const themeToggle = document.getElementById('themeToggle');
themeToggle.onclick = () => { document.body.classList.toggle('dark'); };

async function loadData() {
  if(isLoading) return;
  isLoading = true;
  
  try {
    // Показываем загрузку
    grid.innerHTML = '<div class="loading-state"><div class="spinner"></div><p>Загрузка устройств...</p></div>';
    
    const [devicesSnap, stockSnap] = await Promise.all([
      get(ref(db, 'flashtool/devices')),
      get(ref(db, 'flashtool/stock'))
    ]);
    
    devicesData = devicesSnap.val() || {};
    stockData = stockSnap.val() || {};
    
    render();
  } catch (e) {
    console.error('Ошибка загрузки:', e);
    grid.innerHTML = `<div class="error-state"><i class="fas fa-exclamation-triangle fa-2x"></i><br>Ошибка: ${e.message}</div>`;
    countEl.textContent = '0';
  } finally {
    isLoading = false;
  }
}

function iconFor(brandName) {
  const icons = {
    samsung: '<i class="fab fa-samsung" style="color:#1428A0"></i>',
    google: '<i class="fab fa-google" style="color:#4285F4"></i>',
    xiaomi: '<i class="fas fa-mobile-alt" style="color:#ff6900"></i>',
    oneplus: '<i class="fas fa-mobile-alt" style="color:#eb0029"></i>'
  };
  return icons[brandName] || '<i class="fas fa-mobile-alt" style="color:#6366f1"></i>';
}

function getAllModels() {
  const models = [];
  for (const [brandName, devices] of Object.entries(devicesData)) {
    if (brand === 'all' || brand === brandName) {
      for (const [codename, deviceInfo] of Object.entries(devices)) {
        // Проверяем, есть ли прошивки для этого устройства
        const hasStock = stockData[codename] && Object.keys(stockData[codename]).length > 0;
        if (hasStock) {
          models.push({
            codename: codename,
            name: deviceInfo.name || codename,
            brand: brandName
          });
        }
      }
    }
  }
  return models;
}

function render() {
  let models = getAllModels();
  
  // Поиск
  if (q) {
    const lowerQ = q.toLowerCase();
    models = models.filter(m => 
      m.name.toLowerCase().includes(lowerQ) || 
      m.codename.toLowerCase().includes(lowerQ)
    );
  }
  
  countEl.textContent = models.length;
  grid.innerHTML = '';
  
  if (!models.length) {
    grid.innerHTML = '<div class="empty-state"><i class="fas fa-folder-open fa-3x"></i><br>Нет устройств с прошивками</div>';
    return;
  }
  
  models.forEach(model => {
    const items = stockData[model.codename] || {};
    const itemsArray = Object.values(items);
    const hasLatest = itemsArray.some(s => s.status === 'LATEST');
    
    const card = document.createElement('div');
    card.className = 'model-card';
    card.innerHTML = `
      <div class="card-icon">${iconFor(model.brand)}</div>
      <div class="model-name">${escapeHtml(model.name)}</div>
      <div class="codename">${escapeHtml(model.codename)}</div>
      <div class="card-badges">
        <span class="badge badge-${hasLatest ? 'LATEST' : 'STABLE'}" style="font-size:.7rem;margin-top:.4rem">${itemsArray.length} версий</span>
      </div>
    `;
    card.onclick = () => openModal(model);
    grid.appendChild(card);
  });
}

function openModal(model) {
  cur = model;
  modalTitle.innerHTML = `${escapeHtml(model.name)} <small>${escapeHtml(model.codename)}</small>`;
  
  const items = stockData[model.codename] || {};
  const itemsArray = Object.values(items);
  
  // Фильтр по версии Android
  const androidVersions = [...new Set(itemsArray.map(r => r.android).filter(v => v))].sort((a, b) => parseFloat(b) - parseFloat(a));
  filterA.innerHTML = '<option value="all">Все версии</option>' + 
    androidVersions.map(v => `<option value="${escapeHtml(v)}">Android ${escapeHtml(v)}</option>`).join('');
  
  // Фильтр по региону
  const regions = [...new Set(itemsArray.map(r => r.region).filter(v => v))];
  filterR.innerHTML = '<option value="all">Все</option>' + 
    regions.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');
  
  selA = 'all';
  selR = 'all';
  filterA.value = 'all';
  filterR.value = 'all';
  
  renderTable();
  modal.classList.add('active');
}

function renderTable() {
  if (!cur) return;
  
  let items = stockData[cur.codename] || {};
  let itemsArray = Object.values(items);
  
  if (selA !== 'all') {
    itemsArray = itemsArray.filter(r => r.android === selA);
  }
  if (selR !== 'all') {
    itemsArray = itemsArray.filter(r => r.region === selR);
  }
  
  tableBody.innerHTML = '';
  emptyMsg.style.display = itemsArray.length ? 'none' : 'block';
  
  itemsArray.forEach(item => {
    const tr = document.createElement('tr');
    tr.className = 'rom-row';
    tr.innerHTML = `
      <td><span class="rom-name">${escapeHtml(item.name)}</span></td>
      <td><span style="color:#94a3b8"><i class="fab fa-android"></i> ${escapeHtml(item.android || '—')}</span></td>
      <td><span style="color:#94a3b8">${escapeHtml(item.region || 'Global')}</span></td>
      <td><code style="font-size:.78rem;color:#64748b;font-family:monospace">${escapeHtml(item.build || '—')}</code></td>
      <td><span class="badge badge-${item.status}">${escapeHtml(item.status)}</span></td>
      <td><span class="badge ${item.by_admin ? 'badge-admin' : 'badge-user'}">${item.by_admin ? '👑 Admin' : '👤 User'}</span></td>
      <td><a href="${item.url}" class="dl-btn" target="_blank" rel="noopener noreferrer"><i class="fas fa-download"></i> Скачать</a></td>
    `;
    tableBody.appendChild(tr);
  });
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

// Фильтр по бренду
document.querySelectorAll('#brandPills .pill').forEach(p => {
  p.onclick = () => {
    document.querySelectorAll('#brandPills .pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    brand = p.dataset.brand;
    render();
  };
});

// Поиск
search.oninput = e => {
  q = e.target.value;
  render();
};

// Сброс фильтров
document.getElementById('resetBtn').onclick = () => {
  document.querySelectorAll('#brandPills .pill').forEach(x => x.classList.remove('active'));
  const allBtn = document.querySelector('[data-brand="all"]');
  if(allBtn) allBtn.classList.add('active');
  brand = 'all';
  search.value = '';
  q = '';
  render();
};

// Закрытие модалки
closeBtn.onclick = () => modal.classList.remove('active');
modal.onclick = e => { if (e.target === modal) modal.classList.remove('active'); };

// Фильтры в модалке
filterA.onchange = e => { selA = e.target.value; renderTable(); };
filterR.onchange = e => { selR = e.target.value; renderTable(); };

// Загружаем данные
loadData();
</script>
<script src="../i18n.js"></script>
</body>
</html>
